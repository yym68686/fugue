name: Operational-domain guarded control-plane deploy
description: Uploads report-only operational-domain and build-vs-activation evidence before the atomic adapter may mutate production.

outputs:
  image-activation-convergence:
    description: complete only when no mandatory image-cache build remains build-only
    value: ${{ steps.image-activation-convergence.outputs.status }}
  pending-activation-artifacts:
    description: canonical comma-separated mandatory image-cache built-only artifacts
    value: ${{ steps.image-activation-convergence.outputs.pending_artifacts }}

runs:
  using: composite
  steps:
    - name: Prepare operational-domain report-only evidence
      id: prepare
      shell: bash
      env:
        FUGUE_RELEASE_DOMAIN_OPERATIONAL_PHASE: prepare
      run: ./scripts/upgrade_fugue_control_plane.sh

    - name: Upload operational-domain report-only evidence
      id: operational-report-upload
      if: ${{ always() && steps.prepare.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fugue-control-plane-operational-domain-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.FUGUE_RELEASE_DOMAIN_OPERATIONAL_REPORT_FILE }}
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: false
        overwrite: false

    - name: Upload build-vs-activation report-only evidence
      id: image-activation-report-upload
      if: ${{ always() && steps.prepare.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fugue-control-plane-build-activation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.FUGUE_RELEASE_DOMAIN_IMAGE_ACTIVATION_REPORT_DIR }}
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: false
        overwrite: false

    - name: Apply exact authorized control-plane release
      shell: bash
      env:
        FUGUE_RELEASE_DOMAIN_OPERATIONAL_PHASE: apply
        FUGUE_RELEASE_DOMAIN_OPERATIONAL_ARTIFACT_ID: ${{ steps.operational-report-upload.outputs.artifact-id }}
        FUGUE_RELEASE_DOMAIN_OPERATIONAL_ARTIFACT_DIGEST: ${{ steps.operational-report-upload.outputs.artifact-digest }}
        FUGUE_RELEASE_DOMAIN_OPERATIONAL_ARTIFACT_URL: ${{ steps.operational-report-upload.outputs.artifact-url }}
        FUGUE_RELEASE_DOMAIN_IMAGE_ACTIVATION_ARTIFACT_ID: ${{ steps.image-activation-report-upload.outputs.artifact-id }}
        FUGUE_RELEASE_DOMAIN_IMAGE_ACTIVATION_ARTIFACT_DIGEST: ${{ steps.image-activation-report-upload.outputs.artifact-digest }}
        FUGUE_RELEASE_DOMAIN_IMAGE_ACTIVATION_ARTIFACT_URL: ${{ steps.image-activation-report-upload.outputs.artifact-url }}
      run: ./scripts/upgrade_fugue_control_plane.sh

    - name: Verify image activation convergence
      id: image-activation-convergence
      shell: bash
      run: |
        set -euo pipefail
        readonly evidence_dir="${FUGUE_RELEASE_DOMAIN_IMAGE_ACTIVATION_REPORT_DIR}"
        result="$("${FUGUE_RELEASE_DOMAIN_EVIDENCE_TOOL}" image-activation-convergence \
          --build-artifact-plan "${evidence_dir}/build-artifact-plan.json" \
          --image-activation-plan "${evidence_dir}/image-activation-plan.json" \
          --image-activation-evidence "${evidence_dir}/image-activation-evidence.json")" || exit 1
        IFS=$'\t' read -r status pending extra <<<"${result}" || exit 1
        [[ -z "${extra:-}" ]] || exit 1
        case "${status}" in
          complete)
            [[ "${pending}" == '-' ]] || exit 1
            pending=''
            ;;
          pending)
            [[ "${pending}" =~ ^[a-z][a-z0-9_]*(,[a-z][a-z0-9_]*)*$ ]] || exit 1
            ;;
          *) exit 1 ;;
        esac
        {
          printf 'status=%s\n' "${status}"
          printf 'pending_artifacts=%s\n' "${pending}"
        } >>"${GITHUB_OUTPUT}"
