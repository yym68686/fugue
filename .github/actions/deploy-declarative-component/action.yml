name: Deploy one declarative Fugue component
description: Prepare, persist, execute, verify, and receipt one immutable component atom.
inputs:
  component:
    description: Exact component id from the bound production release plan.
    required: true
  registry-token:
    description: Read-only GHCR token used for live provenance verification.
    required: true
runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        # Production jobs run on a persistent self-hosted runner. Restoring a
        # shared module cache over its existing read-only module tree makes
        # setup-go fail before the declarative writer can run.
        cache: false
    - name: Download the immutable release plan
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: fugue-production-release-plan-${{ github.sha }}
        path: ${{ runner.temp }}/fugue-release-plan
    - name: Download the exact component artifact receipt
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: fugue-${{ inputs.component }}-artifact-${{ github.sha }}
        path: ${{ runner.temp }}/fugue-component-artifact
    - name: Preserve compiler-input archive reader and startup guard
      if: ${{ inputs.component == 'api' }}
      shell: bash
      env:
        CANDIDATE_REVISION: ${{ github.sha }}
      run: python3 -m scripts.compiler_input_storage --mode check-api-candidate --candidate-revision "${CANDIDATE_REVISION}"
    - name: Preserve single-copy artifact reader support
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        CANDIDATE_REVISION: ${{ github.sha }}
      run: python3 -m scripts.artifact_content_storage --component "${COMPONENT}" --candidate-revision "${CANDIDATE_REVISION}"
    - name: Prepare the durable server-side apply plan
      id: prepare
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        FUGUE_REGISTRY_USERNAME: ${{ github.actor }}
        FUGUE_REGISTRY_PASSWORD: ${{ inputs.registry-token }}
        PLAN: ${{ runner.temp }}/fugue-release-plan/fugue-production-release-plan.json
        RECEIPT: ${{ runner.temp }}/fugue-component-artifact/fugue-${{ inputs.component }}-artifact-receipt.json
        EXECUTION: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-${{ github.run_id }}-${{ github.run_attempt }}
        RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
      run: |
        set -euo pipefail
        go build -trimpath -o "${RELEASE_TOOL}" ./cmd/fugue-declarative-release
        if "${RELEASE_TOOL}" prepare "${PLAN}" "${COMPONENT}" "${RECEIPT}" "${EXECUTION}"; then
          exit 0
        else
          rc=$?
        fi
        if [[ "$rc" == 78 ]]; then
          echo 'mixed_activation=true' >>"$GITHUB_OUTPUT"
        fi
        exit "$rc"
    - name: Observe mixed Worker members without changing serving state
      id: mixed_members
      if: failure() && steps.prepare.outcome == 'failure' && steps.prepare.outputs.mixed_activation == 'true'
      shell: bash
      env:
        PLAN: ${{ runner.temp }}/fugue-release-plan/fugue-production-release-plan.json
        RECEIPT: ${{ runner.temp }}/fugue-component-artifact/fugue-${{ inputs.component }}-artifact-receipt.json
      run: |
        set -euo pipefail
        dir="$(mktemp -d "${RUNNER_TEMP}/worker-members.XXXXXXXX")"
        go run ./cmd/fugue-release-guardian worker-front-preflight --plan "$PLAN" --receipt "$RECEIPT" >"$dir/observation.json"
        echo "file=$dir/observation.json" >>"$GITHUB_OUTPUT"
    - name: Preserve the read-only mixed Worker observation
      if: failure() && steps.mixed_members.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fugue-${{ inputs.component }}-mixed-members-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.mixed_members.outputs.file }}
        if-no-files-found: error
        retention-days: 30
    - name: Upload the durable prewrite plan before mutation
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fugue-${{ inputs.component }}-execution-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: error
        include-hidden-files: false
        retention-days: 30
    - name: Select the reviewed production writer
      id: delivery
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        PLAN: ${{ runner.temp }}/fugue-release-plan/fugue-production-release-plan.json
        RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
      run: |
        set -euo pipefail
        writer="$("${RELEASE_TOOL}" emit-delivery "${PLAN}" "${COMPONENT}")"
        case "${writer}" in
          direct|guardian) ;;
          *) echo "unsupported production writer" >&2; exit 1 ;;
        esac
        printf 'writer=%s\n' "${writer}" >>"${GITHUB_OUTPUT}"
    - name: Verify the optional unselected Front rollout boundary
      if: steps.delivery.outputs.writer == 'direct'
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
      run: |
        set -euo pipefail
        guard="deploy/releases/${COMPONENT}/unselected-front.json"
        if [[ -e "$guard" || -L "$guard" ]]; then
          test -f "$guard" && test ! -L "$guard"
          git fetch origin main
          git diff --exit-code HEAD origin/main -- "deploy/releases/${COMPONENT}" .github/actions/deploy-declarative-component/action.yml scripts/check_unselected_front_roll.py scripts/retire_front_hostport.py scripts/observe_front_candidate.py scripts/reconcile_front_probe_transport.py scripts/replace_front_executor.py scripts/stage_front_serving_transport.py
          python3 -m scripts.check_unselected_front_roll "$guard"
        fi
    - name: Execute one direct declarative component atom
      if: steps.delivery.outputs.writer == 'direct'
      id: execute_direct
      continue-on-error: true
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        EXECUTION: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-${{ github.run_id }}-${{ github.run_attempt }}
        FUGUE_REGISTRY_USERNAME: ${{ github.actor }}
        FUGUE_REGISTRY_PASSWORD: ${{ inputs.registry-token }}
        RESULT: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-result.json
        RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
      run: |
        set -euo pipefail
        if [[ "$COMPONENT" == 'edge-worker-us-primary-a' || "$COMPONENT" == 'edge-worker-us-primary-a-hosted' || "$COMPONENT" == 'edge-worker-us-bwg-b-hosted' ]]; then
          git fetch origin main
          git diff --exit-code HEAD origin/main -- "deploy/releases/$COMPONENT" deploy/releases/components.json .github/actions/deploy-declarative-component/action.yml scripts/replace_idle_worker_slot.py scripts/run_node_worker_handoff.py scripts/retire_front_hostport.py scripts/front_connection_witness.py scripts/observe_front_candidate.py scripts/reconcile_front_probe_transport.py
          python3 -m scripts.replace_idle_worker_slot "deploy/releases/$COMPONENT/idle-slot.json" "${EXECUTION}" "${RELEASE_TOOL}" "${RESULT}" "${RUNNER_TEMP}/fugue-worker-idle-replacement-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
        else
          "${RELEASE_TOOL}" execute "${EXECUTION}" >"${RESULT}"
        fi
    - name: Retain single-node Worker preparation evidence
      if: always() && (inputs.component == 'edge-worker-us-primary-a' || inputs.component == 'edge-worker-us-primary-a-hosted' || inputs.component == 'edge-worker-us-bwg-b-hosted') && steps.execute_direct.outcome != 'skipped'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fugue-fixed-worker-preparation-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/fugue-worker-idle-replacement-${{ github.run_id }}-${{ github.run_attempt }}.json
        if-no-files-found: warn
        retention-days: 30
    - name: Publish one immutable target to the in-cluster Guardian
      if: steps.delivery.outputs.writer == 'guardian'
      id: execute_guardian
      continue-on-error: true
      shell: bash
      env:
        EXECUTION: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-${{ github.run_id }}-${{ github.run_attempt }}
        RESULT: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-result.json
        RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
      run: |
        set -euo pipefail
        rc=0
        "${RELEASE_TOOL}" guardian-submit "${EXECUTION}" >"${RESULT}" || rc=$?
        if (( rc != 0 )) && jq -es --slurpfile plan "${EXECUTION}/execution-plan.json" '
          length == 1 and ($plan | length == 1) and (.[0] |
          .state == "rollout_pending" and .component == $plan[0].component and
          (.currentRecordDigest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
          (.targetRecordDigest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
          (.rolloutReceiptDigest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
          (.workerDrainPlanDigest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
          .workerDrainPlanDigest == $plan[0].planDigest and
          .currentRecordDigest == .lastSuccessfulLkg and .currentRecordDigest != .targetRecordDigest)
        ' "${RESULT}" >/dev/null; then
          echo 'worker_drain_wait=true' >>"${GITHUB_OUTPUT}"
        fi
        exit "${rc}"
    - name: Adopt a committed Guardian authority after executor failure
      if: steps.delivery.outputs.writer == 'guardian' && steps.execute_guardian.outcome == 'failure' && steps.execute_guardian.outputs.worker_drain_wait != 'true'
      shell: bash
      env:
        EXECUTION: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-${{ github.run_id }}-${{ github.run_attempt }}
        FUGUE_REGISTRY_USERNAME: ${{ github.actor }}
        FUGUE_REGISTRY_PASSWORD: ${{ inputs.registry-token }}
        RESULT: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-result.json
        RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
      run: |
        set -euo pipefail
        "${RELEASE_TOOL}" adopt-committed-monitor "${EXECUTION}" >"${RESULT}.adopted"
        mv "${RESULT}.adopted" "${RESULT}"
    - name: Report retained Worker release waiting for connections
      if: steps.execute_guardian.outputs.worker_drain_wait == 'true'
      shell: bash
      run: |
        echo 'Guardian retained the desired Worker release. Live connections are still draining. The rollout has not completed.' >>"${GITHUB_STEP_SUMMARY}"
        exit 1
    - name: Reconcile terminal state read-only after executor failure
      if: steps.delivery.outputs.writer == 'direct' && steps.execute_direct.outcome == 'failure'
      shell: bash
      env:
        EXECUTION: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-${{ github.run_id }}-${{ github.run_attempt }}
        FUGUE_REGISTRY_USERNAME: ${{ github.actor }}
        FUGUE_REGISTRY_PASSWORD: ${{ inputs.registry-token }}
        RESULT: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-result.json
        RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
      run: |
        set -uo pipefail
        set +e
        "${RELEASE_TOOL}" reconcile "${EXECUTION}" "${RESULT}" >"${RESULT}.reconcile"
        rc=$?
        set -e
        if [[ -s "${RESULT}.reconcile" ]]; then
          mv "${RESULT}.reconcile" "${RESULT}"
        else
          rm -f "${RESULT}.reconcile"
        fi
        exit "${rc}"
    - name: Upload terminal component receipt
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fugue-${{ inputs.component }}-terminal-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/fugue-${{ inputs.component }}-execution-result.json
        if-no-files-found: warn
        include-hidden-files: false
        retention-days: 30
