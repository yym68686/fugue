name: deploy edge-control shadow

on:
  workflow_run:
    workflows:
      - publish edge-control image
    types:
      - completed

permissions: {}

concurrency:
  group: fugue-edge-control-shadow-production-v1
  cancel-in-progress: false

jobs:
  deploy-shadow:
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.run_attempt == 1 }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - fugue
      - control-plane
    timeout-minutes: 35
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact image source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact source and immutable image receipt
        id: authorize
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == 'workflow_run' ]]
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]]
          [[ "${GITHUB_RUN_ATTEMPT}" == '1' && "${SOURCE_RUN_ATTEMPT}" == '1' ]]
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SOURCE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_HEAD_BRANCH}" == 'main' && "${SOURCE_EVENT}" == 'push' ]]
          [[ "${SOURCE_CONCLUSION}" == 'success' ]]
          [[ "${SOURCE_WORKFLOW_PATH}" == '.github/workflows/publish-edge-control-image.yml' ]]
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "${SOURCE_HEAD_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          read -r commit parent extra <<<"$(git rev-list --parents -n 1 "${SOURCE_HEAD_SHA}")"
          [[ "${commit}" == "${SOURCE_HEAD_SHA}" && "${parent}" =~ ^[0-9a-f]{40}$ && -z "${extra:-}" ]]

          remote_main="$(timeout --kill-after=2s 10s gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${remote_main}" == "${SOURCE_HEAD_SHA}" ]]
          source_run="$(timeout --kill-after=2s 10s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          SOURCE_RUN="${source_run}" python3 - <<'PY'
          import json, os
          value=json.loads(os.environ["SOURCE_RUN"])
          expected={
              "id":int(os.environ["SOURCE_RUN_ID"]), "run_attempt":1, "event":"push",
              "head_branch":"main", "head_sha":os.environ["SOURCE_HEAD_SHA"],
              "status":"completed", "conclusion":"success",
              "path":".github/workflows/publish-edge-control-image.yml",
          }
          for key,want in expected.items():
              if value.get(key)!=want: raise SystemExit(f"source run {key} drifted")
          PY

          wait_for_gate() {
            local workflow="$1" deadline now payload result
            deadline=$(( $(date +%s) + 1200 ))
            while true; do
              payload="$(timeout --kill-after=2s 10s gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=push&per_page=100")"
              result="$(PAYLOAD="${payload}" EXPECTED_SHA="${SOURCE_HEAD_SHA}" python3 - <<'PY'
          import json,os
          runs=[r for r in json.loads(os.environ["PAYLOAD"]).get("workflow_runs",[])
                if r.get("head_sha")==os.environ["EXPECTED_SHA"] and r.get("run_attempt")==1
                and r.get("event")=="push" and r.get("head_branch")=="main"]
          if len(runs)!=1: print("cardinality"); raise SystemExit
          run=runs[0]
          print("success" if run.get("status")=="completed" and run.get("conclusion")=="success"
                else "failure" if run.get("status")=="completed" else "pending")
          PY
              )"
              case "${result}" in
                success) return 0 ;;
                failure|cardinality) return 1 ;;
                pending) ;;
                *) return 1 ;;
              esac
              now="$(date +%s)"
              (( now < deadline )) || return 1
              sleep 15
            done
          }
          wait_for_gate ci.yml

          for state in in_progress queued; do
            runs="$(timeout --kill-after=2s 10s gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?status=${state}&per_page=100")"
            RUNS="${runs}" THIS_RUN="${GITHUB_RUN_ID}" python3 - <<'PY'
          import json,os
          blocked={
              ".github/workflows/deploy-control-plane.yml",
              ".github/workflows/release-public-data-plane.yml",
              ".github/workflows/adopt-public-data-plane-helm-baseline.yml",
              ".github/workflows/recover-public-data-plane-helm-adoption.yml",
              ".github/workflows/remediate-edge-inactive-slot.yml",
          }
          conflicts=[r for r in json.loads(os.environ["RUNS"]).get("workflow_runs",[])
                     if str(r.get("id"))!=os.environ["THIS_RUN"] and r.get("path") in blocked]
          if conflicts: raise SystemExit("another production cluster mutation lane is active")
          PY
          done

          evidence_dir="${RUNNER_TEMP}/edge-control-shadow-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${evidence_dir}"
          artifacts="$(timeout --kill-after=2s 10s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          artifact_fields="$(ARTIFACTS="${artifacts}" python3 - <<'PY'
          import json,os,re
          name=f"edge-control-image-{os.environ['SOURCE_HEAD_SHA']}-1"
          matches=[a for a in json.loads(os.environ["ARTIFACTS"]).get("artifacts",[])
                   if a.get("name")==name and a.get("expired") is False]
          if len(matches)!=1: raise SystemExit("image receipt artifact cardinality drifted")
          item=matches[0]; digest=item.get("digest")
          if not isinstance(item.get("id"),int) or re.fullmatch(r"sha256:[0-9a-f]{64}",str(digest)) is None:
              raise SystemExit("image receipt artifact identity drifted")
          workflow=item.get("workflow_run") or {}
          if str(workflow.get("id"))!=os.environ["SOURCE_RUN_ID"] or workflow.get("head_sha")!=os.environ["SOURCE_HEAD_SHA"]:
              raise SystemExit("image receipt artifact attribution drifted")
          print(f"{item['id']}\t{digest}")
          PY
          )"
          IFS=$'\t' read -r artifact_id artifact_digest extra <<<"${artifact_fields}"
          [[ "${artifact_id}" =~ ^[1-9][0-9]*$ && "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ && -z "${extra:-}" ]]
          timeout --kill-after=5s 30s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" >"${evidence_dir}/receipt.zip"
          [[ "sha256:$(sha256sum "${evidence_dir}/receipt.zip" | awk '{print $1}')" == "${artifact_digest}" ]]

          owner_lc="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          expected_image="ghcr.io/${owner_lc}/fugue-edge-control"
          receipt_fields="$(RECEIPT_ZIP="${evidence_dir}/receipt.zip" EXPECTED_IMAGE="${expected_image}" python3 - <<'PY'
          import hashlib,json,os,re,zipfile
          with zipfile.ZipFile(os.environ["RECEIPT_ZIP"]) as archive:
              if archive.namelist()!=["edge-control-image-receipt.json"]:
                  raise SystemExit("image receipt archive inventory drifted")
              raw=archive.read("edge-control-image-receipt.json")
          if not raw.endswith(b"\n") or raw.endswith(b"\n\n"):
              raise SystemExit("image receipt is not canonical one-LF JSON")
          value=json.loads(raw)
          if set(value)!={"schema","source_commit","image","digest","run_id","run_attempt","receipt_digest"}:
              raise SystemExit("image receipt schema drifted")
          if (value.get("schema")!="edge-control-image-receipt/v1" or
              value.get("source_commit")!=os.environ["SOURCE_HEAD_SHA"] or
              value.get("image")!=os.environ["EXPECTED_IMAGE"] or
              value.get("run_id")!=int(os.environ["SOURCE_RUN_ID"]) or value.get("run_attempt")!=1 or
              re.fullmatch(r"sha256:[0-9a-f]{64}",str(value.get("digest"))) is None):
              raise SystemExit("image receipt identity drifted")
          claimed=value.pop("receipt_digest")
          actual="sha256:"+hashlib.sha256(json.dumps(value,separators=(",",":"),sort_keys=True).encode()).hexdigest()
          if claimed!=actual: raise SystemExit("image receipt digest drifted")
          print(f"{value['image']}\t{value['digest']}\t{claimed}")
          PY
          )"
          IFS=$'\t' read -r image image_digest receipt_digest extra <<<"${receipt_fields}"
          [[ -z "${extra:-}" ]]
          {
            printf 'source_sha=%s\n' "${SOURCE_HEAD_SHA}"
            printf 'image=%s\n' "${image}"
            printf 'image_digest=%s\n' "${image_digest}"
            printf 'image_receipt_digest=%s\n' "${receipt_digest}"
            printf 'source_run_id=%s\n' "${SOURCE_RUN_ID}"
            printf 'source_artifact_id=%s\n' "${artifact_id}"
            printf 'source_artifact_digest=%s\n' "${artifact_digest}"
          } >>"${GITHUB_OUTPUT}"

      - name: Deploy and verify isolated boundary shadow
        env:
          FUGUE_EDGE_CONTROL_EXPECTED_SOURCE: ${{ steps.authorize.outputs.source_sha }}
          FUGUE_EDGE_CONTROL_IMAGE: ${{ steps.authorize.outputs.image }}
          FUGUE_EDGE_CONTROL_IMAGE_DIGEST: ${{ steps.authorize.outputs.image_digest }}
          FUGUE_EDGE_CONTROL_IMAGE_RECEIPT_DIGEST: ${{ steps.authorize.outputs.image_receipt_digest }}
          FUGUE_EDGE_CONTROL_SOURCE_RUN_ID: ${{ steps.authorize.outputs.source_run_id }}
          FUGUE_EDGE_CONTROL_SOURCE_ARTIFACT_ID: ${{ steps.authorize.outputs.source_artifact_id }}
          FUGUE_EDGE_CONTROL_SOURCE_ARTIFACT_DIGEST: ${{ steps.authorize.outputs.source_artifact_digest }}
          FUGUE_EDGE_CONTROL_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          FUGUE_EDGE_CONTROL_RELEASE: edge-control
          FUGUE_LEGACY_RELEASE: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_LEGACY_RELEASE_FULLNAME: ${{ vars.FUGUE_RELEASE_FULLNAME || 'fugue-fugue' }}
          FUGUE_PRODUCT_HEALTH_URL: ${{ vars.FUGUE_API_URL || 'https://api.fugue.pro' }}/healthz
          FUGUE_EDGE_CONTROL_RECEIPT_PATH: ${{ runner.temp }}/edge-control-shadow-result/receipt.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_main="$(timeout --kill-after=2s 10s gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${remote_main}" == "${FUGUE_EDGE_CONTROL_EXPECTED_SOURCE}" ]]
          ./scripts/deploy_edge_control_shadow.sh

      - name: Upload immutable shadow release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-control-shadow-${{ steps.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/edge-control-shadow-result/receipt.json
          if-no-files-found: error
          retention-days: 90
