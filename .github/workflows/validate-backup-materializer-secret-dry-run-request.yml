name: validate backup materializer Secret dry-run request

on:
  push:
    branches:
      - main
    paths:
      - internal/backupcontrol/**
      - internal/backupmaterializer/contract/**
      - internal/backupmaterializer/materialization/**
      - internal/backupmaterializer/reconcile/**
      - internal/backupmaterializer/secretdryrunrequest/**
      - .github/workflows/validate-backup-materializer-secret-dry-run-request.yml
      - go.mod
      - go.sum
  pull_request:
    paths:
      - internal/backupcontrol/**
      - internal/backupmaterializer/contract/**
      - internal/backupmaterializer/materialization/**
      - internal/backupmaterializer/reconcile/**
      - internal/backupmaterializer/secretdryrunrequest/**
      - .github/workflows/validate-backup-materializer-secret-dry-run-request.yml
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: backup-materializer-secret-dry-run-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-only:
    name: validate backup materializer Secret dry-run request (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify immutable request handoff and pure dependency boundary
        run: |
          set -euo pipefail
          package=./internal/backupmaterializer/secretdryrunrequest
          go test "${package}" -count=10
          go test -race "${package}" -count=3
          go vet "${package}"
          direct_deps="$(go list -f '{{join .Imports "\n"}}' "${package}")"
          if grep -Eq '^(context|database/sql|net|net/http|os|os/exec)$' <<<"${direct_deps}"; then
            echo 'backup materializer Secret dry-run request gained a capability-bearing direct dependency' >&2
            exit 1
          fi
          deps="$(go list -deps "${package}")"
          if grep -Eq '^(context|database/sql|net|net/http|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(agent|client|composition|dryrunreconciler|httpapi|legacysource|localissuer|secretreader|secretwriter|storesource|validationagent|validationcomposition|validationcycle)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${deps}"; then
            echo 'backup materializer Secret dry-run request dependency boundary widened' >&2
            exit 1
          fi
          local_deps="$(grep '^fugue/' <<<"${deps}" | sort -u)"
          expected_local_deps=$'fugue/internal/backupcontrol\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/secretdryrunrequest'
          if [[ "${local_deps}" != "${expected_local_deps}" ]]; then
            printf 'backup materializer Secret dry-run request local dependency closure drifted:\n%s\n' "${local_deps}" >&2
            exit 1
          fi
