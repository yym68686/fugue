name: observe-edge-activation-watchdog

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fugue-edge-activation-watchdog-report-v1
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main observation policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1
      - name: Observe delayed edge activation
        env:
          FUGUE_EDGE_ACTIVATION_API_URL: ${{ vars.FUGUE_API_URL }}
          FUGUE_EDGE_ACTIVATION_API_KEY: ${{ secrets.FUGUE_BOOTSTRAP_KEY }}
          FUGUE_EDGE_WATCHDOG_EVIDENCE_DIR: ${{ runner.temp }}/edge-activation-watchdog
        run: ./scripts/observe_edge_activation_watchdog.sh
      - name: Upload bounded watchdog evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-activation-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/edge-activation-watchdog/evidence.json
          if-no-files-found: error
          retention-days: 30
