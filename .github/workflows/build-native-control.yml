name: build-native-control

on:
  push:
    paths:
      - '.github/workflows/build-native-control.yml'
      - 'cmd/fugue-production-control/**'
      - 'cmd/fugue-release-bootstrap/**'
      - 'cmd/fugue-release-guardian/**'
      - 'cmd/fugue-declarative-release/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  candidate-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Linux candidate tools without production configuration
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          stage="$(mktemp -d "${RUNNER_TEMP}/fugue-native-control.XXXXXX")"
          for tool in fugue-production-control fugue-release-bootstrap fugue-release-guardian fugue-declarative-release; do
            go build -mod=readonly -trimpath -ldflags='-s -w' -o "$stage/$tool" "./cmd/$tool"
          done
          git rev-parse HEAD > "$stage/SOURCE_REVISION"
          (
            cd "$stage"
            sha256sum fugue-production-control fugue-release-bootstrap fugue-release-guardian fugue-declarative-release SOURCE_REVISION > SHA256SUMS
          )
          printf 'FUGUE_CANDIDATE_DIRECTORY=%s\n' "$stage" >> "$GITHUB_ENV"
      - name: Upload candidates to CI only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-control-linux-amd64-candidates
          path: ${{ env.FUGUE_CANDIDATE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 7
