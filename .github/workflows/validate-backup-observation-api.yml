name: validate backup observation API

on:
  push:
    branches:
      - main
    paths:
      - internal/api/backup_observation.go
      - internal/api/backup_observation_test.go
      - internal/api/routes_gen.go
      - internal/apispec/backup_observation_test.go
      - internal/apispec/spec.go
      - internal/apispec/spec_gen.go
      - internal/auth/auth.go
      - internal/auth/backup_observer.go
      - internal/backupadapter/**
      - internal/backupcontrol/**
      - internal/backupidentity/**
      - internal/backupobserver/**
      - internal/store/backup_observation.go
      - internal/store/backup_observation_test.go
      - cmd/fugue-api/backup_observer_identity.go
      - cmd/fugue-api/main.go
      - cmd/fugue-openapi-gen/**
      - openapi/openapi.yaml
      - internal/componentmanifest/backup_observation_api_workflow_test.go
      - docs/architecture/component-ownership-v1.yaml
      - .github/workflows/validate-backup-observation-api.yml
      - go.mod
      - go.sum
  pull_request:
    paths:
      - internal/api/backup_observation.go
      - internal/api/backup_observation_test.go
      - internal/api/routes_gen.go
      - internal/apispec/backup_observation_test.go
      - internal/apispec/spec.go
      - internal/apispec/spec_gen.go
      - internal/auth/auth.go
      - internal/auth/backup_observer.go
      - internal/backupadapter/**
      - internal/backupcontrol/**
      - internal/backupidentity/**
      - internal/backupobserver/**
      - internal/store/backup_observation.go
      - internal/store/backup_observation_test.go
      - cmd/fugue-api/backup_observer_identity.go
      - cmd/fugue-api/main.go
      - cmd/fugue-openapi-gen/**
      - openapi/openapi.yaml
      - internal/componentmanifest/backup_observation_api_workflow_test.go
      - docs/architecture/component-ownership-v1.yaml
      - .github/workflows/validate-backup-observation-api.yml
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: backup-observation-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-only:
    name: validate backup observation API (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify GET-only redacted observation bridge
        run: |
          set -euo pipefail
          go test ./internal/api -run 'Test(BackupObservationAPI|ExactBackupObservationSpecDigest)' -count=1
          go test -race ./internal/api -run 'Test(BackupObservationAPI|ExactBackupObservationSpecDigest)' -count=3
          go test ./internal/apispec -run 'Test(BackupObservationOpenAPIContractIsPrivateStrictAndReadOnly|GeneratedArtifactsAreUpToDate|EmbeddedSpecIsValid)' -count=1
          go test ./internal/componentmanifest -run TestBackupObservationAPIWorkflowIsReadOnly -count=1
          go vet ./internal/api ./internal/apispec ./internal/auth ./internal/backupadapter ./internal/backupcontrol ./internal/backupidentity ./internal/backupobserver ./internal/store
          go run ./cmd/fugue-openapi-gen -spec openapi/openapi.yaml -routes-out internal/api/routes_gen.go -spec-out internal/apispec/spec_gen.go -check
