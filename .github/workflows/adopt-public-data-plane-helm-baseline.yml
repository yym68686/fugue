name: adopt-public-data-plane-helm-baseline

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit to adopt. Must equal the checked-out commit.
        required: true
        type: string
      dry_run:
        description: Build and verify the typed Stage1 transaction without taking the Lease or writing Helm/Kubernetes.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fugue-production-cluster-mutation-v1
  cancel-in-progress: false

jobs:
  adopt:
    runs-on:
      - self-hosted
      - linux
      - x64
      - fugue
      - control-plane
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify immutable workflow identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ && "${GITHUB_RUN_ATTEMPT}" == '1' ]]
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SHA}" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ -z "${FUGUE_PUBLIC_DATA_PLANE_ADOPTION_COORDINATION_LIBRARY:-}" ]]
          [[ -z "${FUGUE_PUBLIC_DATA_PLANE_ADOPTION_RECOVERY_LIBRARY:-}" ]]

      - name: Build typed adoption tools
        run: |
          set -euo pipefail
          install -d -m 0700 ./bin
          go build -trimpath -o ./bin/fugue-public-data-plane-adoption ./cmd/fugue-public-data-plane-adoption
          go build -trimpath -o ./bin/fugue-release-domain-evidence ./cmd/fugue-release-domain-evidence
          bash -n ./scripts/adopt_public_data_plane_helm_baseline.sh

      - name: Execute dedicated authoritative DNS Stage1
        env:
          FUGUE_EXPECTED_SHA: ${{ inputs.expected_sha }}
          FUGUE_PUBLIC_DATA_PLANE_ADOPTION_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          FUGUE_PUBLIC_DATA_PLANE_ADOPTION_EVIDENCE_DIR: ${{ runner.temp }}/public-data-plane-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_RELEASE_FULLNAME: ${{ vars.FUGUE_RELEASE_FULLNAME || 'fugue-fugue' }}
          FUGUE_NODE_LOCAL_DNS_NAMESPACE: ${{ vars.FUGUE_NODE_LOCAL_DNS_NAMESPACE || 'kube-system' }}
          FUGUE_NODE_LOCAL_DNS_PRESERVED_NAME: ${{ vars.FUGUE_NODE_LOCAL_DNS_PRESERVED_NAME || '' }}
          FUGUE_NODE_LOCAL_DNS_ACTIVE_NAME: ${{ vars.FUGUE_NODE_LOCAL_DNS_ACTIVE_NAME || '' }}
          FUGUE_NODE_LOCAL_DNS_UPSTREAM_NAME: ${{ vars.FUGUE_NODE_LOCAL_DNS_UPSTREAM_NAME || '' }}
          FUGUE_CONTROL_PLANE_POSTGRES_NAME: ${{ vars.FUGUE_CONTROL_PLANE_POSTGRES_NAME || '' }}
          FUGUE_CONTROL_PLANE_POSTGRES_SECRET_NAME: ${{ vars.FUGUE_CONTROL_PLANE_POSTGRES_SECRET_NAME || '' }}
        run: ./scripts/adopt_public_data_plane_helm_baseline.sh

      - name: Publish immutable Stage1 handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-data-plane-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-data-plane-adoption-${{ github.run_id }}-${{ github.run_attempt }}/transaction.json
            ${{ runner.temp }}/public-data-plane-adoption-${{ github.run_id }}-${{ github.run_attempt }}/execution-trace.json
            ${{ runner.temp }}/public-data-plane-adoption-${{ github.run_id }}-${{ github.run_attempt }}/stage1-baseline.json
          if-no-files-found: error
          retention-days: 30
