name: build backup materializer image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.backup-materializer
      - cmd/fugue-backup-materializer/**
      - cmd/fugue-backup-materializer-validator/**
      - internal/backupcontrol/**
      - internal/backupmaterializer/agent/**
      - internal/backupmaterializer/validationagent/**
      - internal/backupmaterializer/validationcomposition/**
      - internal/backupmaterializer/client/**
      - internal/backupmaterializer/contract/**
      - internal/backupmaterializer/materialization/**
      - internal/backupmaterializer/reconcile/**
      - internal/backupmaterializer/reconciler/**
      - internal/backupmaterializer/secretreader/**
      - deploy/helm/fugue-backup-materializer/**
      - scripts/test_backup_materializer_image.sh
      - .github/workflows/build-backup-materializer-image.yml
      - go.mod
      - go.sum
  pull_request:
    paths:
      - Dockerfile.backup-materializer
      - cmd/fugue-backup-materializer/**
      - cmd/fugue-backup-materializer-validator/**
      - internal/backupcontrol/**
      - internal/backupmaterializer/agent/**
      - internal/backupmaterializer/validationagent/**
      - internal/backupmaterializer/validationcomposition/**
      - internal/backupmaterializer/client/**
      - internal/backupmaterializer/contract/**
      - internal/backupmaterializer/materialization/**
      - internal/backupmaterializer/reconcile/**
      - internal/backupmaterializer/reconciler/**
      - internal/backupmaterializer/secretreader/**
      - deploy/helm/fugue-backup-materializer/**
      - scripts/test_backup_materializer_image.sh
      - .github/workflows/build-backup-materializer-image.yml
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: backup-materializer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    name: build and probe materializer (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      - name: Test the independent read-only dependency closure
        run: |
          set -euo pipefail
          go test \
            ./cmd/fugue-backup-materializer \
            ./internal/backupcontrol \
            ./internal/backupmaterializer/agent \
            ./internal/backupmaterializer/client \
            ./internal/backupmaterializer/client/projected \
            ./internal/backupmaterializer/materialization \
            ./internal/backupmaterializer/reconcile \
            ./internal/backupmaterializer/reconciler \
            ./internal/backupmaterializer/secretreader \
            ./internal/backupmaterializer/secretreader/projected
          go test -race \
            ./cmd/fugue-backup-materializer \
            ./internal/backupmaterializer/agent \
            ./internal/backupmaterializer/reconciler \
            -count=3
          deps="$(go list -deps ./cmd/fugue-backup-materializer)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${deps}"; then
            echo 'backup materializer dependency boundary widened' >&2
            exit 1
          fi
          local_deps="$(grep '^fugue/' <<<"${deps}" | sort -u)"
          expected_local_deps=$'fugue/cmd/fugue-backup-materializer\nfugue/internal/backupcontrol\nfugue/internal/backupmaterializer/agent\nfugue/internal/backupmaterializer/client\nfugue/internal/backupmaterializer/client/projected\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/reconciler\nfugue/internal/backupmaterializer/secretreader\nfugue/internal/backupmaterializer/secretreader/projected'
          if [[ "${local_deps}" != "${expected_local_deps}" ]]; then
            printf 'backup materializer local dependency closure drifted:\n%s\n' "${local_deps}" >&2
            exit 1
          fi
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -buildvcs=false -o "/tmp/fugue-backup-materializer-${arch}" ./cmd/fugue-backup-materializer
          done

      - name: Validate the deployment-disabled cell chart
        run: |
          set -euo pipefail
          helm lint deploy/helm/fugue-backup-materializer
          go test ./deploy/helm/fugue-backup-materializer
          rendered="$(helm template backup-materializer deploy/helm/fugue-backup-materializer)"
          if [[ -n "$(tr -d '[:space:]' <<<"${rendered}")" ]]; then
            echo 'disabled backup-materializer chart rendered Kubernetes resources' >&2
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image locally without publishing
        env:
          IMAGE_REF: fugue-backup-materializer:${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile.backup-materializer \
            --tag "${IMAGE_REF}" \
            --load \
            .

      - name: Probe the local image
        run: scripts/test_backup_materializer_image.sh "fugue-backup-materializer:${GITHUB_SHA}"
