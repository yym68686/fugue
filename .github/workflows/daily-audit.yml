name: daily-audit

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      shadow_case:
        description: 'Optional non-authorizing prepush comparison'
        type: choice
        options:
          - none
          - queue-runtime
          - queue-test
          - host-policy-test
          - backup-runtime
          - retirement-test
          - cross-domain
          - contract-tracking-scope
          - contract-generator-consumer
          - contract-retirement-scope
        default: none
      shadow_incremental:
        description: 'Use distinct edits and independent baseline caches for a timing case'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: make test

  shadow-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.shadow_case != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOFLAGS: -p=2
      PYTHONDONTWRITEBYTECODE: '1'
      SHADOW_CASE: ${{ inputs.shadow_case }}
      SHADOW_INCREMENTAL: ${{ inputs.shadow_incremental }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare independent cache and representative edit
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fugue-shadow-evidence"
          mkdir -p "$evidence" "$RUNNER_TEMP/fugue-shadow-go-cache"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          go mod download 2> "$evidence/download.stderr"
          git status --porcelain > "$evidence/checkout-status.txt"
          if [[ "$SHADOW_CASE" != contract-* && "$SHADOW_INCREMENTAL" != true ]]; then
            python3 -m scripts.prepush_shadow_fixture --case "$SHADOW_CASE" 2> "$evidence/fixture.stderr"
            git diff --check
            git diff --binary > "$evidence/representative.patch"
          fi
      - name: Compare real native and artifact dependency graphs
        if: ${{ !startsWith(inputs.shadow_case, 'contract-') && !inputs.shadow_incremental }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.prepush_shadow --base HEAD --compare-target linux/amd64 --compare-target linux/arm64 > "$RUNNER_TEMP/fugue-shadow-evidence/targets.json"
      - name: Prove a downstream contract is selected and catches a regression
        if: ${{ startsWith(inputs.shadow_case, 'contract-') }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fugue-shadow-evidence"
          python3 -m scripts.prepush_shadow_contract --case "$SHADOW_CASE" > "$evidence/contract-witness.json" 2> "$evidence/contract-witness.stderr"
          git diff --check
          git diff --binary > "$evidence/representative.patch"
      - name: Run paired shadow experiment without a production receipt
        if: ${{ !startsWith(inputs.shadow_case, 'contract-') && !inputs.shadow_incremental }}
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/fugue-shadow-go-cache
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fugue-shadow-evidence"
          python3 -m scripts.prepush_replay --case "$SHADOW_CASE" --base HEAD --samples 20 --full-oracle --oracle-timeout 1200 > "$evidence/replay.json" 2> "$evidence/replay.stderr"
      - name: Run paired incremental experiment without a production receipt
        if: ${{ !startsWith(inputs.shadow_case, 'contract-') && inputs.shadow_incremental }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fugue-shadow-evidence"
          python3 -m scripts.prepush_replay --incremental --case "$SHADOW_CASE" --base HEAD --samples 20 --oracle-timeout 1200 > "$evidence/incremental-replay.json" 2> "$evidence/incremental-replay.stderr"
      - name: Preserve experiment or diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-shadow-evidence-${{ github.sha }}-${{ inputs.shadow_case }}
          path: ${{ runner.temp }}/fugue-shadow-evidence
          if-no-files-found: error
