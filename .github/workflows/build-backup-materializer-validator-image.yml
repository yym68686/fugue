name: build backup materializer validator image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.backup-materializer-validator
      - cmd/fugue-backup-materializer-validator/**
      - internal/backupcontrol/**
      - internal/backupmaterializer/client/**
      - internal/backupmaterializer/contract/**
      - internal/backupmaterializer/dryrunreconciler/**
      - internal/backupmaterializer/materialization/**
      - internal/backupmaterializer/reconcile/**
      - internal/backupmaterializer/reconciler/**
      - internal/backupmaterializer/secretreader/**
      - internal/backupmaterializer/secretwriter/**
      - internal/backupmaterializer/validationagent/**
      - internal/backupmaterializer/validationcomposition/**
      - internal/backupmaterializer/validationcycle/**
      - scripts/test_backup_materializer_validator_image.sh
      - .github/workflows/build-backup-materializer-validator-image.yml
      - go.mod
      - go.sum
  pull_request:
    paths:
      - Dockerfile.backup-materializer-validator
      - cmd/fugue-backup-materializer-validator/**
      - internal/backupcontrol/**
      - internal/backupmaterializer/client/**
      - internal/backupmaterializer/contract/**
      - internal/backupmaterializer/dryrunreconciler/**
      - internal/backupmaterializer/materialization/**
      - internal/backupmaterializer/reconcile/**
      - internal/backupmaterializer/reconciler/**
      - internal/backupmaterializer/secretreader/**
      - internal/backupmaterializer/secretwriter/**
      - internal/backupmaterializer/validationagent/**
      - internal/backupmaterializer/validationcomposition/**
      - internal/backupmaterializer/validationcycle/**
      - scripts/test_backup_materializer_validator_image.sh
      - .github/workflows/build-backup-materializer-validator-image.yml
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: backup-materializer-validator-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    name: build and probe validator (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test the independent dry-run validator closure
        run: |
          set -euo pipefail
          go test \
            ./cmd/fugue-backup-materializer-validator \
            ./internal/backupcontrol \
            ./internal/backupmaterializer/client \
            ./internal/backupmaterializer/client/projected \
            ./internal/backupmaterializer/dryrunreconciler \
            ./internal/backupmaterializer/materialization \
            ./internal/backupmaterializer/reconcile \
            ./internal/backupmaterializer/reconciler \
            ./internal/backupmaterializer/secretreader \
            ./internal/backupmaterializer/secretreader/projected \
            ./internal/backupmaterializer/secretwriter \
            ./internal/backupmaterializer/secretwriter/projected \
            ./internal/backupmaterializer/validationagent \
            ./internal/backupmaterializer/validationcomposition \
            ./internal/backupmaterializer/validationcycle
          go test -race \
            ./cmd/fugue-backup-materializer-validator \
            ./internal/backupmaterializer/validationagent \
            ./internal/backupmaterializer/validationcomposition \
            ./internal/backupmaterializer/validationcycle \
            -count=3
          deps="$(go list -deps ./cmd/fugue-backup-materializer-validator)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(agent|composition|httpapi|legacysource|localissuer|storesource)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${deps}"; then
            echo 'backup materializer validator image dependency boundary widened' >&2
            exit 1
          fi
          local_deps="$(grep '^fugue/' <<<"${deps}" | sort -u)"
          expected_local_deps=$'fugue/cmd/fugue-backup-materializer-validator\nfugue/internal/backupcontrol\nfugue/internal/backupmaterializer/client\nfugue/internal/backupmaterializer/client/projected\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/dryrunreconciler\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/reconciler\nfugue/internal/backupmaterializer/secretreader\nfugue/internal/backupmaterializer/secretreader/projected\nfugue/internal/backupmaterializer/secretwriter\nfugue/internal/backupmaterializer/secretwriter/projected\nfugue/internal/backupmaterializer/validationagent\nfugue/internal/backupmaterializer/validationcomposition\nfugue/internal/backupmaterializer/validationcycle'
          if [[ "${local_deps}" != "${expected_local_deps}" ]]; then
            printf 'backup materializer validator image local dependency closure drifted:\n%s\n' "${local_deps}" >&2
            exit 1
          fi
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -buildvcs=false \
              -o "/tmp/fugue-backup-materializer-validator-${arch}" \
              ./cmd/fugue-backup-materializer-validator
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image locally without publishing
        env:
          IMAGE_REF: fugue-backup-materializer-validator:${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile.backup-materializer-validator \
            --tag "${IMAGE_REF}" \
            --load \
            .

      - name: Probe the local image
        run: scripts/test_backup_materializer_validator_image.sh "fugue-backup-materializer-validator:${GITHUB_SHA}"
