name: remediate-edge-inactive-slot

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: ${{ vars.FUGUE_EDGE_AUTO_REMEDIATION_ENABLED == 'true' && vars.FUGUE_EDGE_AUTO_REMEDIATION_CREDENTIALS_READY == 'true' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    timeout-minutes: 2
    outputs:
      actionable: ${{ steps.observe.outputs.actionable }}
    steps:
      - name: Checkout exact default branch revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Observe bounded inactive Edge evidence
        id: observe
        env: &remediation-env
          FUGUE_EDGE_AUTO_REMEDIATION_ENABLED: 'true'
          FUGUE_EDGE_AUTO_REMEDIATION_INTERVAL_SECONDS: '20'
          FUGUE_EDGE_AUTO_REMEDIATION_DEADLINE_SECONDS: '55'
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_RELEASE_FULLNAME: ${{ vars.FUGUE_RELEASE_FULLNAME || 'fugue-fugue' }}
          FUGUE_EDGE_ACTIVATION_SIGNING_SECRET_NAME: ${{ vars.FUGUE_EDGE_ACTIVATION_SIGNING_SECRET_NAME }}
          FUGUE_EDGE_ACTIVATION_API_URL: ${{ vars.FUGUE_API_URL }}
          FUGUE_EDGE_ACTIVATION_API_KEY: ${{ secrets.FUGUE_BOOTSTRAP_KEY }}
          FUGUE_PUBLIC_DATA_PLANE_SMOKE_URLS: ${{ vars.FUGUE_EDGE_REMEDIATION_SMOKE_URLS }}
        run: ./scripts/remediate_edge_inactive_slot.sh observe

  remediate:
    needs: observe
    if: ${{ needs.observe.outputs.actionable == 'true' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    timeout-minutes: 2
    concurrency:
      group: fugue-production-cluster-mutation-v1
      cancel-in-progress: false
    steps:
      - name: Checkout exact observed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - name: Requalify and execute at most one exact inactive action
        env: *remediation-env
        run: ./scripts/remediate_edge_inactive_slot.sh execute
