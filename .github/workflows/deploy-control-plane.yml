          readonly target_source='57dc767999741cea25fe4820a6c9603984dfa0b9'
          readonly tooling_root='5a3b09c571601993367c50561b257dd6b9e743ca'
          readonly tooling_parent='00eb43b0e97b6daa2357e88ea7e8d53d69e3364d'
          [[ "${TARGET_SHA}" == "${target_source}" && "${EXPECTED_SHA}" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "${target_source}" ]]
          git merge-base --is-ancestor "${live_source}" "${target_source}"
          git merge-base --is-ancestor "${target_source}" "${EXPECTED_SHA}"
          [[ "$(git rev-list --count "${target_source}..${EXPECTED_SHA}")" == '15' ]]
          [[ "$(git rev-list --parents -n 1 "${EXPECTED_SHA}" | awk '{print NF}')" == '2' ]]
          [[ "$(git rev-parse --verify "${EXPECTED_SHA}^")" == "${tooling_parent}" ]]
          [[ "$(git rev-parse --verify "${tooling_root}^")" == "${target_source}" ]]
          runtime_diff="$(git diff --name-status "${live_source}..${target_source}" -- \
            internal/api internal/runtime internal/model internal/store go.mod go.sum deploy/helm/fugue)"
          [[ "${runtime_diff}" == $'M\tinternal/api/managed_app_status.go\nM\tinternal/api/managed_app_status_test.go' ]]
          [[ -z "$(git diff --name-only "${live_source}..${target_source}" -- deploy/helm/fugue go.mod go.sum)" ]]
          release_diff="$(git diff --name-only "${tooling_root}..${EXPECTED_SHA}")"
          [[ "${release_diff}" == $'.github/workflows/deploy-control-plane.yml\ninternal/platformsafety/release_workflow_test.go\ninternal/releasedomain/control_plane_hotfix_adoption.go\ninternal/releasedomain/control_plane_hotfix_adoption_test.go\nscripts/build_control_plane_images.sh\nscripts/test_control_plane_build_reuse.py\nscripts/test_control_plane_hotfix_adoption.sh\nscripts/test_verify_registry_image.py\nscripts/upgrade_fugue_control_plane.sh\nscripts/verify_registry_image.py' ]]
          [[ -z "$(git diff --name-only "${target_source}..${EXPECTED_SHA}" -- deploy/helm/fugue go.mod go.sum)" ]]
          {
            printf 'changed_files=%s\n' "${runtime_diff//$'\n'/ }"
            printf 'baseline_refs=%s\n' "${live_source}"
            printf 'source=%s\n' "${live_source}"
            printf 'target_ref=%s\n' "${target_source}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify exact Controller M16 runtime closure
        id: controller_m16_baseline
        if: ${{ inputs.controller_m16_rollout_v1 != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          readonly live_source='d1e7ed9cdedbaa09db9bd78b4e433b94c7357510'
          readonly target_source='58fc2e560064214e3f329765c9ec7839ee513c27'
          readonly tooling_base='ffd634a135114268156652c8d671231cb50c45fb'
          readonly m16_source='353cc7e4f417fca51e14483bc292c79e0ba7941a'
          readonly tooling_parent='db9c05d53c8a34d215687471e625af1a0bed7757'
          readonly history_parent='973cb7d4b62abfb34b67aed5900ad179634ee134'
          [[ "${TARGET_SHA}" == "${target_source}" && "${EXPECTED_SHA}" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "${target_source}" ]]
          git merge-base --is-ancestor "${live_source}" "${target_source}"
          git merge-base --is-ancestor "${target_source}" "${EXPECTED_SHA}"
          [[ "$(git rev-parse --verify "${EXPECTED_SHA}^")" == "${history_parent}" ]]
          [[ "$(git rev-parse --verify "${history_parent}^")" == "${tooling_parent}" ]]
          [[ "$(git rev-parse --verify "${tooling_parent}^")" == "${m16_source}" ]]
          [[ "$(git rev-parse --verify "${m16_source}^")" == "${tooling_base}" ]]
          [[ "$(git rev-list --count "${tooling_base}..${EXPECTED_SHA}")" == '4' ]]
          [[ -z "$(git rev-list --merges "${tooling_base}..${EXPECTED_SHA}")" ]]
          [[ "$(git diff --name-only "${history_parent}..${EXPECTED_SHA}")" == $'.github/workflows/deploy-control-plane.yml\ninternal/platformsafety/release_workflow_test.go\nscripts/test_control_plane_hotfix_adoption.sh\nscripts/test_release_domain_workflow.sh\nscripts/upgrade_fugue_control_plane.sh' ]]
          [[ "$(git diff --name-only "${tooling_parent}..${history_parent}")" == $'.github/workflows/deploy-control-plane.yml\ninternal/platformsafety/release_workflow_test.go\nscripts/test_release_domain_workflow.sh\nscripts/upgrade_fugue_control_plane.sh' ]]
          [[ "$(git diff --name-only "${m16_source}..${tooling_parent}")" == $'scripts/prepush.py\nscripts/test_prepush.py' ]]
          [[ "$(git diff --name-only "${tooling_base}..${m16_source}")" == $'.github/workflows/deploy-control-plane.yml\ninternal/platformsafety/release_workflow_test.go\ninternal/releasedomain/control_plane_hotfix_adoption.go\ninternal/releasedomain/control_plane_hotfix_adoption_test.go\nscripts/test_release_domain_workflow.sh\nscripts/upgrade_fugue_control_plane.sh' ]]
          [[ "$(git diff --name-only "${tooling_base}..${EXPECTED_SHA}")" == $'.github/workflows/deploy-control-plane.yml\ninternal/platformsafety/release_workflow_test.go\ninternal/releasedomain/control_plane_hotfix_adoption.go\ninternal/releasedomain/control_plane_hotfix_adoption_test.go\nscripts/prepush.py\nscripts/test_control_plane_hotfix_adoption.sh\nscripts/test_prepush.py\nscripts/test_release_domain_workflow.sh\nscripts/upgrade_fugue_control_plane.sh' ]]
          runtime_diff="$(git diff --name-status "${live_source}..${target_source}" -- internal/controller internal/store)"
          [[ "${runtime_diff}" == $'M\tinternal/controller/app_database_switchover.go\nM\tinternal/controller/app_database_switchover_test.go\nM\tinternal/controller/controller.go\nM\tinternal/controller/managed_app_reconciler.go\nM\tinternal/controller/postgres_runtime_alignment.go\nM\tinternal/controller/postgres_runtime_alignment_test.go\nA\tinternal/store/managed_postgres_placement.go\nA\tinternal/store/managed_postgres_placement_pg.go\nA\tinternal/store/managed_postgres_placement_pg_test.go\nA\tinternal/store/managed_postgres_placement_test.go' ]]
          chart_drift="$(git diff --name-status "${target_source}..${EXPECTED_SHA}" -- deploy/helm/fugue go.mod go.sum)"
          [[ "${chart_drift}" == $'M\tdeploy/helm/fugue/chart_test.go\nM\tdeploy/helm/fugue/templates/edge-bluegreen-daemonsets.yaml\nM\tdeploy/helm/fugue/templates/edge-daemonset.yaml\nM\tdeploy/helm/fugue/templates/edge-group-daemonsets.yaml' ]]
          [[ -z "$(git diff --name-only "${target_source}..${EXPECTED_SHA}" -- deploy/helm/fugue/templates/controller-deployment.yaml deploy/helm/fugue/values.yaml deploy/helm/fugue/values-production-ha.yaml go.mod go.sum)" ]]
          {
            printf 'changed_files=%s\n' "${runtime_diff//$'\n'/ }"
            printf 'baseline_refs=%s\n' "${live_source}"
            printf 'source=%s\n' "${live_source}"
            printf 'target_ref=%s\n' "${target_source}"
          } >>"${GITHUB_OUTPUT}"

  release-gate:
    needs:
      - release-input-guard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify exact source CI receipt
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          ci_receipt="$({ timeout --kill-after=2s 20s gh api \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"${EXPECTED_SHA}\") | [.id,.run_attempt,.event,.head_branch,.head_sha,.status,.conclusion,.path] | @tsv"; } 2>/dev/null)" || exit 1
          [[ "$(printf '%s\n' "${ci_receipt}" | sed '/^$/d' | wc -l | tr -d ' ')" == '1' ]]
          IFS=$'\t' read -r ci_id ci_attempt ci_event ci_branch ci_sha ci_status ci_conclusion ci_path ci_extra <<<"${ci_receipt}"
          [[ -z "${ci_extra:-}" ]]
          [[ "${ci_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ci_attempt}" == '1' && "${ci_event}" == 'push' && "${ci_branch}" == 'main' ]]
          [[ "${ci_sha}" == "${EXPECTED_SHA}" && "${ci_status}" == 'completed' && "${ci_conclusion}" == 'success' ]]
          [[ "${ci_path}" == '.github/workflows/ci.yml' ]]

      - name: Verify exact API hotfix product receipt
        if: ${{ inputs.api_hotfix_rollout_v2 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          receipt="$(timeout --kill-after=2s 10s gh api \
            "repos/${REPOSITORY}/actions/runs/30788130816" \
            --jq '[.id,.run_attempt,.event,.head_branch,.head_sha,.status,.conclusion,.path] | @tsv')"
          [[ "${receipt}" == $'30788130816\t1\tpush\tmain\t57dc767999741cea25fe4820a6c9603984dfa0b9\tcompleted\tsuccess\t.github/workflows/ci.yml' ]]

      - name: Verify exact M16 Controller build-only product receipt
        if: ${{ inputs.controller_m16_rollout_v1 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          run="$(timeout --kill-after=2s 10s gh api \
            "repos/${REPOSITORY}/actions/runs/30824899056" \
            --jq '[.id,.run_attempt,.event,.head_branch,.head_sha,.status,.conclusion,.path] | @tsv')"
          [[ "${run}" == $'30824899056\t1\tworkflow_dispatch\tmain\tffd634a135114268156652c8d671231cb50c45fb\tcompleted\tsuccess\t.github/workflows/deploy-control-plane.yml' ]]
          artifact="$(timeout --kill-after=2s 10s gh api \
            "repos/${REPOSITORY}/actions/artifacts/8860449968" \
            --jq '[.id,.name,.size_in_bytes,.expired,.digest,.workflow_run.id,.workflow_run.head_sha] | @tsv')"
          [[ "${artifact}" == $'8860449968\tfugue-historical-controller-build-only-58fc-30824899056-1\t2896\tfalse\tsha256:08a7ddbaa41d26dd0f124c5981ed8af322f373dfab79815c9df1a6a3c6f44db7\t30824899056\tffd634a135114268156652c8d671231cb50c45fb' ]]

  build:
    needs:
      - release-baseline
      - release-gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      api_image_repository: ${{ steps.meta.outputs.api_image_repository }}
      controller_image_repository: ${{ steps.meta.outputs.controller_image_repository }}
      drain_agent_image_repository: ${{ steps.meta.outputs.drain_agent_image_repository }}
      telemetry_agent_image_repository: ${{ steps.meta.outputs.telemetry_agent_image_repository }}
      image_cache_image_repository: ${{ steps.meta.outputs.image_cache_image_repository }}
      edge_image_repository: ${{ steps.meta.outputs.edge_image_repository }}
      app_ssh_image_repository: ${{ steps.meta.outputs.app_ssh_image_repository }}
      api_image_digest: ${{ steps.build_images.outputs.api_image_digest }}
      controller_image_digest: ${{ steps.build_images.outputs.controller_image_digest }}
      drain_agent_image_digest: ${{ steps.build_images.outputs.drain_agent_image_digest }}
      telemetry_agent_image_digest: ${{ steps.build_images.outputs.telemetry_agent_image_digest }}
      image_cache_image_digest: ${{ steps.build_images.outputs.image_cache_image_digest }}
      edge_image_digest: ${{ steps.build_images.outputs.edge_image_digest }}
      app_ssh_image_digest: ${{ steps.build_images.outputs.app_ssh_image_digest }}
      verified_image_artifacts_json: ${{ steps.build_images.outputs.verified_image_artifacts_json }}
      verified_image_artifacts_digest: ${{ steps.build_images.outputs.verified_image_artifacts_digest }}
      build_api: ${{ steps.plan.outputs.build_api }}
      build_controller: ${{ steps.plan.outputs.build_controller }}
      build_drain_agent: ${{ steps.plan.outputs.build_drain_agent }}
      build_telemetry_agent: ${{ steps.plan.outputs.build_telemetry_agent }}
      build_image_cache: ${{ steps.plan.outputs.build_image_cache }}
      build_edge: ${{ steps.plan.outputs.build_edge }}
      build_app_ssh: ${{ steps.plan.outputs.build_app_ssh }}
      image_targets: ${{ steps.plan.outputs.targets }}
      image_target_count: ${{ steps.plan.outputs.target_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Checkout current artifact verifier
        if: ${{ inputs.target_sha != inputs.expected_sha }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}
          path: current-release-tools
          fetch-depth: 1

      - name: Download exact historical incident build receipt
        if: ${{ inputs.target_sha != inputs.expected_sha && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fugue-control-plane-build-activation-evidence-30741102194-1
          path: ${{ runner.temp }}/fugue-historical-incident-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '30741102194'

      - name: Download exact M16 Controller build-only receipt
        if: ${{ inputs.controller_m16_rollout_v1 != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fugue-historical-controller-build-only-58fc-30824899056-1
          path: ${{ runner.temp }}/fugue-controller-m16-build-only
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '30824899056'

      - name: Download convergence image artifact authorization
        if: ${{ inputs.image_cache_convergence }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fugue-release-convergence-successor-${{ inputs.convergence_source_run_id }}-1
          path: ${{ runner.temp }}/fugue-release-convergence-authorization
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.convergence_source_run_id }}

      - name: Materialize exact canonical build receipt
        if: ${{ inputs.artifact_reuse_receipt_b64 != '' }}
        env:
          RECEIPT_B64: ${{ inputs.artifact_reuse_receipt_b64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          encoded = os.environ["RECEIPT_B64"]
          if not encoded or len(encoded) > 196608 or any(character.isspace() for character in encoded):
              raise SystemExit("build-receipt-base64-input-invalid")
          try:
              receipt = base64.b64decode(encoded, validate=True)
          except binascii.Error as exc:
              raise SystemExit("build-receipt-base64-input-invalid") from exc
          if not receipt or len(receipt) > 128 * 1024:
              raise SystemExit("build-receipt-size-invalid")
          directory = Path(os.environ["RUNNER_TEMP"]) / "fugue-build-reuse"
          directory.mkdir(mode=0o700)
          output = directory / "receipt.json"
          with output.open("xb") as handle:
              os.chmod(output, 0o600)
              handle.write(receipt)
          PY

      - name: Setup Go
        if: ${{ inputs.artifact_reuse_receipt_b64 == '' && (inputs.target_sha == inputs.expected_sha || inputs.api_hotfix_rollout_v2 != '') }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Compute image metadata
        id: meta
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          owner_lc="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "${TARGET_SHA}" ]]
          echo "image_tag=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          echo "api_image_repository=ghcr.io/${owner_lc}/fugue-api" >> "${GITHUB_OUTPUT}"
          echo "controller_image_repository=ghcr.io/${owner_lc}/fugue-controller" >> "${GITHUB_OUTPUT}"
          echo "drain_agent_image_repository=ghcr.io/${owner_lc}/fugue-drain-agent" >> "${GITHUB_OUTPUT}"
          echo "telemetry_agent_image_repository=ghcr.io/${owner_lc}/fugue-telemetry-agent" >> "${GITHUB_OUTPUT}"
          echo "image_cache_image_repository=ghcr.io/${owner_lc}/fugue-image-cache" >> "${GITHUB_OUTPUT}"
          echo "edge_image_repository=ghcr.io/${owner_lc}/fugue-edge" >> "${GITHUB_OUTPUT}"
          echo "app_ssh_image_repository=ghcr.io/${owner_lc}/fugue-app-ssh" >> "${GITHUB_OUTPUT}"

      - name: Compute image build plan
        id: plan
        env:
          FUGUE_RELEASE_CHANGED_FILES: ${{ needs.release-baseline.outputs.changed_files }}
          FUGUE_RELEASE_CHANGED_FILES_SET: "true"
          FUGUE_RELEASE_IMAGE_CACHE_CONVERGENCE: ${{ inputs.image_cache_convergence && 'true' || 'false' }}
          FUGUE_RELEASE_TARGET_REF: ${{ needs.release-baseline.outputs.target_ref }}
          FUGUE_API_IMAGE_BASE_REF: ${{ needs.release-baseline.outputs.api_image_baseline_ref }}
          FUGUE_API_IMAGE_HELM_DRIFT: ${{ needs.release-baseline.outputs.api_image_helm_drift }}
          FUGUE_CONTROLLER_IMAGE_BASE_REF: ${{ needs.release-baseline.outputs.controller_image_baseline_ref }}
          FUGUE_CONTROLLER_IMAGE_HELM_DRIFT: ${{ needs.release-baseline.outputs.controller_image_helm_drift }}
          FUGUE_DRAIN_AGENT_IMAGE_BASE_REF: ${{ needs.release-baseline.outputs.drain_agent_image_baseline_ref }}
          FUGUE_DRAIN_AGENT_IMAGE_HELM_DRIFT: ${{ needs.release-baseline.outputs.drain_agent_image_helm_drift }}
          FUGUE_TELEMETRY_AGENT_IMAGE_BASE_REF: ${{ needs.release-baseline.outputs.telemetry_agent_image_baseline_ref }}
          FUGUE_TELEMETRY_AGENT_IMAGE_HELM_DRIFT: ${{ needs.release-baseline.outputs.telemetry_agent_image_helm_drift }}
          FUGUE_IMAGE_CACHE_IMAGE_BASE_REF: ${{ needs.release-baseline.outputs.image_cache_image_baseline_ref }}
          FUGUE_IMAGE_CACHE_IMAGE_HELM_DRIFT: ${{ needs.release-baseline.outputs.image_cache_image_helm_drift }}
          FUGUE_EDGE_IMAGE_BASE_REF: ${{ needs.release-baseline.outputs.edge_image_baseline_ref }}
          FUGUE_EDGE_IMAGE_HELM_DRIFT: ${{ needs.release-baseline.outputs.edge_image_helm_drift }}
        run: |
          if [[ "${{ inputs.controller_m16_rollout_v1 }}" != '' ]]; then
            [[ "${{ inputs.controller_m16_rollout_v1 }}" == 'CONFIRM_CONTROL_PLANE_CONTROLLER_M16_ROLLOUT_V1_58FC' ]]
            [[ "${{ inputs.target_sha }}" == '58fc2e560064214e3f329765c9ec7839ee513c27' ]]
            {
              printf 'build_api=false\n'
              printf 'build_controller=true\n'
              printf 'build_drain_agent=false\n'
              printf 'build_telemetry_agent=false\n'
              printf 'build_image_cache=false\n'
              printf 'build_edge=false\n'
              printf 'build_app_ssh=false\n'
              printf 'target_count=1\n'
              printf 'targets=controller\n'
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${{ inputs.api_hotfix_rollout_v2 }}" != '' ]]; then
            [[ "${{ inputs.api_hotfix_rollout_v2 }}" == 'CONFIRM_CONTROL_PLANE_API_HOTFIX_ROLLOUT_V2_57DC' ]]
            [[ "${{ inputs.target_sha }}" == '57dc767999741cea25fe4820a6c9603984dfa0b9' ]]
            {
              printf 'build_api=true\n'
              printf 'build_controller=false\n'
              printf 'build_drain_agent=false\n'
              printf 'build_telemetry_agent=false\n'
              printf 'build_image_cache=false\n'
              printf 'build_edge=false\n'
              printf 'build_app_ssh=false\n'
              printf 'target_count=1\n'
              printf 'targets=api\n'
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${{ inputs.target_sha }}" != "${{ inputs.expected_sha }}" ]]; then
            [[ "${{ inputs.target_sha }}" == 'd1e7ed9cdedbaa09db9bd78b4e433b94c7357510' ]]
            {
              printf 'build_api=true\n'
              printf 'build_controller=true\n'
              printf 'build_drain_agent=false\n'
              printf 'build_telemetry_agent=true\n'
              printf 'build_image_cache=false\n'
              printf 'build_edge=true\n'
              printf 'build_app_ssh=false\n'
              printf 'target_count=4\n'
              printf 'targets=api controller telemetry_agent edge\n'
            } >> "${GITHUB_OUTPUT}"
          else
            ./scripts/compute_control_plane_image_build_plan.sh
          fi

      - name: Verify exact historical incident image plan
        if: ${{ inputs.target_sha != inputs.expected_sha && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BUILD_API: ${{ steps.plan.outputs.build_api }}
          BUILD_CONTROLLER: ${{ steps.plan.outputs.build_controller }}
          BUILD_DRAIN_AGENT: ${{ steps.plan.outputs.build_drain_agent }}
          BUILD_TELEMETRY_AGENT: ${{ steps.plan.outputs.build_telemetry_agent }}
          BUILD_IMAGE_CACHE: ${{ steps.plan.outputs.build_image_cache }}
          BUILD_EDGE: ${{ steps.plan.outputs.build_edge }}
          BUILD_APP_SSH: ${{ steps.plan.outputs.build_app_ssh }}
          IMAGE_TARGETS: ${{ steps.plan.outputs.targets }}
          IMAGE_TARGET_COUNT: ${{ steps.plan.outputs.target_count }}
          HISTORICAL_BUILD_PLAN: ${{ runner.temp }}/fugue-historical-incident-build/build-artifact-plan.json
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" == 'd1e7ed9cdedbaa09db9bd78b4e433b94c7357510' ]]
          [[ "${BUILD_API}" == 'true' && "${BUILD_CONTROLLER}" == 'true' ]]
          [[ "${BUILD_TELEMETRY_AGENT}" == 'true' && "${BUILD_EDGE}" == 'true' ]]
          [[ "${BUILD_DRAIN_AGENT}" == 'false' && "${BUILD_IMAGE_CACHE}" == 'false' && "${BUILD_APP_SSH}" == 'false' ]]
          [[ "${IMAGE_TARGETS}" == 'api controller telemetry_agent edge' && "${IMAGE_TARGET_COUNT}" == '4' ]]
          [[ -f "${HISTORICAL_BUILD_PLAN}" && ! -L "${HISTORICAL_BUILD_PLAN}" ]]
          source_run="$(timeout --kill-after=2s 10s gh api \
            "repos/${REPOSITORY}/actions/runs/30741102194" \
            --jq '[.id,.run_attempt,.event,.head_sha,.status,.path] | @tsv')"
          [[ "${source_run}" == $'30741102194\t1\tworkflow_dispatch\tbf330a0461b30bf67ad7f6cc210e5272562fde65\tcompleted\t.github/workflows/deploy-control-plane.yml' ]]
          build_jobs="$(timeout --kill-after=2s 10s gh api --paginate \
            "repos/${REPOSITORY}/actions/runs/30741102194/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "build") | [.run_attempt,.status,.conclusion] | @tsv')"
          [[ "${build_jobs}" == $'1\tcompleted\tsuccess' ]]

      - name: Verify exact Controller M16 image plan and receipt
        if: ${{ inputs.controller_m16_rollout_v1 != '' }}
        env:
          BUILD_API: ${{ steps.plan.outputs.build_api }}
          BUILD_CONTROLLER: ${{ steps.plan.outputs.build_controller }}
          BUILD_DRAIN_AGENT: ${{ steps.plan.outputs.build_drain_agent }}
          BUILD_TELEMETRY_AGENT: ${{ steps.plan.outputs.build_telemetry_agent }}
          BUILD_IMAGE_CACHE: ${{ steps.plan.outputs.build_image_cache }}
          BUILD_EDGE: ${{ steps.plan.outputs.build_edge }}
          BUILD_APP_SSH: ${{ steps.plan.outputs.build_app_ssh }}
          IMAGE_TARGETS: ${{ steps.plan.outputs.targets }}
          IMAGE_TARGET_COUNT: ${{ steps.plan.outputs.target_count }}
          MATERIALIZED_RECEIPT: ${{ runner.temp }}/fugue-build-reuse/receipt.json
          BUILD_ONLY_DIR: ${{ runner.temp }}/fugue-controller-m16-build-only
        run: |
          set -euo pipefail
          [[ "${BUILD_CONTROLLER}" == 'true' && "${IMAGE_TARGETS}" == 'controller' && "${IMAGE_TARGET_COUNT}" == '1' ]]
          for value in "${BUILD_API}" "${BUILD_DRAIN_AGENT}" "${BUILD_TELEMETRY_AGENT}" \
            "${BUILD_IMAGE_CACHE}" "${BUILD_EDGE}" "${BUILD_APP_SSH}"; do
            [[ "${value}" == 'false' ]]
          done
          [[ -f "${BUILD_ONLY_DIR}/receipt.json" && ! -L "${BUILD_ONLY_DIR}/receipt.json" ]]
          [[ -f "${BUILD_ONLY_DIR}/verified-image-artifacts.json" && ! -L "${BUILD_ONLY_DIR}/verified-image-artifacts.json" ]]
          [[ "$(sha256sum "${BUILD_ONLY_DIR}/receipt.json" | awk '{print $1}')" == 'f0e20caa59be4bea2459403f09e6cbd0a0c60fe69178cb1346a766b6a8cb7a3a' ]]
          [[ "$(sha256sum "${BUILD_ONLY_DIR}/verified-image-artifacts.json" | awk '{print $1}')" == '05138686d8fa09945a1f158f15e056620a390ea9a277ec0c5d9451472f1a10d3' ]]
          cmp -s "${MATERIALIZED_RECEIPT}" "${BUILD_ONLY_DIR}/verified-image-artifacts.json"
          RECEIPT="${BUILD_ONLY_DIR}/receipt.json" python3 - <<'PY'
          import json, os
          value=json.load(open(os.environ["RECEIPT"],encoding="utf-8"))
          artifact=value.get("artifact") or {}
          assert value.get("kind")=="HistoricalControllerBuildOnlyReceipt" and value.get("status")=="verified"
          assert value.get("run_id")==30824899056 and value.get("run_attempt")==1
          assert value.get("expected_main_sha")=="ffd634a135114268156652c8d671231cb50c45fb"
          assert value.get("source_commit")=="58fc2e560064214e3f329765c9ec7839ee513c27"
          assert value.get("source_tree")=="0cbb953d3985b5cb4ca547a83e25013942232883"
          assert value.get("build_targets")==["controller"] and value.get("build_target_count")==1
          assert value.get("activation_target_count")==0 and value.get("activation_eligible") is False
          assert value.get("production_mutation_attempted") is False and value.get("automatic_registry_deletion_attempted") is False
          assert value.get("registry_preflight")=="tag_absent" and value.get("registry_artifact_state")=="verified"
          assert value.get("verified_image_artifacts_digest")=="sha256:05138686d8fa09945a1f158f15e056620a390ea9a277ec0c5d9451472f1a10d3"
          assert artifact.get("top_digest")=="sha256:444bca23386cc0f19012fcbaba20d71db1b9863ee80d50d1bde6d87376e190df"
          assert artifact.get("platform_manifest_digest")=="sha256:7fa0ec2c4dbe4d7570ef595b006411efba9f4fbba1caf1571611265a018fbc00"
          assert artifact.get("config_digest")=="sha256:7db86a97c096224cae83a3865dccdc7973ca71cef359653d76e31bc22aee7b06"
          PY

      - name: Verify exact API hotfix image plan
        if: ${{ inputs.api_hotfix_rollout_v2 != '' }}
        env:
          BUILD_API: ${{ steps.plan.outputs.build_api }}
          BUILD_CONTROLLER: ${{ steps.plan.outputs.build_controller }}
          BUILD_DRAIN_AGENT: ${{ steps.plan.outputs.build_drain_agent }}
          BUILD_TELEMETRY_AGENT: ${{ steps.plan.outputs.build_telemetry_agent }}
          BUILD_IMAGE_CACHE: ${{ steps.plan.outputs.build_image_cache }}
          BUILD_EDGE: ${{ steps.plan.outputs.build_edge }}
          BUILD_APP_SSH: ${{ steps.plan.outputs.build_app_ssh }}
          IMAGE_TARGETS: ${{ steps.plan.outputs.targets }}
          IMAGE_TARGET_COUNT: ${{ steps.plan.outputs.target_count }}
        run: |
          set -euo pipefail
          [[ "${BUILD_API}" == 'true' && "${IMAGE_TARGETS}" == 'api' && "${IMAGE_TARGET_COUNT}" == '1' ]]
          for value in "${BUILD_CONTROLLER}" "${BUILD_DRAIN_AGENT}" "${BUILD_TELEMETRY_AGENT}" \
            "${BUILD_IMAGE_CACHE}" "${BUILD_EDGE}" "${BUILD_APP_SSH}"; do
            [[ "${value}" == 'false' ]]
          done

      - name: Setup Docker Buildx
        if: ${{ inputs.artifact_reuse_receipt_b64 == '' && steps.plan.outputs.target_count != '0' && (inputs.target_sha == inputs.expected_sha || inputs.api_hotfix_rollout_v2 != '') }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        if: ${{ inputs.artifact_reuse_receipt_b64 == '' && steps.plan.outputs.target_count != '0' && (inputs.target_sha == inputs.expected_sha || inputs.api_hotfix_rollout_v2 != '') }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified control-plane image provenance
        id: build_images
        env:
          FUGUE_CONTROL_PLANE_IMAGE_TARGETS: ${{ steps.plan.outputs.targets }}
          FUGUE_IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          FUGUE_API_IMAGE_REPOSITORY: ${{ steps.meta.outputs.api_image_repository }}
          FUGUE_CONTROLLER_IMAGE_REPOSITORY: ${{ steps.meta.outputs.controller_image_repository }}
          FUGUE_DRAIN_AGENT_IMAGE_REPOSITORY: ${{ steps.meta.outputs.drain_agent_image_repository }}
          FUGUE_TELEMETRY_AGENT_IMAGE_REPOSITORY: ${{ steps.meta.outputs.telemetry_agent_image_repository }}
          FUGUE_IMAGE_CACHE_IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_cache_image_repository }}
          FUGUE_IMAGE_CACHE_IMAGE_BASE_REF: ${{ needs.release-baseline.outputs.image_cache_image_baseline_ref }}
          FUGUE_EDGE_IMAGE_REPOSITORY: ${{ steps.meta.outputs.edge_image_repository }}
          FUGUE_APP_SSH_IMAGE_REPOSITORY: ${{ steps.meta.outputs.app_ssh_image_repository }}
          FUGUE_CONTROL_PLANE_IMAGE_REUSE_AUTHORIZATION_FILE: ${{ inputs.image_cache_convergence && format('{0}/fugue-release-convergence-authorization/successor.json', runner.temp) || '' }}
          FUGUE_CONVERGENCE_SOURCE_RUN_ID: ${{ inputs.convergence_source_run_id }}
          FUGUE_CONTROL_PLANE_HISTORICAL_INCIDENT_BUILD_PLAN: ${{ inputs.target_sha != inputs.expected_sha && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' && format('{0}/fugue-historical-incident-build/build-artifact-plan.json', runner.temp) || '' }}
          FUGUE_CONTROL_PLANE_BUILD_RECEIPT_FILE: ${{ inputs.artifact_reuse_receipt_b64 != '' && format('{0}/fugue-build-reuse/receipt.json', runner.temp) || '' }}
          FUGUE_CONTROL_PLANE_BUILD_RECEIPT_REUSE: ${{ inputs.artifact_reuse_receipt_b64 != '' && 'true' || 'false' }}
        run: |
          if [[ "${FUGUE_CONTROL_PLANE_BUILD_RECEIPT_REUSE}" == 'true' ]]; then
            timeout --signal=TERM --kill-after=1s 19s ./current-release-tools/scripts/build_control_plane_images.sh
          elif [[ "${{ inputs.target_sha }}" != "${{ inputs.expected_sha }}" && "${{ inputs.api_hotfix_rollout_v2 }}" == '' && "${{ inputs.controller_m16_rollout_v1 }}" == '' ]]; then
            ./current-release-tools/scripts/build_control_plane_images.sh
          else
            ./scripts/build_control_plane_images.sh
          fi

  deploy:
    needs:
      - release-input-guard
      - release-baseline
      - release-gate
      - build
    if: ${{ always() && needs.release-input-guard.result == 'success' && needs.release-baseline.result == 'success' && needs.release-gate.result == 'success' && needs.build.result == 'success' }}
    # The staged rollout needs room for backup/release coordination, bounded
    # rollback, and attribution upload. New budget env values are intentionally
    # harmless to the previous release script during the bootstrap deployment.
    timeout-minutes: 360
    runs-on:
      - self-hosted
      - linux
      - x64
      - fugue
      - control-plane
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      image_activation_convergence: ${{ inputs.controller_m16_rollout_v1 != '' && steps.controller_m16_rollout.outputs.image-activation-convergence || (inputs.api_hotfix_rollout_v2 != '' && steps.api_hotfix_rollout.outputs.image-activation-convergence || (needs.release-baseline.outputs.is_genesis == 'true' && 'complete' || steps.guarded_deploy.outputs.image-activation-convergence)) }}
      pending_activation_artifacts: ${{ inputs.controller_m16_rollout_v1 != '' && steps.controller_m16_rollout.outputs.pending-activation-artifacts || (inputs.api_hotfix_rollout_v2 != '' && steps.api_hotfix_rollout.outputs.pending-activation-artifacts || steps.guarded_deploy.outputs.pending-activation-artifacts) }}
    steps:
      - name: Record deploy job budget origin
        if: ${{ needs.release-baseline.outputs.is_genesis != 'true' }}
        run: |
          set -euo pipefail
          readonly budget_seconds=20400
          started_at="$(date +%s)"
          [[ "${started_at}" =~ ^[1-9][0-9]*$ ]]
          {
            printf 'FUGUE_DEPLOY_JOB_STARTED_AT_EPOCH=%s\n' "${started_at}"
            printf 'CONTROL_PLANE_RELEASE_JOB_DEADLINE_EPOCH=%s\n' "$((started_at + budget_seconds))"
          } >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ (inputs.api_hotfix_rollout_v2 != '' || inputs.controller_m16_rollout_v1 != '') && inputs.expected_sha || inputs.target_sha }}
          fetch-depth: 0

      - name: Prepare exact current tooling for historical runtime evidence
        id: current_tooling
        if: ${{ inputs.target_sha != inputs.expected_sha && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' && needs.release-baseline.outputs.is_genesis != 'true' }}
        env:
          SOURCE_SHA: ${{ inputs.expected_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          API_DIGEST: ${{ needs.build.outputs.api_image_digest }}
          CONTROLLER_DIGEST: ${{ needs.build.outputs.controller_image_digest }}
          TELEMETRY_DIGEST: ${{ needs.build.outputs.telemetry_agent_image_digest }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ && "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" == "${GITHUB_SHA}" ]]
          [[ "${TARGET_SHA}" == 'd1e7ed9cdedbaa09db9bd78b4e433b94c7357510' ]]
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "${TARGET_SHA}" ]]
          remote_main="$(timeout --kill-after=2s 20s git ls-remote --refs origin refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "${remote_main}" == "${SOURCE_SHA}" ]]
          timeout --kill-after=5s 60s git fetch --no-tags origin "${SOURCE_SHA}"
          [[ "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" == "${SOURCE_SHA}" ]]
          git merge-base --is-ancestor "${TARGET_SHA}" "${SOURCE_SHA}"

          tools_root="${RUNNER_TEMP}/fugue-current-release-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ownership_backup="${RUNNER_TEMP}/fugue-historical-runtime-ownership-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          upgrade_backup="${RUNNER_TEMP}/fugue-historical-runtime-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          [[ ! -e "${tools_root}" && ! -L "${tools_root}" ]]
          [[ ! -e "${ownership_backup}" && ! -L "${ownership_backup}" ]]
          [[ ! -e "${upgrade_backup}" && ! -L "${upgrade_backup}" ]]
          install -d -m 0700 "${tools_root}"
          git archive "${SOURCE_SHA}" | tar -x -C "${tools_root}"
          [[ "$(git show "${SOURCE_SHA}:deploy/release-domains/ownership-v1.yaml" | sha256sum | awk '{print $1}')" == \
            "$(sha256sum "${tools_root}/deploy/release-domains/ownership-v1.yaml" | awk '{print $1}')" ]]

          install -m 0600 deploy/release-domains/ownership-v1.yaml "${ownership_backup}"
          install -m 0700 scripts/upgrade_fugue_control_plane.sh "${upgrade_backup}"
          install -m 0644 "${tools_root}/deploy/release-domains/ownership-v1.yaml" deploy/release-domains/ownership-v1.yaml
          install -m 0755 "${tools_root}/scripts/upgrade_fugue_control_plane.sh" scripts/upgrade_fugue_control_plane.sh
          cmp -s "${tools_root}/deploy/release-domains/ownership-v1.yaml" deploy/release-domains/ownership-v1.yaml
          cmp -s "${tools_root}/scripts/upgrade_fugue_control_plane.sh" scripts/upgrade_fugue_control_plane.sh
          git update-index --assume-unchanged -- \
            deploy/release-domains/ownership-v1.yaml scripts/upgrade_fugue_control_plane.sh
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

          [[ "${API_DIGEST}" == 'sha256:410a1c75efe1fe9dd51dd83e32d535d548ab4471281223be7a8bc6b7297ae9d8' ]]
          [[ "${CONTROLLER_DIGEST}" == 'sha256:e636b35fe8718e1f20895c0a290924a0d48a6cb7d1072d741612df18483fa13d' ]]
          [[ "${TELEMETRY_DIGEST}" == 'sha256:3c79d82c3e094e3bf404df39e8c2a052d734dc7b54cac5e32c208e8a970a0eeb' ]]
          {
            printf 'FUGUE_CURRENT_RELEASE_TOOLS_ROOT=%s\n' "${tools_root}"
            printf 'FUGUE_HISTORICAL_RUNTIME_OWNERSHIP_BACKUP=%s\n' "${ownership_backup}"
            printf 'FUGUE_HISTORICAL_RUNTIME_UPGRADE_BACKUP=%s\n' "${upgrade_backup}"
            printf 'FUGUE_API_IMAGE_DIGEST=%s\n' "${API_DIGEST}"
            printf 'FUGUE_CONTROLLER_IMAGE_DIGEST=%s\n' "${CONTROLLER_DIGEST}"
            printf 'FUGUE_TELEMETRY_AGENT_IMAGE_DIGEST=%s\n' "${TELEMETRY_DIGEST}"
          } >>"${GITHUB_ENV}"

      - name: Download Stage1 handoff for deploy prewrite
        if: ${{ inputs.public_data_plane_adoption_run_id != '' && needs.release-baseline.outputs.is_genesis != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-data-plane-adoption-${{ inputs.public_data_plane_adoption_run_id }}-1
          path: ${{ runner.temp }}/public-data-plane-stage1-prewrite
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.public_data_plane_adoption_run_id }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build private release-domain tools
        run: |
          set -euo pipefail
          source_root="${FUGUE_CURRENT_RELEASE_TOOLS_ROOT:-${GITHUB_WORKSPACE}}"
          [[ -d "${source_root}" && ! -L "${source_root}" ]]
          tools_dir="${RUNNER_TEMP}/fugue-release-tools"
          [[ ! -e "${tools_dir}" && ! -L "${tools_dir}" ]]
          install -d -m 0700 "${tools_dir}"
          [[ -d "${tools_dir}" && ! -L "${tools_dir}" ]]
          [[ "$(stat -c '%a' "${tools_dir}")" == '700' ]]
          umask 077
          cd "${source_root}"
          module_files_digest="$(sha256sum go.mod go.sum | sha256sum | awk '{print $1}')"
          for goarch in amd64 arm64; do
            env \
              CGO_ENABLED=0 \
              GOARCH="${goarch}" \
              GOOS=linux \
              GOENV=off \
              GOFLAGS=-mod=readonly \
              GONOPROXY=none \
              GONOSUMDB=none \
              GOPRIVATE= \
              GOPROXY=https://proxy.golang.org \
              GOSUMDB=sum.golang.org \
              GOTOOLCHAIN=local \
              'GOVCS=*:off' \
              GOWORK=off \
              go list -mod=readonly -buildvcs=false -deps ./cmd/... >/dev/null
          done
          env \
            GOENV=off \
            GOFLAGS=-mod=readonly \
            GONOPROXY=none \
            GONOSUMDB=none \
            GOPRIVATE= \
            GOPROXY=https://proxy.golang.org \
            GOSUMDB=sum.golang.org \
            GOTOOLCHAIN=local \
            'GOVCS=*:off' \
            GOWORK=off \
            go mod verify
          [[ "$(sha256sum go.mod go.sum | sha256sum | awk '{print $1}')" == "${module_files_digest}" ]]
          go build -trimpath -o "${tools_dir}/fugue-release-domain-evidence" ./cmd/fugue-release-domain-evidence
          go build -trimpath -o "${tools_dir}/fugue-release-domain-dispatch" ./cmd/fugue-release-domain-dispatch
          go build -trimpath -o "${tools_dir}/fugue-public-data-plane-adoption" ./cmd/fugue-public-data-plane-adoption
          chmod 0700 \
            "${tools_dir}/fugue-release-domain-evidence" \
            "${tools_dir}/fugue-release-domain-dispatch" \
            "${tools_dir}/fugue-public-data-plane-adoption"
          for tool in \
            "${tools_dir}/fugue-release-domain-evidence" \
            "${tools_dir}/fugue-release-domain-dispatch" \
            "${tools_dir}/fugue-public-data-plane-adoption"; do
            [[ -f "${tool}" && ! -L "${tool}" && -x "${tool}" ]]
            [[ "$(stat -c '%a' "${tool}")" == '700' ]]
          done

      - name: Reverify Stage1 handoff at deploy prewrite
        if: ${{ inputs.public_data_plane_adoption_run_id != '' && needs.release-baseline.outputs.is_genesis != 'true' }}
        env:
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          EXPECTED_BASELINE_DIGEST: ${{ inputs.public_data_plane_adoption_baseline_digest }}
        run: |
          set -euo pipefail
          handoff="${RUNNER_TEMP}/public-data-plane-stage1-prewrite"
          tool="${RUNNER_TEMP}/fugue-release-tools/fugue-public-data-plane-adoption"
          manifest="${RUNNER_TEMP}/public-data-plane-stage1-prewrite-current.yaml"
          revision="$(helm status "${FUGUE_RELEASE_NAME}" -n "${FUGUE_NAMESPACE}" -o json | \
            python3 -c 'import json,sys; value=json.load(sys.stdin).get("version"); assert isinstance(value,int) and value>0; print(value)')"
          helm get manifest "${FUGUE_RELEASE_NAME}" -n "${FUGUE_NAMESPACE}" --revision "${revision}" | \
            "${tool}" canonicalize-secret-free --ownership ./deploy/release-domains/ownership-v1.yaml --namespace "${FUGUE_NAMESPACE}" >"${manifest}"
          BASELINE="${handoff}/stage1-baseline.json" EXPECTED="${EXPECTED_BASELINE_DIGEST}" python3 -c \
            'import json,os; assert json.load(open(os.environ["BASELINE"],encoding="utf-8"))["digest"]==os.environ["EXPECTED"]'
          "${tool}" verify-stage2 \
            --baseline "${handoff}/stage1-baseline.json" \
            --trace "${handoff}/execution-trace.json" \
            --current-revision "${revision}" --current-manifest "${manifest}"

      - name: Write genesis public release evidence
        id: genesis_evidence
        if: ${{ needs.release-baseline.outputs.is_genesis == 'true' }}
        env:
          DOMAIN_BASE_SHA: ${{ needs.release-baseline.outputs.domain_base_sha }}
          DOMAIN_TARGET_SHA: ${{ inputs.target_sha }}
          GENESIS_SHA: ${{ vars.FUGUE_CONTROL_PLANE_RELEASE_GENESIS_SHA }}
          GENESIS_PARENT_SHA: ${{ needs.release-baseline.outputs.genesis_parent_sha }}
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/fugue-release-tools"
          private_dir="${RUNNER_TEMP}/fugue-release-domain-private"
          public_dir="${RUNNER_TEMP}/fugue-release-domain-public"
          changed_evidence="${private_dir}/changed-file-evidence.json"
          public_evidence="${public_dir}/release-domain-evidence.json"
          [[ ! -e "${private_dir}" && ! -L "${private_dir}" ]]
          [[ ! -e "${public_dir}" && ! -L "${public_dir}" ]]
          install -d -m 0700 "${private_dir}" "${public_dir}"
          [[ -d "${private_dir}" && ! -L "${private_dir}" ]]
          [[ -d "${public_dir}" && ! -L "${public_dir}" ]]
          [[ "$(stat -c '%a' "${private_dir}")" == '700' ]]
          [[ "$(stat -c '%a' "${public_dir}")" == '700' ]]
          umask 077
          "${tools_dir}/fugue-release-domain-evidence" \
            --repo "${GITHUB_WORKSPACE}" \
            --base "${DOMAIN_BASE_SHA}" \
            --target "${DOMAIN_TARGET_SHA}" \
            --output "${changed_evidence}"
          "${tools_dir}/fugue-release-domain-dispatch" write-genesis-public-evidence \
            --changed-evidence "${changed_evidence}" \
            --ownership "${GITHUB_WORKSPACE}/deploy/release-domains/ownership-v1.yaml" \
            --expected-change ".github/actions/operational-domain-guarded-deploy/action.yml" \
            --expected-change ".github/workflows/deploy-control-plane.yml" \
            --expected-change "cmd/fugue-release-domain-dispatch/classify_files.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/main.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/main_test.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/public_evidence.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/public_evidence_test.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/secure_files.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/stat_times_darwin.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/stat_times_linux.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/stat_times_other.go" \
            --expected-change "cmd/fugue-release-domain-dispatch/strict_json.go" \
            --expected-change "cmd/fugue-release-domain-evidence/evidence.go" \
            --expected-change "cmd/fugue-release-domain-evidence/evidence_test.go" \
            --expected-change "cmd/fugue-release-domain-evidence/main.go" \
            --expected-change "cmd/fugue-release-domain-evidence/manifest.go" \
            --expected-change "cmd/fugue-release-domain-evidence/manifest_test.go" \
            --expected-change "cmd/fugue-release-domain-plan/main.go" \
            --expected-change "cmd/fugue-release-domain-plan/main_test.go" \
            --expected-change "cmd/fugue-release-domain-plan/output.go" \
            --expected-change "cmd/fugue-release-domain-plan/output_test.go" \
            --expected-change "deploy/release-domains/ownership-v1.yaml" \
            --expected-change "docs/runbooks/release-domain-planner.md" \
            --expected-change "internal/api/topology_labeler_test.go" \
            --expected-change "internal/platformsafety/release_workflow_test.go" \
            --expected-change "internal/releaseadapter/adapter.go" \
            --expected-change "internal/releaseadapter/dispatcher.go" \
            --expected-change "internal/releaseadapter/dispatcher_test.go" \
            --expected-change "internal/releaseadapter/trace.go" \
            --expected-change "internal/releaseadapter/transaction.go" \
            --expected-change "internal/releaseadapter/transaction_test.go" \
            --expected-change "internal/releasedomain/changed_file_evidence.go" \
            --expected-change "internal/releasedomain/changed_file_evidence_test.go" \
            --expected-change "internal/releasedomain/file_classifier_test.go" \
            --expected-change "internal/releasedomain/ownership_test.go" \
            --expected-change "internal/releasedomain/plan_artifacts.go" \
            --expected-change "internal/releasedomain/plan_artifacts_test.go" \
            --expected-change "internal/releasedomain/rendered_classifier_test.go" \
            --expected-change "internal/releasedomain/rollback_ownership.go" \
            --expected-change "internal/releasedomain/rollback_ownership_test.go" \
            --expected-change "internal/releasedomain/transaction_envelope.go" \
            --expected-change "internal/releaseevidence/public.go" \
            --expected-change "internal/releaseevidence/public_test.go" \
            --expected-change "scripts/lib/control_plane_release_domain_production.sh" \
            --expected-change "scripts/lib/control_plane_release_domains.sh" \
            --expected-change "scripts/lib/control_plane_release_render.sh" \
            --expected-change "scripts/test_control_plane_release_domain_production.sh" \
            --expected-change "scripts/test_control_plane_release_main_wiring.sh" \
            --expected-change "scripts/test_control_plane_release_render.sh" \
            --expected-change "scripts/test_release_domain_safety.sh" \
            --expected-change "scripts/test_release_domain_workflow.sh" \
            --expected-change "scripts/test_single_domain_release.sh" \
            --expected-change "scripts/upgrade_fugue_control_plane.sh" \
            --output "${public_evidence}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --head-sha "${DOMAIN_TARGET_SHA}" \
            --expected-head-sha "${GENESIS_SHA}" \
            --evidence-base-sha "${DOMAIN_BASE_SHA}" \
            --actual-parent-sha "${GENESIS_PARENT_SHA}" \
            --expected-parent-sha "${GENESIS_PARENT_SHA}"
          [[ -f "${public_evidence}" && ! -L "${public_evidence}" ]]
          [[ "$(stat -c '%a' "${public_evidence}")" == '600' ]]

      - name: Guard stateful component files
        if: ${{ needs.release-baseline.outputs.is_genesis != 'true' && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        env:
          FUGUE_RELEASE_CHANGED_FILES: ${{ needs.release-baseline.outputs.changed_files }}
        run: |
          forbidden_pattern='^deploy/helm/fugue/templates/(postgres-(deployment|service)|registry-(configmap|deployment|pvc|service)|headscale-.*|control-plane-postgres-.*|shared-workspace-.*|snapshot-controller)\.yaml$'
          if printf '%s\n' "${FUGUE_RELEASE_CHANGED_FILES}" | grep -E "${forbidden_pattern}" >/dev/null; then
            echo "stateful component manifests changed since the live release:"
            printf '%s\n' "${FUGUE_RELEASE_CHANGED_FILES}" | grep -E "${forbidden_pattern}" || true
            echo "control-plane auto deploy refuses postgres/registry/headscale changes; use an independent controlled release window"
            exit 1
          fi

      - name: Synchronize additive ManagedApp CRD schema
        if: ${{ needs.release-baseline.outputs.is_genesis != 'true' && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        run: bash ./scripts/sync_managed_app_crd.sh

      - name: Prepare authoritative DNS DiG runtime
        if: ${{ needs.release-baseline.outputs.is_genesis != 'true' && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        run: ./scripts/prepare_authoritative_dns_dig.sh

      - name: Verify local deploy prerequisites
        if: ${{ needs.release-baseline.outputs.is_genesis != 'true' && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        run: |
          command -v helm
          command -v curl
          command -v dig
          [[ "$(command -v dig)" == "${FUGUE_AUTHORITATIVE_DNS_DIG_PREPARED_BIN}" ]]
          dig -v
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client
          else
            k3s kubectl version --client
          fi

      - name: Explain runner and fail closed target
        if: ${{ needs.release-baseline.outputs.is_genesis != 'true' && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        env:
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          FUGUE_IMAGE_TAG: ${{ needs.build.outputs.image_tag || inputs.target_sha }}
          FUGUE_IMAGE_TARGETS: ${{ needs.build.outputs.image_targets || '' }}
          FUGUE_RELEASE_CHANGED_FILES: ${{ needs.release-baseline.outputs.changed_files }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fugue-release"
          if command -v kubectl >/dev/null 2>&1; then
            KUBECTL=kubectl
          else
            KUBECTL="k3s kubectl"
          fi
          {
            echo "workflow=deploy-control-plane.yml"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${FUGUE_IMAGE_TAG}"
            echo "ref=${GITHUB_REF}"
            echo "release_name=${FUGUE_RELEASE_NAME}"
            echo "namespace=${FUGUE_NAMESPACE}"
            echo "image_tag=${FUGUE_IMAGE_TAG}"
            echo "image_targets=${FUGUE_IMAGE_TARGETS}"
            echo "kubectl=$(${KUBECTL} version --client 2>&1 | tr '\n' ';')"
            echo "helm=$(helm version --short 2>&1)"
          } > "${RUNNER_TEMP}/fugue-release/attribution.env"
          if ! ${KUBECTL} config current-context >> "${RUNNER_TEMP}/fugue-release/target-cluster.txt" 2>&1; then
            echo "Kubernetes context unavailable; fail closed before control-plane deploy" >&2
            exit 1
          fi
          if ! ${KUBECTL} get --raw=/readyz?verbose > "${RUNNER_TEMP}/fugue-release/kubernetes-readyz.txt" 2>&1; then
            echo "Kubernetes API /readyz failed; fail closed before control-plane deploy" >&2
            cat "${RUNNER_TEMP}/fugue-release/kubernetes-readyz.txt" >&2 || true
            exit 1
          fi
          if helm plugin list 2>/dev/null | grep -q '^diff[[:space:]]'; then
            echo "helm_diff=available" >> "${RUNNER_TEMP}/fugue-release/attribution.env"
          else
            echo "helm_diff=not_installed; upgrade script records kubectl/resource diffs where supported" >> "${RUNNER_TEMP}/fugue-release/attribution.env"
          fi
          printf '%s\n' "${FUGUE_RELEASE_CHANGED_FILES}" > "${RUNNER_TEMP}/fugue-release/changed-files.txt"

      - name: Resolve live image metadata
        id: live_images
        if: ${{ needs.release-baseline.outputs.is_genesis != 'true' && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        env:
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          FUGUE_RELEASE_FULLNAME: ${{ vars.FUGUE_RELEASE_FULLNAME || 'fugue-fugue' }}
          GITHUB_SHA: ${{ inputs.target_sha }}
          FUGUE_IMAGE_TAG: ${{ needs.build.outputs.image_tag || inputs.target_sha }}
          FUGUE_API_IMAGE_REPOSITORY: ${{ needs.build.outputs.api_image_repository || format('ghcr.io/{0}/fugue-api', github.repository_owner) }}
          FUGUE_CONTROLLER_IMAGE_REPOSITORY: ${{ needs.build.outputs.controller_image_repository || format('ghcr.io/{0}/fugue-controller', github.repository_owner) }}
          FUGUE_DRAIN_AGENT_IMAGE_REPOSITORY: ${{ needs.build.outputs.drain_agent_image_repository || format('ghcr.io/{0}/fugue-drain-agent', github.repository_owner) }}
          FUGUE_TELEMETRY_AGENT_IMAGE_REPOSITORY: ${{ needs.build.outputs.telemetry_agent_image_repository || format('ghcr.io/{0}/fugue-telemetry-agent', github.repository_owner) }}
          FUGUE_IMAGE_CACHE_IMAGE_REPOSITORY: ${{ needs.build.outputs.image_cache_image_repository || format('ghcr.io/{0}/fugue-image-cache', github.repository_owner) }}
          FUGUE_EDGE_IMAGE_REPOSITORY: ${{ needs.build.outputs.edge_image_repository || format('ghcr.io/{0}/fugue-edge', github.repository_owner) }}
        run: ./scripts/resolve_control_plane_live_images.sh

      - name: Prove explicitly authorized stale pre-Helm release recovery
        if: ${{ needs.release-baseline.outputs.is_genesis != 'true' && inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' && vars.FUGUE_CONTROL_PLANE_STALE_RELEASE_RECOVERY_MODE != '' }}
        env:
          GITHUB_SHA: ${{ inputs.target_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_MODE: ${{ vars.FUGUE_CONTROL_PLANE_STALE_RELEASE_RECOVERY_MODE }}
          RECOVERY_EXPECTED_HOLDER: ${{ vars.FUGUE_CONTROL_PLANE_STALE_RELEASE_RECOVERY_EXPECTED_HOLDER }}
          RECOVERY_EXPECTED_HEAD_SHA: ${{ vars.FUGUE_CONTROL_PLANE_STALE_RELEASE_RECOVERY_EXPECTED_HEAD_SHA }}
          RECOVERY_EXPECTED_SCRIPT_BLOB: ${{ vars.FUGUE_CONTROL_PLANE_STALE_RELEASE_RECOVERY_EXPECTED_SCRIPT_BLOB }}
          RECOVERY_EXPECTED_HELM_REVISION: ${{ vars.FUGUE_CONTROL_PLANE_STALE_RELEASE_RECOVERY_EXPECTED_HELM_REVISION }}
          RECOVERY_EXPECTED_FAILURE: ${{ vars.FUGUE_CONTROL_PLANE_STALE_RELEASE_RECOVERY_EXPECTED_FAILURE }}
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
        run: |
          set -euo pipefail
          python3 ./scripts/verify_stale_release_recovery.py \
            --mode "${RECOVERY_MODE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --api-url "${GITHUB_API_URL}" \
            --workflow-path ".github/workflows/deploy-control-plane.yml" \
            --runner-name "${RUNNER_NAME}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --current-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --current-head-sha "${GITHUB_SHA}" \
            --expected-holder "${RECOVERY_EXPECTED_HOLDER}" \
            --expected-head-sha "${RECOVERY_EXPECTED_HEAD_SHA}" \
            --expected-script-blob "${RECOVERY_EXPECTED_SCRIPT_BLOB}" \
            --expected-helm-revision "${RECOVERY_EXPECTED_HELM_REVISION}" \
            --expected-failure "${RECOVERY_EXPECTED_FAILURE}" \
            --release-name "${FUGUE_RELEASE_NAME}" \
            --namespace "${FUGUE_NAMESPACE}" \
            --output "${RUNNER_TEMP}/fugue-stale-release-recovery-proof.json"

      - name: Roll out exact API hotfix with hybrid compensation
        id: api_hotfix_rollout
        if: ${{ inputs.api_hotfix_rollout_v2 != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          AUTHORIZATION: ${{ inputs.api_hotfix_rollout_v2 }}
          VERIFIED_ARTIFACTS: ${{ needs.build.outputs.verified_image_artifacts_json }}
          VERIFIED_ARTIFACTS_DIGEST: ${{ needs.build.outputs.verified_image_artifacts_digest }}
          FUGUE_API_PUBLIC_DOMAIN: ${{ vars.FUGUE_API_PUBLIC_DOMAIN || '' }}
          FUGUE_PUBLIC_DATA_PLANE_RELEASE_MODE: preserve
          FUGUE_PUBLIC_DATA_PLANE_AUTO_RELEASE_ELIGIBLE: 'false'
          FUGUE_CONTROL_PLANE_HOTFIX_EVIDENCE_DIR: ${{ runner.temp }}/fugue-api-hotfix-v2-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" == "${GITHUB_SHA}" && "${TARGET_SHA}" == '57dc767999741cea25fe4820a6c9603984dfa0b9' ]]
          [[ "${AUTHORIZATION}" == 'CONFIRM_CONTROL_PLANE_API_HOTFIX_ROLLOUT_V2_57DC' ]]
          [[ "${FUGUE_PUBLIC_DATA_PLANE_RELEASE_MODE}" == 'preserve' && "${FUGUE_PUBLIC_DATA_PLANE_AUTO_RELEASE_ELIGIBLE}" == 'false' ]]
          [[ "${FUGUE_API_PUBLIC_DOMAIN}" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]
          evidence_dir="${RUNNER_TEMP}/fugue-api-hotfix-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${evidence_dir}"
          umask 077
          ARTIFACTS="${VERIFIED_ARTIFACTS}" OUTPUT="${evidence_dir}/verified-artifacts.json" python3 - <<'PY'
          import json, os, pathlib
          value = json.loads(os.environ["ARTIFACTS"])
          pathlib.Path(os.environ["OUTPUT"]).write_bytes(json.dumps(value, ensure_ascii=True, separators=(",", ":"), sort_keys=True).encode())
          PY
          chmod 0600 "${evidence_dir}/verified-artifacts.json"
          if command -v kubectl >/dev/null 2>&1; then
            KUBECTL=(kubectl)
          else
            KUBECTL=(k3s kubectl)
          fi
          capture_non_api() {
            local output="$1"
            local raw="${output}.raw"
            "${KUBECTL[@]}" -n fugue-system get deployments,daemonsets,statefulsets,pods -o json >"${raw}"
            python3 - "${raw}" "${output}" <<'PY'
          import json, pathlib, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          result = []
          for item in value.get("items") or []:
              metadata = item.get("metadata") or {}
              if item.get("kind") == "Deployment" and metadata.get("name") == "fugue-fugue-api":
                  continue
              if item.get("kind") == "Pod":
                  labels = metadata.get("labels") or {}
                  if labels.get("app.kubernetes.io/component") == "api" and labels.get("app.kubernetes.io/instance") == "fugue":
                      continue
                  owners = metadata.get("ownerReferences") or []
                  if any(owner.get("controller") is True and owner.get("kind") in {"Job", "CronJob"} for owner in owners):
                      continue
                  statuses = (item.get("status") or {}).get("containerStatuses") or []
                  result.append({
                      "kind": "PodImageCohort",
                      "ownerReferences": owners,
                      "phase": (item.get("status") or {}).get("phase"),
                      "containers": sorted(({"name": status.get("name"), "imageID": status.get("imageID"), "ready": status.get("ready")} for status in statuses), key=lambda value: value["name"] or ""),
                  })
                  continue
              result.append({
                  "apiVersion": item.get("apiVersion"), "kind": item.get("kind"),
                  "metadata": {key: metadata.get(key) for key in ("annotations", "deletionTimestamp", "generation", "labels", "name", "namespace", "uid")},
                  "spec": item.get("spec"),
              })
          result.sort(key=lambda item: json.dumps(item, sort_keys=True, separators=(",", ":")))
          pathlib.Path(sys.argv[2]).write_text(json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
            rm -f "${raw}"
          }
          capture_non_api "${evidence_dir}/non-api-before.json"
          FUGUE_CONTROL_PLANE_API_HOTFIX_ROLLOUT_V2=true \
            FUGUE_CONTROL_PLANE_API_HOTFIX_ARTIFACT_FILE="${evidence_dir}/verified-artifacts.json" \
            FUGUE_CONTROL_PLANE_API_HOTFIX_ARTIFACT_DIGEST="${VERIFIED_ARTIFACTS_DIGEST}" \
            FUGUE_SMOKE_URL="https://${FUGUE_API_PUBLIC_DOMAIN}/healthz" \
            ./scripts/upgrade_fugue_control_plane.sh
          capture_non_api "${evidence_dir}/non-api-after.json"
          cmp -s "${evidence_dir}/non-api-before.json" "${evidence_dir}/non-api-after.json"
          [[ "$(helm status fugue -n fugue-system -o json | python3 -c 'import json,sys; value=json.load(sys.stdin); print(str(value.get("version"))+"\t"+str((value.get("info") or {}).get("status")))')" == $'820\tdeployed' ]]
          {
            printf 'image-activation-convergence=complete\n'
            printf 'pending-activation-artifacts=\n'
          } >>"${GITHUB_OUTPUT}"

      - name: Upload exact API hotfix terminal evidence
        if: ${{ steps.api_hotfix_rollout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-api-hotfix-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fugue-api-hotfix-v2-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          overwrite: false

      - name: Roll out exact Controller M16 with hybrid compensation
        id: controller_m16_rollout
        if: ${{ inputs.controller_m16_rollout_v1 != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          AUTHORIZATION: ${{ inputs.controller_m16_rollout_v1 }}
          VERIFIED_ARTIFACTS: ${{ needs.build.outputs.verified_image_artifacts_json }}
          VERIFIED_ARTIFACTS_DIGEST: ${{ needs.build.outputs.verified_image_artifacts_digest }}
          FUGUE_API_PUBLIC_DOMAIN: ${{ vars.FUGUE_API_PUBLIC_DOMAIN || '' }}
          FUGUE_PUBLIC_DATA_PLANE_RELEASE_MODE: preserve
          FUGUE_PUBLIC_DATA_PLANE_AUTO_RELEASE_ELIGIBLE: 'false'
          FUGUE_CONTROL_PLANE_HOTFIX_EVIDENCE_DIR: ${{ runner.temp }}/fugue-controller-m16-v1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" == "${GITHUB_SHA}" && "${TARGET_SHA}" == '58fc2e560064214e3f329765c9ec7839ee513c27' ]]
          [[ "${AUTHORIZATION}" == 'CONFIRM_CONTROL_PLANE_CONTROLLER_M16_ROLLOUT_V1_58FC' ]]
          [[ "${VERIFIED_ARTIFACTS_DIGEST}" == 'sha256:05138686d8fa09945a1f158f15e056620a390ea9a277ec0c5d9451472f1a10d3' ]]
          [[ "${FUGUE_PUBLIC_DATA_PLANE_RELEASE_MODE}" == 'preserve' && "${FUGUE_PUBLIC_DATA_PLANE_AUTO_RELEASE_ELIGIBLE}" == 'false' ]]
          [[ "${FUGUE_API_PUBLIC_DOMAIN}" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]
          evidence_dir="${FUGUE_CONTROL_PLANE_HOTFIX_EVIDENCE_DIR}"
          install -d -m 0700 "${evidence_dir}"
          artifact_file="${evidence_dir}/verified-image-artifacts.json"
          ARTIFACTS="${VERIFIED_ARTIFACTS}" OUTPUT="${artifact_file}" python3 - <<'PY'
          import json, os, pathlib
          value=json.loads(os.environ["ARTIFACTS"])
          raw=json.dumps(value,ensure_ascii=True,separators=(",", ":"),sort_keys=True).encode()
          if os.environ["ARTIFACTS"] != raw.decode() or len(value)!=1 or value[0].get("component")!="controller": raise SystemExit(1)
          pathlib.Path(os.environ["OUTPUT"]).write_bytes(raw)
          PY
          chmod 0600 "${artifact_file}"
          FUGUE_CONTROL_PLANE_CONTROLLER_M16_ROLLOUT_V1=true \
            FUGUE_CONTROL_PLANE_CONTROLLER_M16_CONFIRM="${AUTHORIZATION}" \
            FUGUE_CONTROL_PLANE_CONTROLLER_M16_ARTIFACT_FILE="${artifact_file}" \
            FUGUE_CONTROL_PLANE_CONTROLLER_M16_ARTIFACT_DIGEST="${VERIFIED_ARTIFACTS_DIGEST}" \
            FUGUE_SMOKE_URL="https://${FUGUE_API_PUBLIC_DOMAIN}/healthz" \
            ./scripts/upgrade_fugue_control_plane.sh
          [[ "$(helm status fugue -n fugue-system -o json | python3 -c 'import json,sys; value=json.load(sys.stdin); print(str(value.get("version"))+"\t"+str((value.get("info") or {}).get("status")))')" == $'821\tdeployed' ]]
          {
            printf 'image-activation-convergence=complete\n'
            printf 'pending-activation-artifacts=\n'
          } >>"${GITHUB_OUTPUT}"

      - name: Upload exact Controller M16 terminal evidence
        if: ${{ steps.controller_m16_rollout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-controller-m16-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fugue-controller-m16-v1-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          overwrite: false

      - name: Upgrade Fugue control plane through uploaded operational evidence
