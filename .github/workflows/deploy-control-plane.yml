name: deploy-control-plane

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact lowercase main commit SHA authorized for this release
        required: true
        type: string
      target_sha:
        description: Exact lowercase runtime commit to build and deploy
        required: true
        type: string
      image_cache_convergence:
        description: Internal same-SHA image-cache convergence successor
        required: true
        type: boolean
        default: false
      convergence_source_run_id:
        description: Source run that cryptographically bound this convergence successor
        required: false
        type: string
        default: ''
      public_data_plane_adoption_run_id:
        description: Exact successful Stage1 adoption run; empty for ordinary releases.
        required: false
        type: string
        default: ''
      public_data_plane_adoption_baseline_digest:
        description: Exact Stage1 baseline digest; must be paired with the Stage1 run ID.
        required: false
        type: string
        default: ''
      api_hotfix_rollout_v2:
        description: Exact short-lived authorization for the fixed API-only 57dc rollout transaction
        required: false
        type: string
        default: ''
      api_hotfix_recovery_only:
        description: Exact one-shot recovery authorization for failed API hotfix run 30804033592
        required: false
        type: string
        default: ''
      artifact_reuse_receipt_b64:
        description: Base64 of one existing canonical exact-SHA build receipt; invalid or incomplete receipts fail without rebuilding
        required: false
        type: string
        default: ''
      historical_controller_build_only_v1:
        description: Exact short-lived authorization for the fixed 58fc Controller build-only transaction
        required: false
        type: string
        default: ''
      controller_m16_rollout_v1:
        description: Exact short-lived authorization for the fixed 58fc Controller-only M16 rollout transaction
        required: false
        type: string
        default: ''
      controller_m16_observed_recovery_v1:
        description: Exact one-shot independent observed-state recovery for failed Controller M16 run 30836591717
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: fugue-production-cluster-mutation-v1
  cancel-in-progress: false

jobs:
  release-input-guard:
    if: ${{ inputs.historical_controller_build_only_v1 == '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact public data-plane Stage1 handoff
        if: ${{ inputs.public_data_plane_adoption_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-data-plane-adoption-${{ inputs.public_data_plane_adoption_run_id }}-1
          path: ${{ runner.temp }}/public-data-plane-stage1-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.public_data_plane_adoption_run_id }}

      - name: Download convergence successor authorization
        if: ${{ inputs.image_cache_convergence }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fugue-release-convergence-successor-${{ inputs.convergence_source_run_id }}-1
          path: ${{ runner.temp }}/fugue-release-convergence-authorization
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.convergence_source_run_id }}

      - name: Guard exact main commit authorization
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          IMAGE_CACHE_CONVERGENCE: ${{ inputs.image_cache_convergence && 'true' || 'false' }}
          CONVERGENCE_SOURCE_RUN_ID: ${{ inputs.convergence_source_run_id }}
          CONVERGENCE_AUTHORIZATION_FILE: ${{ runner.temp }}/fugue-release-convergence-authorization/successor.json
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          PUBLIC_DATA_PLANE_ADOPTION_RUN_ID: ${{ inputs.public_data_plane_adoption_run_id }}
          PUBLIC_DATA_PLANE_ADOPTION_BASELINE_DIGEST: ${{ inputs.public_data_plane_adoption_baseline_digest }}
          PUBLIC_DATA_PLANE_ADOPTION_BASELINE: ${{ runner.temp }}/public-data-plane-stage1-handoff/stage1-baseline.json
          PUBLIC_DATA_PLANE_ADOPTION_TRACE: ${{ runner.temp }}/public-data-plane-stage1-handoff/execution-trace.json
          API_HOTFIX_ROLLOUT_V2: ${{ inputs.api_hotfix_rollout_v2 }}
          API_HOTFIX_RECOVERY_ONLY: ${{ inputs.api_hotfix_recovery_only }}
          ARTIFACT_REUSE_RECEIPT_B64: ${{ inputs.artifact_reuse_receipt_b64 }}
          CONTROLLER_M16_ROLLOUT_V1: ${{ inputs.controller_m16_rollout_v1 }}
          CONTROLLER_M16_OBSERVED_RECOVERY_V1: ${{ inputs.controller_m16_observed_recovery_v1 }}
          HISTORICAL_CONTROLLER_BUILD_ONLY_V1: ${{ inputs.historical_controller_build_only_v1 }}
        run: |
          set -euo pipefail
          CONTROLLER_M16_OBSERVED_RECOVERY_V1="${CONTROLLER_M16_OBSERVED_RECOVERY_V1:-}"
          [[ "${EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${EVENT_REF_NAME}" == "main" ]]
          [[ "${EVENT_REF_TYPE}" == "branch" ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${ACTUAL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_SHA}" == "${ACTUAL_SHA}" ]]
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${GITHUB_RUN_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" == '1' ]]
          case "${API_HOTFIX_RECOVERY_ONLY:-}" in
            '') ;;
            CONFIRM_API_HOTFIX_RECOVERY_30804033592)
              [[ -z "${API_HOTFIX_ROLLOUT_V2}" && -z "${CONTROLLER_M16_ROLLOUT_V1}" && -z "${CONTROLLER_M16_OBSERVED_RECOVERY_V1}" && "${TARGET_SHA}" == "${EXPECTED_SHA}" ]]
              [[ "${IMAGE_CACHE_CONVERGENCE}" == 'false' && -z "${CONVERGENCE_SOURCE_RUN_ID}" ]]
              [[ -z "${PUBLIC_DATA_PLANE_ADOPTION_RUN_ID}" && -z "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE_DIGEST}" ]]
              ;;
            *) exit 1 ;;
          esac
          case "${CONTROLLER_M16_ROLLOUT_V1:-}" in
            '') ;;
            CONFIRM_CONTROL_PLANE_CONTROLLER_M16_ROLLOUT_V1_58FC)
              [[ -z "${API_HOTFIX_ROLLOUT_V2}" && -z "${API_HOTFIX_RECOVERY_ONLY}" && -z "${CONTROLLER_M16_OBSERVED_RECOVERY_V1}" ]]
              [[ "${TARGET_SHA}" == '58fc2e560064214e3f329765c9ec7839ee513c27' && "${TARGET_SHA}" != "${EXPECTED_SHA}" ]]
              [[ -n "${ARTIFACT_REUSE_RECEIPT_B64}" && ${#ARTIFACT_REUSE_RECEIPT_B64} -le 196608 ]]
              [[ "${IMAGE_CACHE_CONVERGENCE}" == 'false' && -z "${CONVERGENCE_SOURCE_RUN_ID}" ]]
              [[ -z "${PUBLIC_DATA_PLANE_ADOPTION_RUN_ID}" && -z "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE_DIGEST}" ]]
              ;;
            *) exit 1 ;;
          esac
          case "${CONTROLLER_M16_OBSERVED_RECOVERY_V1:-}" in
            '') ;;
            CONFIRM_CONTROL_PLANE_CONTROLLER_M16_OBSERVED_RECOVERY_V1_30836591717)
              [[ -z "${API_HOTFIX_ROLLOUT_V2}" && -z "${API_HOTFIX_RECOVERY_ONLY}" && -z "${CONTROLLER_M16_ROLLOUT_V1}" ]]
              [[ -z "${HISTORICAL_CONTROLLER_BUILD_ONLY_V1}" && -z "${ARTIFACT_REUSE_RECEIPT_B64}" ]]
              [[ "${TARGET_SHA}" == "${EXPECTED_SHA}" ]]
              [[ "${IMAGE_CACHE_CONVERGENCE}" == 'false' && -z "${CONVERGENCE_SOURCE_RUN_ID}" ]]
              [[ -z "${PUBLIC_DATA_PLANE_ADOPTION_RUN_ID}" && -z "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE_DIGEST}" ]]
              ;;
            *) exit 1 ;;
          esac
          case "${API_HOTFIX_ROLLOUT_V2:-}" in
            '')
              if [[ -z "${CONTROLLER_M16_ROLLOUT_V1}" && -z "${CONTROLLER_M16_OBSERVED_RECOVERY_V1}" ]]; then
                [[ -z "${ARTIFACT_REUSE_RECEIPT_B64}" ]]
              fi
              if [[ -z "${API_HOTFIX_RECOVERY_ONLY}" && -z "${CONTROLLER_M16_ROLLOUT_V1}" && -z "${CONTROLLER_M16_OBSERVED_RECOVERY_V1}" && "${TARGET_SHA}" != "${EXPECTED_SHA}" ]]; then
                [[ "${TARGET_SHA}" == 'd1e7ed9cdedbaa09db9bd78b4e433b94c7357510' ]]
              fi
              ;;
            CONFIRM_CONTROL_PLANE_API_HOTFIX_ROLLOUT_V2_57DC)
              [[ -z "${API_HOTFIX_RECOVERY_ONLY}" && -z "${CONTROLLER_M16_ROLLOUT_V1}" && -z "${CONTROLLER_M16_OBSERVED_RECOVERY_V1}" ]]
              [[ "${TARGET_SHA}" == '57dc767999741cea25fe4820a6c9603984dfa0b9' && "${TARGET_SHA}" != "${EXPECTED_SHA}" ]]
              [[ -n "${ARTIFACT_REUSE_RECEIPT_B64}" && ${#ARTIFACT_REUSE_RECEIPT_B64} -le 196608 ]]
              [[ "${IMAGE_CACHE_CONVERGENCE}" == 'false' && -z "${CONVERGENCE_SOURCE_RUN_ID}" ]]
              [[ -z "${PUBLIC_DATA_PLANE_ADOPTION_RUN_ID}" && -z "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE_DIGEST}" ]]
              ;;
            *) exit 1 ;;
          esac
          remote_main="$(timeout --kill-after=2s 10s gh api \
            "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${remote_main}" =~ ^[0-9a-f]{40}$ && "${remote_main}" == "${EXPECTED_SHA}" ]]

          if [[ -z "${PUBLIC_DATA_PLANE_ADOPTION_RUN_ID}" && -z "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE_DIGEST}" ]]; then
            [[ ! -e "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE}" && ! -L "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE}" ]]
            [[ ! -e "${PUBLIC_DATA_PLANE_ADOPTION_TRACE}" && ! -L "${PUBLIC_DATA_PLANE_ADOPTION_TRACE}" ]]
          else
            [[ "${PUBLIC_DATA_PLANE_ADOPTION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            [[ "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ -f "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE}" && ! -L "${PUBLIC_DATA_PLANE_ADOPTION_BASELINE}" ]]
            [[ -f "${PUBLIC_DATA_PLANE_ADOPTION_TRACE}" && ! -L "${PUBLIC_DATA_PLANE_ADOPTION_TRACE}" ]]
            stage1_run="$(timeout --kill-after=2s 10s gh api \
              "repos/${REPOSITORY}/actions/runs/${PUBLIC_DATA_PLANE_ADOPTION_RUN_ID}" \
              --jq '[.id,.run_attempt,.event,.head_sha,.status,.conclusion,.path] | @tsv')"
            IFS=$'\t' read -r stage1_id stage1_attempt stage1_event stage1_sha stage1_status stage1_conclusion stage1_path stage1_extra <<<"${stage1_run}"
            [[ -z "${stage1_extra:-}" && "${stage1_id}" == "${PUBLIC_DATA_PLANE_ADOPTION_RUN_ID}" ]]
            [[ "${stage1_attempt}" == '1' && "${stage1_event}" == workflow_dispatch && "${stage1_sha}" == "${EXPECTED_SHA}" ]]
            [[ "${stage1_status}" == completed && "${stage1_conclusion}" == success ]]
            [[ "${stage1_path}" == '.github/workflows/adopt-public-data-plane-helm-baseline.yml' ]]
            BASELINE="${PUBLIC_DATA_PLANE_ADOPTION_BASELINE}" TRACE="${PUBLIC_DATA_PLANE_ADOPTION_TRACE}" \
              EXPECTED_DIGEST="${PUBLIC_DATA_PLANE_ADOPTION_BASELINE_DIGEST}" python3 - <<'PY'
          import json, os
          baseline = json.load(open(os.environ["BASELINE"], encoding="utf-8"))
          trace = json.load(open(os.environ["TRACE"], encoding="utf-8"))
          assert baseline.get("digest") == os.environ["EXPECTED_DIGEST"]
          assert baseline.get("stage1PlanDigest") == trace.get("planDigest")
          events = trace.get("events") or []
          assert events and events[-1].get("phase") == "lease-released"
          PY
          fi

          case "${IMAGE_CACHE_CONVERGENCE}" in
            false)
              [[ -z "${CONVERGENCE_SOURCE_RUN_ID}" ]] || exit 1
              [[ ! -e "${CONVERGENCE_AUTHORIZATION_FILE}" && ! -L "${CONVERGENCE_AUTHORIZATION_FILE}" ]] || exit 1
              ;;
            true)
              [[ "${CONVERGENCE_SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
              [[ "${CONVERGENCE_SOURCE_RUN_ID}" != "${GITHUB_RUN_ID}" ]] || exit 1
              [[ -f "${CONVERGENCE_AUTHORIZATION_FILE}" && ! -L "${CONVERGENCE_AUTHORIZATION_FILE}" ]] || exit 1
              source_run="$({ timeout --kill-after=2s 10s gh api \
                "repos/${REPOSITORY}/actions/runs/${CONVERGENCE_SOURCE_RUN_ID}" \
                --jq '[.id,.run_number,.run_attempt,.event,.head_branch,.head_sha,.status,.conclusion,.path] | @tsv'; } 2>/dev/null)" || exit 1
              IFS=$'\t' read -r source_id source_number source_attempt source_event source_branch \
                source_sha source_status source_conclusion source_path extra <<<"${source_run}" || exit 1
              [[ -z "${extra:-}" ]] || exit 1
              [[ "${source_id}" == "${CONVERGENCE_SOURCE_RUN_ID}" ]] || exit 1
              [[ "${source_number}" =~ ^[1-9][0-9]*$ && "${source_number}" -lt "${GITHUB_RUN_NUMBER}" ]] || exit 1
              [[ "${source_attempt}" == '1' && "${source_event}" == 'workflow_dispatch' ]] || exit 1
              [[ "${source_branch}" == 'main' && "${source_sha}" == "${EXPECTED_SHA}" ]] || exit 1
              [[ "${source_status}" == 'completed' && "${source_conclusion}" == 'success' ]] || exit 1
              [[ "${source_path}" == '.github/workflows/deploy-control-plane.yml' ]] || exit 1
              python3 - "${CONVERGENCE_AUTHORIZATION_FILE}" "${CONVERGENCE_SOURCE_RUN_ID}" \
                "${GITHUB_RUN_ID}" "${GITHUB_RUN_NUMBER}" "${EXPECTED_SHA}" "${TARGET_SHA}" "${REPOSITORY}" <<'PY' || exit 1
          import datetime
          import hashlib
          import json
          import pathlib
          import re
          import sys

          path, source_run_id, successor_run_id, successor_run_number, expected_sha, target_sha, repository = sys.argv[1:]
          raw = pathlib.Path(path).read_bytes()
          value = json.loads(raw)
          expected_keys = {
              "baseline_advanced", "cluster_mutation_attempted", "pending_activation_artifacts",
              "recorded_at", "repository", "schema_version", "source_head_sha", "source_run_attempt",
              "source_image_cache_artifact", "source_image_cache_artifacts_digest",
              "source_image_cache_base_ref", "source_run_id", "successor_run_id",
              "successor_run_number", "successor_status",
              "successor_target_sha", "workflow", "workflow_dispatch_attempted",
          }
          if type(value) is not dict or set(value) != expected_keys:
              raise SystemExit("convergence authorization shape is invalid")
          expected_identity = {
              "schema_version": 2,
              "workflow": "deploy-control-plane",
              "repository": repository,
              "source_run_id": source_run_id,
              "source_run_attempt": 1,
              "source_head_sha": expected_sha,
              "pending_activation_artifacts": ["image_cache"],
              "successor_run_id": successor_run_id,
              "successor_run_number": int(successor_run_number),
              "successor_status": value["successor_status"],
              "successor_target_sha": target_sha,
              "baseline_advanced": False,
              "cluster_mutation_attempted": False,
              "workflow_dispatch_attempted": True,
              "recorded_at": value["recorded_at"],
          }
          for key, expected in expected_identity.items():
              if value[key] != expected:
                  raise SystemExit("convergence authorization identity is invalid")
          if value["successor_status"] not in {"queued", "in_progress", "waiting", "pending", "requested"}:
              raise SystemExit("convergence authorization identity is invalid")
          digest_re = re.compile(r"sha256:[0-9a-f]{64}")
          if re.fullmatch(r"[0-9a-f]{40}", value["source_image_cache_base_ref"] or "") is None:
              raise SystemExit("convergence image-cache base ref is invalid")
          artifact = value["source_image_cache_artifact"]
          artifact_keys = {
              "component", "config_digest", "immutable_ref", "oci_revision",
              "platform_manifest_digest", "repository", "source_tag", "top_digest",
              "verification",
          }
          if type(artifact) is not dict or set(artifact) != artifact_keys:
              raise SystemExit("convergence image-cache artifact shape is invalid")
          image_repository = f"ghcr.io/{repository.split('/', 1)[0].lower()}/fugue-image-cache"
          if artifact["component"] != "image_cache" or artifact["repository"] != image_repository:
              raise SystemExit("convergence image-cache artifact identity is invalid")
          if artifact["source_tag"] != target_sha or artifact["oci_revision"] != target_sha:
              raise SystemExit("convergence image-cache artifact revision is invalid")
          for field in ("top_digest", "config_digest", "platform_manifest_digest"):
              if digest_re.fullmatch(artifact[field] or "") is None:
                  raise SystemExit(f"convergence image-cache artifact {field} is invalid")
          if artifact["immutable_ref"] != f'{image_repository}@{artifact["top_digest"]}':
              raise SystemExit("convergence image-cache immutable ref is invalid")
          if artifact["verification"] != "registry_manifest_config_and_layer_get":
              raise SystemExit("convergence image-cache verification is invalid")
          canonical_artifacts = json.dumps([artifact], ensure_ascii=True, separators=(",", ":"), sort_keys=True).encode()
          artifacts_digest = "sha256:" + hashlib.sha256(canonical_artifacts).hexdigest()
          if value["source_image_cache_artifacts_digest"] != artifacts_digest:
              raise SystemExit("convergence image-cache provenance digest is invalid")
          timestamp = datetime.datetime.fromisoformat(value["recorded_at"])
          if timestamp.tzinfo is None or timestamp.utcoffset() != datetime.timedelta(0):
              raise SystemExit("convergence authorization timestamp is invalid")
          canonical = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if raw != canonical:
              raise SystemExit("convergence authorization bytes are not canonical")
          PY
              ;;
            *) exit 1 ;;
          esac

  recover-api-hotfix-fence:
    needs:
      - release-input-guard
      - release-gate
    if: ${{ needs.release-input-guard.result == 'success' && needs.release-gate.result == 'success' && inputs.api_hotfix_recovery_only == 'CONFIRM_API_HOTFIX_RECOVERY_30804033592' }}
    timeout-minutes: 15
    runs-on:
      - self-hosted
      - linux
      - x64
      - fugue
      - control-plane
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout exact recovery implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify exact recovery implementation identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          AUTHORIZATION: ${{ inputs.api_hotfix_recovery_only }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${GITHUB_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 ]]
          [[ "${EXPECTED_SHA}" == "${GITHUB_SHA}" && "${TARGET_SHA}" == "${EXPECTED_SHA}" ]]
          [[ "${AUTHORIZATION}" == CONFIRM_API_HOTFIX_RECOVERY_30804033592 ]]
          [[ "$(git rev-parse --verify HEAD)" == "${EXPECTED_SHA}" ]]
          [[ "$(git rev-parse --verify HEAD^)" == 00eb43b0e97b6daa2357e88ea7e8d53d69e3364d ]]
          [[ "$(git rev-parse --verify HEAD^^)" == 9d5fea041f79e26d4ccd0bb70b460d150d14bcda ]]
          [[ "$(git rev-parse --verify HEAD^^^)" == 7c6085bfc3e7dd3d3c49a501da6ccf9c10742bfc ]]
          [[ "$(git rev-parse --verify HEAD^^^^)" == 14d598030b574d009a058a736a92d5dd05f951c6 ]]
          [[ "$(git rev-parse --verify HEAD^^^^^)" == 1188a37ff87e0117abd548da107f4d9f1f7c24fd ]]
          [[ "$(git rev-parse --verify HEAD^^^^^^)" == c12f9548f4e15464cc572189d4b3381c7e1b9a03 ]]
          [[ "$(git rev-parse --verify HEAD^^^^^^^)" == d4b5ed71838d48766fa5704a27f46fcb578bf2f4 ]]
          [[ "$(git rev-parse --verify HEAD^^^^^^^^)" == 120966a4af9b7c8cfcb2c3b6b94e38504ddbbd49 ]]
          [[ "$(git rev-parse --verify HEAD^^^^^^^^^)" == 9bf7e478af8d7b9dacedaa20f4f6c31ccc97e184 ]]
          [[ "$(git rev-list --count 9bf7e478af8d7b9dacedaa20f4f6c31ccc97e184..HEAD)" == 9 ]]
          [[ -z "$(git rev-list --merges 9bf7e478af8d7b9dacedaa20f4f6c31ccc97e184..HEAD)" ]]
          [[ "$(git diff --name-only d4b5ed71838d48766fa5704a27f46fcb578bf2f4^ d4b5ed71838d48766fa5704a27f46fcb578bf2f4)" == internal/platformsafety/release_workflow_test.go ]]
          [[ "$(git diff --numstat d4b5ed71838d48766fa5704a27f46fcb578bf2f4^ d4b5ed71838d48766fa5704a27f46fcb578bf2f4)" == $'1\t0\tinternal/platformsafety/release_workflow_test.go' ]]
          [[ "$(git diff --name-only 9bf7e478af8d7b9dacedaa20f4f6c31ccc97e184 120966a4af9b7c8cfcb2c3b6b94e38504ddbbd49)" == $'.github/workflows/deploy-control-plane.yml\ninternal/platformsafety/release_workflow_test.go\ninternal/releasedomain/control_plane_hotfix_adoption.go\ninternal/releasedomain/control_plane_hotfix_adoption_test.go\nscripts/test_control_plane_hotfix_adoption.sh\nscripts/upgrade_fugue_control_plane.sh' ]]
          [[ "$(git diff --name-only 9bf7e478af8d7b9dacedaa20f4f6c31ccc97e184 HEAD)" == $'.github/workflows/deploy-control-plane.yml\ninternal/platformsafety/release_workflow_test.go\ninternal/releasedomain/control_plane_hotfix_adoption.go\ninternal/releasedomain/control_plane_hotfix_adoption_test.go\nscripts/build_control_plane_images.sh\nscripts/test_control_plane_build_reuse.py\nscripts/test_control_plane_hotfix_adoption.sh\nscripts/test_verify_registry_image.py\nscripts/upgrade_fugue_control_plane.sh\nscripts/verify_registry_image.py' ]]

      - name: Verify LKG and clear exact API hotfix recovery fence
        id: recovery
        env:
          FUGUE_CONTROL_PLANE_API_HOTFIX_RECOVERY_ONLY: 'true'
          FUGUE_CONTROL_PLANE_API_HOTFIX_RECOVERY_CONFIRM: ${{ inputs.api_hotfix_recovery_only }}
          FUGUE_CONTROL_PLANE_API_HOTFIX_RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/fugue-api-hotfix-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          FUGUE_SMOKE_URL: https://${{ vars.FUGUE_API_PUBLIC_DOMAIN }}/healthz
        run: |
          set -euo pipefail
          install -d -m 0700 "${FUGUE_CONTROL_PLANE_API_HOTFIX_RECOVERY_EVIDENCE_DIR}"
          ./scripts/upgrade_fugue_control_plane.sh

      - name: Upload sanitized API hotfix recovery evidence
        id: recovery_evidence
        if: ${{ always() && steps.recovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-api-hotfix-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fugue-api-hotfix-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          overwrite: false

  prepare-controller-m16-observed-recovery-tool:
    needs:
      - release-input-guard
