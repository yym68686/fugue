            case "$1" in
              --cache-to)
                [[ "$#" -ge 2 ]]
                [[ "$2" == 'type=gha,scope=fugue-control-plane-controller,mode=max,ignore-error=true' ]]
                removed_cache_export=$((removed_cache_export + 1))
                shift 2
                ;;
              --cache-to=*)
                [[ "$1" == '--cache-to=type=gha,scope=fugue-control-plane-controller,mode=max,ignore-error=true' ]]
                removed_cache_export=$((removed_cache_export + 1))
                shift
                ;;
              *)
                forwarded+=("$1")
                shift
                ;;
            esac
          done
          [[ "${removed_cache_export}" == '1' ]]
          for argument in "${forwarded[@]}"; do
            [[ "${argument}" != --cache-to && "${argument}" != --cache-to=* ]]
          done
          {
            printf 'cache_export_removed=%s\n' "${removed_cache_export}"
            printf 'forwarded_argument=%q\n' "${forwarded[@]}"
          } >"${FUGUE_DOCKER_SHIM_AUDIT}"
          printf 'registry_write_entered\n' >"${FUGUE_DOCKER_WRITE_STATE}"
          set +e
          "${FUGUE_REAL_DOCKER}" "${forwarded[@]}"
          status=$?
          set -e
          if [[ "${status}" == '0' ]]; then
            printf 'registry_write_completed\n' >"${FUGUE_DOCKER_WRITE_STATE}"
          fi
          exit "${status}"
          SHIM
          chmod 0700 "${shim_dir}/docker"

          export FUGUE_REAL_DOCKER="${real_docker}"
          export FUGUE_DOCKER_SHIM_AUDIT="${receipt_dir}/docker-build-audit.log"
          export FUGUE_DOCKER_WRITE_STATE="${receipt_dir}/registry-write.state"

          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "${exact_target}" ]]
          [[ "$(git rev-parse --verify 'HEAD^{tree}')" == "${exact_tree}" ]]
          [[ "$(git rev-parse --verify 'HEAD:Dockerfile.controller')" == "${exact_dockerfile_blob}" ]]
          [[ "$(git rev-parse --verify 'HEAD:scripts/build_control_plane_images.sh')" == "${exact_script_blob}" ]]
          [[ "$(git rev-parse --verify 'HEAD:scripts/verify_registry_image.py')" == "${exact_verifier_blob}" ]]
          [[ "$(sha256sum Dockerfile.controller | awk '{print $1}')" == "${exact_dockerfile_sha256}" ]]
          [[ "$(sha256sum scripts/build_control_plane_images.sh | awk '{print $1}')" == "${exact_script_sha256}" ]]
          [[ "$(sha256sum scripts/verify_registry_image.py | awk '{print $1}')" == "${exact_verifier_sha256}" ]]
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          set +e
          "${real_docker}" buildx imagetools inspect "${mutable_ref}" \
            >"${receipt_dir}/registry-preflight.log" 2>&1
          preflight_status=$?
          set -e
          [[ "${preflight_status}" -ne 0 ]]
          grep -Eiq '(manifest unknown|not found)' "${receipt_dir}/registry-preflight.log"
          printf 'tag_absent\n' >"${receipt_dir}/registry-preflight.status"
          prewrite_main="$(timeout --kill-after=2s 10s gh api \
            "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${prewrite_main}" == "${EXPECTED_MAIN_SHA}" ]]
          printf '%s' "${prewrite_main}" >"${receipt_dir}/observed-main-sha"

          set +e
          PATH="${shim_dir}:${PATH}" ./scripts/build_control_plane_images.sh
          build_status=$?
          set -e
          [[ -f "${FUGUE_DOCKER_SHIM_AUDIT}" && ! -L "${FUGUE_DOCKER_SHIM_AUDIT}" ]]
          [[ "$(grep -c '^cache_export_removed=1$' "${FUGUE_DOCKER_SHIM_AUDIT}")" == '1' ]]
          if [[ "${build_status}" == '0' ]]; then
            [[ "$(cat "${FUGUE_DOCKER_WRITE_STATE}")" == 'registry_write_completed' ]]
          fi
          exit "${build_status}"

      - name: Seal verified or quarantined historical Controller receipt
        id: seal_receipt
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        env:
          BUILD_OUTCOME: ${{ steps.build_images.outcome }}
          CONTROLLER_IMAGE_DIGEST: ${{ steps.build_images.outputs.controller_image_digest }}
          VERIFIED_IMAGE_ARTIFACTS_JSON: ${{ steps.build_images.outputs.verified_image_artifacts_json }}
          VERIFIED_IMAGE_ARTIFACTS_DIGEST: ${{ steps.build_images.outputs.verified_image_artifacts_digest }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          readonly receipt_dir="${FUGUE_HISTORICAL_CONTROLLER_RECEIPT_DIR}"
          readonly image_repository='ghcr.io/yym68686/fugue-controller'
          readonly mutable_ref="${image_repository}:58fc2e560064214e3f329765c9ec7839ee513c27"
          registry_write_state='not_entered'
          if [[ -f "${receipt_dir}/registry-write.state" && ! -L "${receipt_dir}/registry-write.state" ]]; then
            registry_write_state="$(cat "${receipt_dir}/registry-write.state")"
          fi
          recovered_top_digest=''
          registry_inspect_status='not_attempted'
          if [[ "${BUILD_OUTCOME}" != 'success' && \
            ("${registry_write_state}" == 'registry_write_entered' || "${registry_write_state}" == 'registry_write_completed') ]]; then
            set +e
            docker buildx imagetools inspect "${mutable_ref}" >"${receipt_dir}/quarantine-registry-inspect.log" 2>&1
            inspect_status=$?
            set -e
            if [[ "${inspect_status}" == '0' ]]; then
              registry_inspect_status='published_inspected'
              recovered_top_digest="$(awk '$1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ {print $2; exit}' \
                "${receipt_dir}/quarantine-registry-inspect.log")"
              [[ "${recovered_top_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            elif grep -Eiq '(manifest unknown|not found)' "${receipt_dir}/quarantine-registry-inspect.log"; then
              registry_inspect_status='not_published_after_write_attempt'
            else
              registry_inspect_status='write_attempt_uninspectable'
            fi
          fi
          export REGISTRY_WRITE_STATE="${registry_write_state}"
          export REGISTRY_INSPECT_STATUS="${registry_inspect_status}"
          export RECOVERED_TOP_DIGEST="${recovered_top_digest}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          receipt_dir = Path(os.environ["FUGUE_HISTORICAL_CONTROLLER_RECEIPT_DIR"])
          build_outcome = os.environ["BUILD_OUTCOME"]
          target = "58fc2e560064214e3f329765c9ec7839ee513c27"
          image_repository = "ghcr.io/yym68686/fugue-controller"
          digest_re = re.compile(r"sha256:[0-9a-f]{64}")
          observed_main_path = receipt_dir / "observed-main-sha"
          observed_main = observed_main_path.read_text(encoding="ascii") if observed_main_path.is_file() else None
          preflight_path = receipt_dir / "registry-preflight.status"
          registry_preflight = preflight_path.read_text(encoding="ascii").strip() if preflight_path.is_file() else None
          common = {
              "activation_eligible": False,
              "activation_target_count": 0,
              "automatic_registry_deletion_attempted": False,
              "build_target_count": 1,
              "build_targets": ["controller"],
              "dockerfile_blob": "dcb8be5d58a06f43308aeea85d2dc3b8abab34f9",
              "dockerfile_sha256": "sha256:89c0b0333844342b8d62bc27df1a7119b9f52c06ab7be1e6a3ecfc7134d6a470",
              "expected_main_sha": os.environ["EXPECTED_MAIN_SHA"],
              "observed_main_sha": observed_main,
              "production_mutation_attempted": False,
              "registry_preflight": registry_preflight,
              "registry_repository": image_repository,
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "run_id": int(os.environ["RUN_ID"]),
              "schema_version": 1,
              "script_blob": "37b1bd7640849cc5b1a77d69680ddfa195bc61b5",
              "script_sha256": "sha256:242548c1fe274575da5a83121141f28bd8927e092b7c827fc86097334c1455c6",
              "source_commit": target,
              "source_tree": "0cbb953d3985b5cb4ca547a83e25013942232883",
              "target_sha": os.environ["TARGET_SHA"],
              "verifier_blob": "33eef7fd57bd5ce44bb1ebca113cadd988c7e7da",
              "verifier_sha256": "sha256:caa94e5c8603335265f8ccf83d52f9712730ee273e6eb55799719f875f545114",
              "workflow": "deploy-control-plane",
          }
          if re.fullmatch(r"[0-9a-f]{40}", common["expected_main_sha"] or "") is None or common["target_sha"] != target:
              raise SystemExit("historical Controller receipt identity is invalid")
          if common["run_attempt"] != 1 or os.environ["REPOSITORY"] != "yym68686/fugue":
              raise SystemExit("historical Controller receipt run identity is invalid")

          if build_outcome == "success":
              if observed_main != common["expected_main_sha"] or registry_preflight != "tag_absent":
                  raise SystemExit("historical Controller prewrite receipt is invalid")
              raw = os.environ["VERIFIED_IMAGE_ARTIFACTS_JSON"]
              artifacts = json.loads(raw)
              canonical = json.dumps(artifacts, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
              if raw != canonical or type(artifacts) is not list or len(artifacts) != 1:
                  raise SystemExit("historical Controller verified artifact inventory is not canonical singleton JSON")
              artifact = artifacts[0]
              expected_keys = {
                  "component", "config_digest", "immutable_ref", "oci_revision",
                  "platform_manifest_digest", "repository", "source_tag", "top_digest", "verification",
              }
              if type(artifact) is not dict or set(artifact) != expected_keys:
                  raise SystemExit("historical Controller artifact shape is invalid")
              if artifact["component"] != "controller" or artifact["repository"] != image_repository:
                  raise SystemExit("historical Controller artifact identity is invalid")
              if artifact["source_tag"] != target or artifact["oci_revision"] != target:
                  raise SystemExit("historical Controller artifact source binding is invalid")
              for field in ("top_digest", "platform_manifest_digest", "config_digest"):
                  if digest_re.fullmatch(artifact[field] or "") is None:
                      raise SystemExit(f"historical Controller artifact {field} is invalid")
              if artifact["immutable_ref"] != f'{image_repository}@{artifact["top_digest"]}':
                  raise SystemExit("historical Controller immutable ref is invalid")
              if artifact["verification"] != "registry_manifest_config_and_layer_get":
                  raise SystemExit("historical Controller verification method is invalid")
              if os.environ["CONTROLLER_IMAGE_DIGEST"] != artifact["top_digest"]:
                  raise SystemExit("historical Controller top digest output drifted")
              provenance = "sha256:" + hashlib.sha256(canonical.encode()).hexdigest()
              if os.environ["VERIFIED_IMAGE_ARTIFACTS_DIGEST"] != provenance:
                  raise SystemExit("historical Controller provenance digest is invalid")
              (receipt_dir / "verified-image-artifacts.json").write_bytes(canonical.encode())
              (receipt_dir / "verified-image-artifacts.digest").write_text(provenance, encoding="ascii")
              receipt = common | {
                  "artifact": artifact,
                  "build_outcome": "success",
                  "kind": "HistoricalControllerBuildOnlyReceipt",
                  "registry_artifact_state": "verified",
                  "status": "verified",
                  "verified_image_artifacts_digest": provenance,
              }
          else:
              write_state = os.environ["REGISTRY_WRITE_STATE"]
              inspect_state = os.environ["REGISTRY_INSPECT_STATUS"]
              recovered = os.environ["RECOVERED_TOP_DIGEST"]
              write_attempted = write_state in {"registry_write_entered", "registry_write_completed"}
              if write_attempted and registry_preflight != "tag_absent":
                  raise SystemExit("historical Controller write attempt lacks an absent-tag preflight")
              if recovered and digest_re.fullmatch(recovered) is None:
                  raise SystemExit("quarantined Controller digest is invalid")
              receipt = common | {
                  "build_outcome": build_outcome,
                  "kind": "HistoricalControllerBuildOnlyQuarantineReceipt" if write_attempted else "HistoricalControllerBuildOnlyFailureReceipt",
                  "quarantined_top_digest": recovered or None,
                  "registry_artifact_state": inspect_state if write_attempted else write_state,
                  "status": "quarantined" if write_attempted else "failed_before_registry_write",
                  "verified_image_artifacts_digest": None,
              }
          payload = json.dumps(receipt, ensure_ascii=True, separators=(",", ":"), sort_keys=True).encode() + b"\n"
          (receipt_dir / "receipt.json").write_bytes(payload)
          PY
          chmod 0600 "${receipt_dir}"/*
          printf 'receipt_ready=true\n' >>"${GITHUB_OUTPUT}"

      - name: Upload exact historical Controller build-only receipt
        id: upload_receipt
        if: ${{ always() && steps.seal_receipt.outputs.receipt_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-historical-controller-build-only-58fc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fugue-historical-controller-build-only-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
          overwrite: false

      - name: Require exact historical Controller build-only success
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        env:
          BUILD_OUTCOME: ${{ steps.build_images.outcome }}
          RECEIPT_OUTCOME: ${{ steps.seal_receipt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_receipt.outcome }}
        run: |
          set -euo pipefail
          [[ "${BUILD_OUTCOME}" == 'success' ]]
          [[ "${RECEIPT_OUTCOME}" == 'success' ]]
          [[ "${UPLOAD_OUTCOME}" == 'success' ]]

  settle-api-hotfix-recovery-lane:
    needs:
      - recover-api-hotfix-fence
    if: ${{ always() && inputs.api_hotfix_recovery_only == 'CONFIRM_API_HOTFIX_RECOVERY_30804033592' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Settle API hotfix recovery lane
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_RESULT: ${{ needs.recover-api-hotfix-fence.result }}
        run: |
          set -euo pipefail
          workflow='deploy-control-plane.yml'
          desired='disabled_manually'
          endpoint='disable'
          if [[ "${RECOVERY_RESULT}" == success ]]; then
            desired='active'
            endpoint='enable'
          fi
          mutation_status=0
          timeout --kill-after=2s 10s gh api --method PUT \
            "repos/${REPOSITORY}/actions/workflows/${workflow}/${endpoint}" >/dev/null || mutation_status=$?
          state=''
          for attempt in 1 2 3 4 5; do
            state="$(timeout --kill-after=2s 10s gh api \
              "repos/${REPOSITORY}/actions/workflows/${workflow}" --jq '.state')" || exit 1
            [[ "${state}" == "${desired}" ]] && break
            sleep 1
          done
          [[ "${state}" == "${desired}" ]]
          printf 'API hotfix recovery lane settled desired=%s mutation_status=%s\n' "${desired}" "${mutation_status}"

  settle-controller-m16-observed-recovery-lane:
    needs:
      - recover-controller-m16-observed-state
    if: ${{ always() && inputs.controller_m16_observed_recovery_v1 == 'CONFIRM_CONTROL_PLANE_CONTROLLER_M16_OBSERVED_RECOVERY_V1_30836591717' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Settle Controller M16 observed recovery lane
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_RESULT: ${{ needs.recover-controller-m16-observed-state.result }}
        run: |
          set -euo pipefail
          workflow='deploy-control-plane.yml'
          desired='disabled_manually'
          endpoint='disable'
          if [[ "${RECOVERY_RESULT}" == success ]]; then
            desired='active'
            endpoint='enable'
          fi
          mutation_status=0
          timeout --kill-after=2s 10s gh api --method PUT \
            "repos/${REPOSITORY}/actions/workflows/${workflow}/${endpoint}" >/dev/null || mutation_status=$?
          state=''
          for attempt in 1 2 3 4 5; do
            state="$(timeout --kill-after=2s 10s gh api \
              "repos/${REPOSITORY}/actions/workflows/${workflow}" --jq '.state')" || exit 1
            [[ "${state}" == "${desired}" ]] && break
            sleep 1
          done
          [[ "${state}" == "${desired}" ]]
          printf 'Controller M16 observed recovery lane settled desired=%s mutation_status=%s\n' "${desired}" "${mutation_status}"

  release-baseline:
    if: ${{ inputs.api_hotfix_recovery_only == '' && inputs.controller_m16_observed_recovery_v1 == '' }}
    needs:
      - release-input-guard
    runs-on:
      - self-hosted
      - linux
      - x64
      - fugue
      - control-plane
    permissions:
      actions: read
      contents: read
    outputs:
      domain_base_sha: ${{ steps.domain_baseline.outputs.domain_base_sha }}
      baseline_ref_object_sha: ${{ steps.domain_baseline.outputs.baseline_ref_object_sha }}
      is_genesis: ${{ steps.domain_baseline.outputs.is_genesis }}
      genesis_parent_sha: ${{ steps.domain_baseline.outputs.genesis_parent_sha }}
      changed_files: ${{ steps.controller_m16_baseline.outputs.changed_files || steps.api_hotfix_baseline.outputs.changed_files || steps.release_changes.outputs.changed_files }}
      baseline_refs: ${{ steps.controller_m16_baseline.outputs.baseline_refs || steps.api_hotfix_baseline.outputs.baseline_refs || steps.release_changes.outputs.baseline_refs }}
      source: ${{ steps.controller_m16_baseline.outputs.source || steps.api_hotfix_baseline.outputs.source || steps.release_changes.outputs.source }}
      target_ref: ${{ steps.controller_m16_baseline.outputs.target_ref || steps.api_hotfix_baseline.outputs.target_ref || steps.release_changes.outputs.target_ref }}
      api_image_baseline_ref: ${{ steps.live_images.outputs.api_image_baseline_ref }}
      api_image_helm_drift: ${{ steps.live_images.outputs.api_image_helm_drift }}
      controller_image_baseline_ref: ${{ steps.live_images.outputs.controller_image_baseline_ref }}
      controller_image_helm_drift: ${{ steps.live_images.outputs.controller_image_helm_drift }}
      drain_agent_image_baseline_ref: ${{ steps.live_images.outputs.drain_agent_image_baseline_ref }}
      drain_agent_image_helm_drift: ${{ steps.live_images.outputs.drain_agent_image_helm_drift }}
      telemetry_agent_image_baseline_ref: ${{ steps.live_images.outputs.telemetry_agent_image_baseline_ref }}
      telemetry_agent_image_helm_drift: ${{ steps.live_images.outputs.telemetry_agent_image_helm_drift }}
      image_cache_image_baseline_ref: ${{ steps.live_images.outputs.image_cache_image_baseline_ref }}
      image_cache_image_helm_drift: ${{ steps.live_images.outputs.image_cache_image_helm_drift }}
      edge_image_baseline_ref: ${{ steps.live_images.outputs.edge_image_baseline_ref }}
      edge_image_helm_drift: ${{ steps.live_images.outputs.edge_image_helm_drift }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Download Stage1 handoff for planner base
        if: ${{ inputs.public_data_plane_adoption_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-data-plane-adoption-${{ inputs.public_data_plane_adoption_run_id }}-1
          path: ${{ runner.temp }}/public-data-plane-stage1-planner
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.public_data_plane_adoption_run_id }}

      - name: Setup Go for Stage1 handoff planner gate
        if: ${{ inputs.public_data_plane_adoption_run_id != '' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Stage1 handoff before release planning
        if: ${{ inputs.public_data_plane_adoption_run_id != '' }}
        env:
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          EXPECTED_BASELINE_DIGEST: ${{ inputs.public_data_plane_adoption_baseline_digest }}
        run: |
          set -euo pipefail
          handoff="${RUNNER_TEMP}/public-data-plane-stage1-planner"
          tool="${RUNNER_TEMP}/fugue-public-data-plane-adoption-planner"
          manifest="${RUNNER_TEMP}/public-data-plane-stage1-planner-current.yaml"
          go build -trimpath -o "${tool}" ./cmd/fugue-public-data-plane-adoption
          revision="$(helm status "${FUGUE_RELEASE_NAME}" -n "${FUGUE_NAMESPACE}" -o json | \
            python3 -c 'import json,sys; value=json.load(sys.stdin).get("version"); assert isinstance(value,int) and value>0; print(value)')"
          helm get manifest "${FUGUE_RELEASE_NAME}" -n "${FUGUE_NAMESPACE}" --revision "${revision}" | \
            "${tool}" canonicalize-secret-free --ownership ./deploy/release-domains/ownership-v1.yaml --namespace "${FUGUE_NAMESPACE}" >"${manifest}"
          BASELINE="${handoff}/stage1-baseline.json" EXPECTED="${EXPECTED_BASELINE_DIGEST}" python3 -c \
            'import json,os; assert json.load(open(os.environ["BASELINE"],encoding="utf-8"))["digest"]==os.environ["EXPECTED"]'
          "${tool}" verify-stage2 \
            --baseline "${handoff}/stage1-baseline.json" \
            --trace "${handoff}/execution-trace.json" \
            --current-revision "${revision}" --current-manifest "${manifest}"

      - name: Resolve release-domain baseline
        id: domain_baseline
        env:
          SOURCE_SHA: ${{ inputs.expected_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          readonly baseline_ref='refs/heads/fugue-control-plane-release-baseline'
          readonly target_sha="${TARGET_SHA}"

          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "${target_sha}" ]] || exit 1
          remote_main="$(timeout --kill-after=2s 20s git ls-remote --refs origin refs/heads/main | awk 'NR == 1 {print $1}')" || exit 1
          [[ "${remote_main}" == "${SOURCE_SHA}" ]] || exit 1
          timeout --kill-after=5s 60s git fetch --no-tags origin "${SOURCE_SHA}" || exit 1
          [[ "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" == "${SOURCE_SHA}" ]] || exit 1
          git merge-base --is-ancestor "${target_sha}" "${SOURCE_SHA}" || exit 1
          remote_branch=''
          set +e
          remote_branch="$(timeout --kill-after=2s 20s git ls-remote --refs --exit-code origin "${baseline_ref}")"
          remote_status=$?
          set -e
          [[ "${remote_status}" == '0' ]] || exit 1
          [[ "$(printf '%s\n' "${remote_branch}" | sed '/^$/d' | wc -l | tr -d ' ')" == '1' ]] || exit 1
          read -r remote_object remote_ref extra <<<"${remote_branch}" || exit 1
          [[ -z "${extra:-}" ]] || exit 1
          [[ "${remote_object}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${remote_ref}" == "${baseline_ref}" ]] || exit 1
          timeout --kill-after=5s 60s git fetch --no-tags origin "${baseline_ref}" || exit 1
          fetched_ref_object_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')" || exit 1
          [[ "${fetched_ref_object_sha}" == "${remote_object}" ]] || exit 1
          commit_identity="$(git rev-list --parents -n 1 FETCH_HEAD)" || exit 1
          read -r observed_commit parent_shas <<<"${commit_identity}" || exit 1
          [[ "${observed_commit}" == "${remote_object}" ]] || exit 1

          domain_base_sha="${remote_object}"
          metadata_tree_entry="$(git ls-tree --full-tree FETCH_HEAD)" || exit 1
          metadata_entry_count="$(printf '%s\n' "${metadata_tree_entry}" | sed '/^$/d' | wc -l | tr -d ' ')"
          metadata_candidate='false'
          if [[ "${metadata_entry_count}" == '1' ]]; then
            read -r metadata_mode metadata_type metadata_blob metadata_path extra <<<"${metadata_tree_entry}" || exit 1
            if [[ "${metadata_path}" == 'fugue-runtime-baseline.json' && -z "${extra:-}" ]]; then
              metadata_candidate='true'
            fi
          fi
          if [[ "${metadata_candidate}" == 'true' ]]; then
            [[ "${metadata_mode}" == '100644' && "${metadata_type}" == 'blob' ]] || exit 1
            [[ "${metadata_blob}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            metadata_fields="$(
              git cat-file blob "${metadata_blob}" |
                python3 -c '
          import json, re, sys

          payload = sys.stdin.buffer.read()
          try:
              value = json.loads(payload)
          except (UnicodeDecodeError, json.JSONDecodeError):
              raise SystemExit("baseline metadata is not exact JSON")
          runtime_sha = value.get("runtime_sha") if type(value) is dict else None
          if type(runtime_sha) is not str or re.fullmatch(r"[0-9a-f]{40}", runtime_sha) is None:
              raise SystemExit("baseline metadata runtime SHA is invalid")
          previous_sha = value.get("previous_baseline_object_sha")
          if previous_sha is not None and (
              type(previous_sha) is not str or re.fullmatch(r"[0-9a-f]{40}", previous_sha) is None
          ):
              raise SystemExit("baseline metadata previous object SHA is invalid")
          expected = json.dumps(
              {"previous_baseline_object_sha": previous_sha, "runtime_sha": runtime_sha, "schema_version": 1},
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8") + b"\n"
          if payload != expected:
              raise SystemExit("baseline metadata bytes are not canonical")
          sys.stdout.write(runtime_sha + "\t" + ("null" if previous_sha is None else previous_sha))
          '
            )" || exit 1
            IFS=$'\t' read -r domain_base_sha previous_baseline_object_sha extra <<<"${metadata_fields}" || exit 1
            [[ -z "${extra:-}" ]] || exit 1
            if [[ "${previous_baseline_object_sha}" == 'null' ]]; then
              [[ -z "${parent_shas:-}" ]] || exit 1
            else
              read -r metadata_parent extra_parent <<<"${parent_shas:-}" || exit 1
              [[ "${metadata_parent}" == "${previous_baseline_object_sha}" ]] || exit 1
              [[ -z "${extra_parent:-}" ]] || exit 1
            fi
            [[ "${domain_base_sha}" != "${fetched_ref_object_sha}" ]] || exit 1
          else
            [[ -n "${parent_shas:-}" ]] || exit 1
          fi
          git cat-file -e "${domain_base_sha}^{commit}" || exit 1
          [[ "${domain_base_sha}" != "${target_sha}" ]] || exit 1
          git merge-base --is-ancestor "${domain_base_sha}" "${target_sha}" || exit 1

          {
            printf 'domain_base_sha=%s\n' "${domain_base_sha}"
            printf 'baseline_ref_object_sha=%s\n' "${remote_object}"
            printf 'is_genesis=false\n'
            printf 'genesis_parent_sha=\n'
          } >>"${GITHUB_OUTPUT}" || exit 1

      - name: Resolve live image metadata
        id: live_images
        if: ${{ inputs.api_hotfix_rollout_v2 == '' && inputs.controller_m16_rollout_v1 == '' }}
        env:
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          FUGUE_RELEASE_FULLNAME: ${{ vars.FUGUE_RELEASE_FULLNAME || 'fugue-fugue' }}
          GITHUB_SHA: ${{ inputs.target_sha }}
          FUGUE_IMAGE_TAG: ${{ inputs.target_sha }}
          FUGUE_RESOLVE_HELM_IMAGE_BASELINES: "true"
        run: ./scripts/resolve_control_plane_live_images.sh

