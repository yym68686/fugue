          for config in deploy/environments/production/front-observation/*.json; do
            python3 scripts/observe_front_candidate.py "$config" --evidence "$RUNNER_TEMP/front-observations/$(basename "$config")"
          done
      - name: Retain independent Front observations
        if: steps.observation.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-observations/*.json
          if-no-files-found: error
          retention-days: 30

  front_probe_transport:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-front-probe-transport, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select current isolated Front probe transport
        id: transport
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/front-transport-transition/intent.json
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config"; then
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/select_front_transport_transition.py deploy/environments/production/front-probe-transport deploy/environments/production/front-serving-stage deploy/environments/production/front-serving-handoff scripts/reconcile_front_probe_transport.py scripts/front_connection_witness.py scripts/read_front_conntrack.py scripts/observe_front_node_conntrack.py deploy/environments/production/front-connection-observation scripts/observe_front_candidate.py deploy/environments/production/front-observation; then
              python3 -m unittest scripts.test_observe_front_candidate scripts.test_reconcile_front_probe_transport scripts.test_front_connection_witness scripts.test_read_front_conntrack scripts.test_observe_front_node_conntrack
              previous="$RUNNER_TEMP/front-probe-transition-before.json"
              if ! git show "$base:$config" > "$previous"; then
                printf 'null\n' > "$previous"
              fi
              python3 -m unittest scripts.test_select_front_transport_transition
              target="$(python3 scripts/select_front_transport_transition.py "$config" --phase probe --previous "$previous")"
              if [[ -n "$target" ]]; then
                echo "target=$target" >> "$GITHUB_OUTPUT"
                echo 'selected=true' >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
      - name: Prepare observed Front probe transport
        if: steps.transport.outputs.selected == 'true'
        run: python3 scripts/reconcile_front_probe_transport.py prepare deploy/environments/production/front-probe-transport/listeners.json --listener "${{ steps.transport.outputs.target }}" --evidence "$RUNNER_TEMP/front-probe-transport.json"
      - name: Retain Front probe witness before network changes
        if: steps.transport.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-probe-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-probe-transport.json
          if-no-files-found: error
          retention-days: 30
      - name: Apply and verify isolated Front probe listener
        if: steps.transport.outputs.selected == 'true'
        run: python3 scripts/reconcile_front_probe_transport.py apply deploy/environments/production/front-probe-transport/listeners.json --listener "${{ steps.transport.outputs.target }}" --evidence "$RUNNER_TEMP/front-probe-transport.json"
      - name: Attribute held connections to the original and candidate Front
        if: steps.transport.outputs.selected == 'true'
        run: |
          python3 -m unittest scripts.test_front_connection_witness scripts.test_read_front_conntrack scripts.test_observe_front_node_conntrack
          python3 scripts/front_connection_witness.py deploy/environments/production/front-probe-transport/listeners.json --listener "${{ steps.transport.outputs.target }}" --evidence "$RUNNER_TEMP/front-held-connections.json"
      - name: Retain held Front connection evidence
        if: steps.transport.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-held-connections-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-held-connections.json
          if-no-files-found: error
          retention-days: 30

  front_external_observation:
    needs: [front_probe_transport]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.front_probe_transport.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Verify Front ingress from outside the production cluster
        run: |
          python3 -m unittest scripts.test_observe_front_public_probe
          python3 scripts/observe_front_public_probe.py deploy/environments/production/front-probe-transport/listeners.json --evidence "$RUNNER_TEMP/front-external-observation.json"
      - name: Retain external Front observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-external-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-external-observation.json
          if-no-files-found: error
          retention-days: 30

  front_restricted_egress_observation:
    needs: [front_probe_transport, front_external_observation]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.front_probe_transport.result == 'success' && needs.front_external_observation.result == 'success' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-front-restricted-egress-observation, cancel-in-progress: false}
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}'}
      - name: Verify public Fronts from actual restricted application networks
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_observe_front_restricted_egress
          mkdir -p "$RUNNER_TEMP/front-restricted-egress"
          while IFS= read -r listener; do
            python3 scripts/observe_front_restricted_egress.py deploy/environments/production/front-egress-observation/consumers.json --listener "$listener" --evidence "$RUNNER_TEMP/front-restricted-egress/$listener.json"
          done < <(python3 -c 'import json; print("\n".join(x["name"] for x in json.load(open("deploy/environments/production/front-probe-transport/listeners.json"))["listeners"]))')
      - name: Retain tenant-network acceptance before any public handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-restricted-egress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-restricted-egress/*.json
          if-no-files-found: error
          retention-days: 30

  front_serving_stage:
    needs: [front_probe_transport]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.front_probe_transport.result == 'success' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-front-serving-stage, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select current internal Front transport stage
        id: transport
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/front-transport-transition/intent.json
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config"; then
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/select_front_transport_transition.py deploy/environments/production/front-probe-transport deploy/environments/production/front-serving-stage deploy/environments/production/front-serving-handoff scripts/stage_front_serving_transport.py scripts/reconcile_front_probe_transport.py scripts/front_connection_witness.py scripts/read_front_conntrack.py scripts/observe_front_node_conntrack.py deploy/environments/production/front-connection-observation scripts/observe_front_candidate.py deploy/environments/production/front-observation; then
              python3 -m unittest scripts.test_observe_front_candidate scripts.test_stage_front_serving_transport
              previous="$RUNNER_TEMP/front-stage-transition-before.json"
              if ! git show "$base:$config" > "$previous"; then
                printf 'null\n' > "$previous"
              fi
              python3 -m unittest scripts.test_select_front_transport_transition
              target="$(python3 scripts/select_front_transport_transition.py "$config" --phase stage --previous "$previous")"
              if [[ -n "$target" ]]; then
                echo "target=$target" >> "$GITHUB_OUTPUT"
                echo 'selected=true' >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
      - name: Prepare observed internal Front transport
        if: steps.transport.outputs.selected == 'true'
        run: python3 scripts/stage_front_serving_transport.py prepare deploy/environments/production/front-serving-stage/services.json --service "${{ steps.transport.outputs.target }}" --evidence "$RUNNER_TEMP/front-serving-stage.json"
      - name: Retain Front stage witness before internal Service creation
        if: steps.transport.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-serving-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-serving-stage.json
          if-no-files-found: error
          retention-days: 30
      - name: Create and verify internal Front Service endpoints
        if: steps.transport.outputs.selected == 'true'
        run: python3 scripts/stage_front_serving_transport.py apply deploy/environments/production/front-serving-stage/services.json --service "${{ steps.transport.outputs.target }}" --evidence "$RUNNER_TEMP/front-serving-stage.json"

  front_serving_handoff:
    outputs:
      selected: ${{ steps.handoff.outputs.selected }}
      target: ${{ steps.handoff.outputs.target }}
      recoverable: ${{ steps.handoff_witness.outcome == 'success' }}
    needs: [front_probe_transport, front_external_observation, front_serving_stage, front_restricted_egress_observation]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.front_probe_transport.result == 'success' && needs.front_external_observation.result == 'success' && needs.front_serving_stage.result == 'success' && needs.front_restricted_egress_observation.result == 'success' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-front-serving-handoff, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select current explicit Front public handoff
        id: handoff
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/front-transport-transition/intent.json
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config"; then
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/select_front_transport_transition.py deploy/environments/production/front-probe-transport deploy/environments/production/front-serving-stage deploy/environments/production/front-serving-handoff scripts/handoff_front_serving_transport.py scripts/observe_front_restricted_egress.py deploy/environments/production/front-egress-observation scripts/front_connection_witness.py scripts/read_front_conntrack.py scripts/observe_front_node_conntrack.py deploy/environments/production/front-connection-observation scripts/stage_front_serving_transport.py scripts/reconcile_front_probe_transport.py deploy/environments/production/front-probe-transport deploy/environments/production/front-serving-stage scripts/observe_front_candidate.py deploy/environments/production/front-observation; then
              python3 -m unittest scripts.test_handoff_front_serving_transport scripts.test_front_connection_witness scripts.test_read_front_conntrack scripts.test_observe_front_node_conntrack
              previous="$RUNNER_TEMP/front-handoff-transition-before.json"
              if ! git show "$base:$config" > "$previous"; then
                printf 'null\n' > "$previous"
              fi
              python3 -m unittest scripts.test_select_front_transport_transition
              target="$(python3 scripts/select_front_transport_transition.py "$config" --phase handoff --previous "$previous")"
              if [[ -n "$target" ]]; then
                echo "target=$target" >> "$GITHUB_OUTPUT"
                echo 'selected=true' >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
      - name: Read this run's independent external ingress witness
        if: steps.handoff.outputs.selected == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fugue-front-external-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-handoff-external
      - name: Prepare exact public Front handoff and compensation
        if: steps.handoff.outputs.selected == 'true'
        run: python3 scripts/handoff_front_serving_transport.py prepare "${{ steps.handoff.outputs.target }}" --external-evidence "$RUNNER_TEMP/front-handoff-external/front-external-observation.json" --evidence "$RUNNER_TEMP/front-public-handoff.json"
      - name: Retain Front handoff witness before public address CAS
        id: handoff_witness
        if: steps.handoff.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-public-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-public-handoff.json
          if-no-files-found: error
          retention-days: 30
      - name: Handoff public address while preserving the existing Front connection
        if: steps.handoff.outputs.selected == 'true'
        run: python3 scripts/handoff_front_serving_transport.py apply "${{ steps.handoff.outputs.target }}" --external-evidence "$RUNNER_TEMP/front-handoff-external/front-external-observation.json" --evidence "$RUNNER_TEMP/front-public-handoff.json" --result "$RUNNER_TEMP/front-public-handoff-result.json"
      - name: Retain verified public Front connection continuity
        if: steps.handoff.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-public-handoff-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-public-handoff-result.json
          if-no-files-found: error
          retention-days: 30

  front_public_verification:
    needs: [front_serving_handoff]
    if: ${{ needs.front_serving_handoff.outputs.selected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}'}
      - name: Verify public Front ingress after the handoff from outside the cluster
        run: python3 scripts/observe_front_public_probe.py deploy/environments/production/front-probe-transport/listeners.json --evidence "$RUNNER_TEMP/front-public-external.json"
      - name: Retain independent public Front acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-public-external-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-public-external.json
          if-no-files-found: error
          retention-days: 30

  front_public_recovery:
    needs: [front_serving_handoff, front_public_verification]
    if: ${{ always() && needs.front_serving_handoff.outputs.recoverable == 'true' && needs.front_public_verification.result != 'success' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-front-serving-handoff, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fugue-front-public-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-handoff-recovery
      - name: Restore the exact previous ingress after failed independent public acceptance
        run: python3 scripts/handoff_front_serving_transport.py recover "${{ needs.front_serving_handoff.outputs.target }}" --evidence "$RUNNER_TEMP/front-handoff-recovery/front-public-handoff.json"

  front_drain_observation:
    needs: [front_external_observation, front_public_verification]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.front_external_observation.result == 'success' && (needs.front_public_verification.result == 'success' || needs.front_public_verification.result == 'skipped') }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-front-drain-observation, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select current read-only Front drain observation
        id: observation
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- scripts/observe_front_drain.py scripts/test_observe_front_drain.py scripts/stage_front_serving_transport.py scripts/observe_front_public_probe.py deploy/environments/production/front-serving-handoff; then
            git fetch origin main
            if git diff --quiet HEAD origin/main -- scripts/observe_front_drain.py scripts/stage_front_serving_transport.py scripts/handoff_front_serving_transport.py scripts/front_connection_witness.py scripts/observe_front_node_conntrack.py deploy/environments/production/front-serving-handoff deploy/environments/production/front-observation; then
              python3 -m unittest scripts.test_observe_front_drain
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Observe exact public Front selection and retained connections
        if: steps.observation.outputs.selected == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/front-drain-observations"
          for config in deploy/environments/production/front-serving-handoff/*.json; do
            python3 scripts/observe_front_drain.py "$config" --evidence "$RUNNER_TEMP/front-drain-observations/$(basename "$config")"
          done
      - name: Retain Front drain observation without deleting any executor
        if: steps.observation.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-front-drain-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-drain-observations/*.json
          if-no-files-found: error
          retention-days: 30

  dns_transport:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-dns-transport, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Validate and reconcile DNS network transport
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/dns-transport/transport.json
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config" scripts/reconcile_dns_transport.py scripts/test_reconcile_dns_transport.py; then
            git fetch origin main
            if ! git diff --quiet HEAD origin/main -- "$config" scripts/reconcile_dns_transport.py; then
              echo "Newer DNS transport configuration supersedes this run."
              exit 0
            fi
            python3 -m unittest scripts.test_reconcile_dns_transport
            python3 scripts/reconcile_dns_transport.py "$config"
            python3 scripts/reconcile_dns_transport.py "$config" --apply
          fi

  postgres_protection:
    # Database recovery must remain possible when an application build fails.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-postgres-protection, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect database protection configuration changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          base="${BASE_SHA}"
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ || "${base}" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed=false
          if ! git diff --quiet "${base}" HEAD -- deploy/environments/production/control-plane-postgres scripts/reconcile_postgres_protection.py; then
            changed=true
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
      - name: Validate and reconcile durable database protection
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s scripts -p test_reconcile_postgres_protection.py
          python3 scripts/reconcile_postgres_protection.py deploy/environments/production/control-plane-postgres/protection.json
          python3 scripts/reconcile_postgres_protection.py deploy/environments/production/control-plane-postgres/protection.json --apply

      - name: Reconcile read-only storage capacity and attachment observation access
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ || "${base}" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          config=deploy/environments/production/postgres-capacity-observation/rbac.json
          if ! git diff --quiet "${base}" HEAD -- "${config}"; then
            kubectl apply --server-side --dry-run=server --field-manager=fugue-postgres-capacity-observation -f "${config}"
            kubectl apply --server-side --field-manager=fugue-postgres-capacity-observation -f "${config}"
            for resource in csistoragecapacities csidrivers csinodes volumeattachments; do
              kubectl auth can-i list "${resource}.storage.k8s.io" --all-namespaces --as=system:serviceaccount:fugue-system:fugue-fugue-control-plane-sa
            done
          fi

  drain_observation_access:
    # Observation access can be repaired without rebuilding or restarting code.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-drain-observation-access, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Reconcile drain observation proxy access
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/drain-observation/rbac.json
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config"; then
            git fetch origin main
            if ! git diff --quiet HEAD origin/main -- "$config"; then
              echo "A newer observation access policy supersedes this run."
              exit 0
            fi
            kubectl apply --server-side --dry-run=server --field-manager=fugue-drain-observation-access -f "$config"
            kubectl apply --server-side --field-manager=fugue-drain-observation-access -f "$config"
            kubectl auth can-i get pods --subresource=proxy --all-namespaces --as=system:serviceaccount:fugue-system:fugue-fugue-control-plane-sa
          fi

  observability_configuration:
    # Configuration recovery is independent of component builds and releases.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-observability-configuration, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect observability configuration change
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          changed=false
          if ! git diff --quiet "$BASE_SHA" HEAD -- deploy/environments/production/observability scripts/reconcile_prometheus_scrape_policy.py; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Validate and reload the explicit scrape policy
        if: steps.changed.outputs.changed == 'true'
        run: |
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- deploy/environments/production/observability scripts/reconcile_prometheus_scrape_policy.py; then
            echo "A newer observability configuration supersedes this run."
            exit 0
          fi
          python3 -m unittest scripts.test_reconcile_prometheus_scrape_policy
          python3 scripts/reconcile_prometheus_scrape_policy.py deploy/environments/production/observability/scrape-policy.json --apply

  workload_memory_policy:
    # Admission configuration remains recoverable if a component build fails.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-workload-memory-policy, cancel-in-progress: false}
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect memory policy configuration changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          changed=true
          if [[ "$EVENT_NAME" == "push" ]] && git diff --quiet "$BASE_SHA" HEAD -- deploy/environments/production/workload-memory scripts/reconcile_workload_memory.py scripts/test_reconcile_workload_memory.py; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Validate memory admission policy
        if: steps.changed.outputs.changed == 'true'
        run: python3 -m unittest scripts.test_reconcile_workload_memory
      - name: Reconcile independent memory requests without container restarts
        if: steps.changed.outputs.changed == 'true'
        run: |
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- deploy/environments/production/workload-memory scripts/reconcile_workload_memory.py; then
            echo "A newer memory policy supersedes this configuration run."
            exit 0
          fi
          python3 scripts/reconcile_workload_memory.py deploy/environments/production/workload-memory/policy.json
          python3 scripts/reconcile_workload_memory.py deploy/environments/production/workload-memory/policy.json --apply

  component-build:
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && needs.prepush.outputs.release_count != '0' }}
    concurrency:
      # GitHub keeps only one pending run per concurrency group. Include the
      # component so shared GHCR repositories cannot cancel each other's
      # immutable receipt producers.
      group: fugue-build-${{ matrix.build_lane }}-${{ matrix.component }}-${{ github.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepush.outputs.release_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fugue-production-release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/fugue-release-plan
      - name: Build and verify exactly one immutable component image
        env:
          COMPONENT: ${{ matrix.component }}
          FUGUE_REGISTRY_USERNAME: ${{ github.actor }}
          FUGUE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ runner.temp }}/fugue-release-plan/fugue-production-release-plan.json
          RECEIPT: ${{ runner.temp }}/fugue-${{ matrix.component }}-artifact-receipt.json
          RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
        run: |
          set -euo pipefail
          go build -trimpath -o "${RELEASE_TOOL}" ./cmd/fugue-declarative-release
          "${RELEASE_TOOL}" build "${PLAN}" "${COMPONENT}" "${RECEIPT}"
      - name: Upload the canonical component artifact receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-${{ matrix.component }}-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/fugue-${{ matrix.component }}-artifact-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  external_controller_release:
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-external-controller, cancel-in-progress: false}
    timeout-minutes: 15
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select the current declared external controller release
        id: selected
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/cnpg-controller/release.json
          git fetch origin main
          changed=false
          if ! git diff --quiet "$BASE_SHA" HEAD -- "$config" scripts/release_external_controller.py scripts/test_release_external_controller.py; then
            if git diff --quiet HEAD origin/main -- "$config" scripts/release_external_controller.py scripts/test_release_external_controller.py; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          python3 -c 'import json; print("apply=" + str(json.load(open("deploy/environments/production/cnpg-controller/release.json"))["apply"]).lower())' >> "$GITHUB_OUTPUT"
      - name: Prepare the exact controller and operand witness
        if: steps.selected.outputs.changed == 'true'
        env:
          FUGUE_REGISTRY_USERNAME: ${{ github.actor }}
          FUGUE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_release_external_controller
          python3 scripts/release_external_controller.py deploy/environments/production/cnpg-controller/release.json > "$RUNNER_TEMP/external-controller-prepared.json"
      - name: Persist the controller recovery witness before mutation
        if: steps.selected.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-external-controller-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/external-controller-prepared.json
          if-no-files-found: error
          retention-days: 30
      - name: Execute the fenced controller release
        if: steps.selected.outputs.changed == 'true' && steps.selected.outputs.apply == 'true'
        env:
          FUGUE_REGISTRY_USERNAME: ${{ github.actor }}
          FUGUE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code HEAD origin/main -- deploy/environments/production/cnpg-controller/release.json scripts/release_external_controller.py
          python3 scripts/release_external_controller.py deploy/environments/production/cnpg-controller/release.json --prepared "$RUNNER_TEMP/external-controller-prepared.json" > "$RUNNER_TEMP/external-controller-result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.selected.outputs.changed == 'true' && steps.selected.outputs.apply == 'true'
        with:
          name: fugue-external-controller-result-${{ github.sha }}
          path: ${{ runner.temp }}/external-controller-result.json
          if-no-files-found: warn
          retention-days: 30

  cnpg_candidate_artifact:
    # Build and verify only; enrolling the live operator is a separate reviewed intent.
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect pinned operator candidate changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed=false
          if ! git diff --quiet "$base" HEAD -- Dockerfile.cnpg-candidate third_party/cloudnative-pg scripts/verify_cnpg_candidate.py; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        if: steps.changed.outputs.changed == 'true'
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        if: steps.changed.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify the controller-only candidate
        if: steps.changed.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/fugue-cnpg-controller
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --file Dockerfile.cnpg-candidate \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE_REPOSITORY:$SOURCE_SHA" --metadata-file "$RUNNER_TEMP/cnpg-build.json" --push .
          digest="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/cnpg-build.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/verify_cnpg_candidate.py "$IMAGE_REPOSITORY@$digest" "$SOURCE_SHA" > "$RUNNER_TEMP/cnpg-verification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.changed.outputs.changed == 'true'
        with:
          name: fugue-cnpg-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cnpg-build.json
            ${{ runner.temp }}/cnpg-verification.json
          if-no-files-found: error
          retention-days: 30

  drain_observer_artifact:
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect drain observer source changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed=false
          if ! git diff --quiet "$base" HEAD -- Dockerfile.drain-agent cmd/fugue-drain-agent internal/drainprotocol scripts/smoke_drain_agent.py go.mod go.sum; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        if: steps.changed.outputs.changed == 'true'
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        if: steps.changed.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify the immutable drain observer
        if: steps.changed.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/fugue-drain-agent
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --file Dockerfile.drain-agent \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE_REPOSITORY:$SOURCE_SHA" --metadata-file "$RUNNER_TEMP/drain-build.json" --push .
          digest="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/drain-build.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/smoke_drain_agent.py "$IMAGE_REPOSITORY@$digest" "$SOURCE_SHA" > "$RUNNER_TEMP/drain-smoke.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.changed.outputs.changed == 'true'
        with:
          name: fugue-drain-observer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/drain-build.json
            ${{ runner.temp }}/drain-smoke.json
          if-no-files-found: error
          retention-days: 30

  diagnostic_packages:
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, packages: write}
    outputs:
      runner_image: ${{ steps.build.outputs.runner_image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect independent probe package changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed=false
          if ! git diff --quiet "$base" HEAD -- deploy/environments/production/diagnostics/package.json Dockerfile.diagnostics cmd/fugue-diagnostic-probe cmd/fugue-api/diagnostic_agent internal/diagnosticprobe internal/livediagnostics internal/runtimeobservation internal/observability internal/model go.mod go.sum .github/workflows/ci.yml; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        if: steps.changed.outputs.changed == 'true'
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        if: steps.changed.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the independent diagnostic runtime
        id: build
        if: steps.changed.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          repository="$(python3 -c 'import json; print(json.load(open("deploy/environments/production/diagnostics/catalog.json"))["repository"])')"
          docker buildx build --platform linux/amd64 --file Dockerfile.diagnostics \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "org.opencontainers.image.title=fugue-diagnostics" \
            --tag "$repository:diagnostic-git-$SOURCE_SHA" --metadata-file "$RUNNER_TEMP/diagnostic-build.json" --push .
          digest="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/diagnostic-build.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/smoke_diagnostic_package.py "$repository@$digest"
          echo "runner_image=$repository@$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.changed.outputs.changed == 'true'
        with:
          name: fugue-diagnostic-package-${{ github.sha }}
          path: ${{ runner.temp }}/diagnostic-build.json
          if-no-files-found: error
          retention-days: 30

  diagnostics_configuration:
    # Configuration recovery can reuse the last verified runner even when a
    # component or probe code build fails. No API/controller rollout is needed.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-diagnostics-configuration, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect diagnostic configuration or artifact updates
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed=false
          if ! git diff --quiet "$base" HEAD -- deploy/environments/production/diagnostics/catalog.json scripts/publish_diagnostic_catalog.py scripts/test_publish_diagnostic_catalog.py; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Verify and publish the signed diagnostic catalog
        if: steps.changed.outputs.changed == 'true'
        env:
          RUNNER_IMAGE: ""
        run: |
          python3 -m unittest scripts.test_publish_diagnostic_catalog
          python3 scripts/publish_diagnostic_catalog.py deploy/environments/production/diagnostics/catalog.json --runner-image "$RUNNER_IMAGE"
          python3 scripts/publish_diagnostic_catalog.py deploy/environments/production/diagnostics/catalog.json --runner-image "$RUNNER_IMAGE" --apply

  diagnostics_package_activation:
    needs: diagnostic_packages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.diagnostic_packages.outputs.runner_image != '' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-diagnostics-configuration, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Activate the verified independent diagnostic package
        env:
          RUNNER_IMAGE: ${{ needs.diagnostic_packages.outputs.runner_image }}
        run: |
          python3 -m unittest scripts.test_publish_diagnostic_catalog
          python3 scripts/publish_diagnostic_catalog.py deploy/environments/production/diagnostics/catalog.json --runner-image "$RUNNER_IMAGE"
          python3 scripts/publish_diagnostic_catalog.py deploy/environments/production/diagnostics/catalog.json --runner-image "$RUNNER_IMAGE" --apply

  traffic_safety_stage0:
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && needs.prepush.outputs.traffic_safety_changed == 'true' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    timeout-minutes: 30
    concurrency: {group: fugue-production-traffic-safety-stage0, cancel-in-progress: false}
    permissions: {actions: write, contents: read}
    steps:
      - name: Checkout exact safety configuration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Setup Go for the public DNS verifier
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Materialize the environment-owned traffic safety configuration
        env:
          FUGUE_TRAFFIC_SAFETY_STAGE0_CONFIG_JSON: ${{ secrets.FUGUE_TRAFFIC_SAFETY_STAGE0_CONFIG_JSON }}
        run: |
          test -n "${FUGUE_TRAFFIC_SAFETY_STAGE0_CONFIG_JSON}"
          printf '%s\n' "${FUGUE_TRAFFIC_SAFETY_STAGE0_CONFIG_JSON}" >"${RUNNER_TEMP}/fugue-traffic-safety-stage0.json"
          scripts/apply_fugue_traffic_safety.sh --check "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json"
      - name: Export current traffic and authority state before mutation
        env:
          EXPORT_DIR: ${{ runner.temp }}/fugue-traffic-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/export_fugue_traffic_state.sh "${EXPORT_DIR}"
      - name: Upload immutable pre-mutation state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-traffic-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fugue-traffic-state-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
      - name: Apply the atomic US traffic pin and DE DNS drain
        env:
          FUGUE_API_URL: https://${{ vars.FUGUE_API_PUBLIC_DOMAIN }}
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: scripts/apply_fugue_traffic_safety.sh --apply "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json"
      - name: Verify the real public DNS path once after apply
        env:
          FUGUE_API_URL: https://${{ vars.FUGUE_API_PUBLIC_DOMAIN }}
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/fugue" ./cmd/fugue
          go build -trimpath -o "${RUNNER_TEMP}/fugue-public-dns-query" ./scripts/public_dns_query.go
          required_ips="$(jq -r '.publicDNSGate.requiredAnswerIPs|join(",")' "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json")"
          forbidden_ips="$(jq -r '.publicDNSGate.forbiddenAnswerIPs|join(",")' "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json")"
          while IFS= read -r hostname; do
            FUGUE_BIN="${RUNNER_TEMP}/fugue" FUGUE_PUBLIC_DNS_QUERY_BIN="${RUNNER_TEMP}/fugue-public-dns-query" \
              FUGUE_PUBLIC_DNS_REQUIRED_IPS="${required_ips}" FUGUE_PUBLIC_DNS_FORBIDDEN_IPS="${forbidden_ips}" \
              scripts/probe_fugue_public_dns.sh "${hostname}"
          done < <(jq -r '.pins[].hostname' "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json")

