name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '23 18 * * *'

permissions:
  contents: read

jobs:
  static_edge_observability:
    needs: prepush
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.26.3', cache-dependency-path: 'static-caddy/go.sum'}
      - name: Verify independent serving and bounded observations
        run: make test-static-edge-observability
      - name: Build immutable standalone artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/package_static_edge_observability.sh "$RUNNER_TEMP/static-edge-observability"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: static-edge-observability-${{ github.sha }}
          path: ${{ runner.temp }}/static-edge-observability/*
          if-no-files-found: error
          retention-days: 30

  prepush:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_count: ${{ steps.release.outputs.release_count }}
      release_matrix: ${{ steps.release.outputs.release_matrix }}
      release_components: ${{ steps.release.outputs.release_components }}
      edge_client_count: ${{ steps.release.outputs.edge_client_count }}
      edge_client_matrix: ${{ steps.release.outputs.edge_client_matrix }}
      edge_control_count: ${{ steps.release.outputs.edge_control_count }}
      edge_control_matrix: ${{ steps.release.outputs.edge_control_matrix }}
      edge_worker_count: ${{ steps.release.outputs.edge_worker_count }}
      edge_worker_matrix: ${{ steps.release.outputs.edge_worker_matrix }}
      traffic_safety_changed: ${{ steps.release.outputs.traffic_safety_changed }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Setup Helm for bounded prepush
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - name: Download Go modules before the bounded test budget
        run: go mod download
      - name: Run the repository prepush contract
        env:
          PREPUSH_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          PREPUSH_RECEIPT: ${{ runner.temp }}/fugue-prepush-receipt.json
          PREPUSH_TIMEOUT_SECONDS: "240"
          PREPUSH_MAX_ELAPSED_SECONDS: "240"
        run: make prepush
      - name: Materialize the exact declarative component plan
        id: release
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          PLAN: ${{ runner.temp }}/fugue-production-release-plan.json
          CHANGED: ${{ runner.temp }}/fugue-production-changed-paths.txt
          RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ || "${base}" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --no-renames --name-only "${base}...HEAD" -- >"${CHANGED}"
          scripts/emit_traffic_safety_changed.sh "${CHANGED}" "${GITHUB_OUTPUT}" "${base}" "${GITHUB_SHA}"
          go build -trimpath -o "${RELEASE_TOOL}" ./cmd/fugue-declarative-release
          "${RELEASE_TOOL}" plan deploy/releases/components.json "${base}" "${GITHUB_SHA}" "${CHANGED}" >"${PLAN}"
          "${RELEASE_TOOL}" emit-github-output "${PLAN}" "${GITHUB_OUTPUT}"
      - name: Upload the immutable release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-production-release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/fugue-production-release-plan.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  agent_edge_activation:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-agent-edge-policy, cancel-in-progress: false}
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select current explicit Agent activation intent
        id: activation
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/agent-edge-policy/active.json
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config" scripts/activate_agent_edge_policy.py scripts/test_activate_agent_edge_policy.py cmd/fugue-agent-edge-keyring; then
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/activate_agent_edge_policy.py cmd/fugue-agent-edge-keyring .github/workflows/ci.yml; then
              python3 -m unittest scripts.test_activate_agent_edge_policy
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Setup independent evidence verifier
        if: steps.activation.outputs.selected == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version-file: go.mod, cache: false}
      - name: Build evidence verifier
        if: steps.activation.outputs.selected == 'true'
        run: |
          go test ./cmd/fugue-agent-edge-keyring
          go build -trimpath -o "$RUNNER_TEMP/fugue-agent-edge-keyring" ./cmd/fugue-agent-edge-keyring
      - name: Observe actual Agent before activation
        if: steps.activation.outputs.selected == 'true'
        env:
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: python3 scripts/activate_agent_edge_policy.py prepare deploy/environments/production/agent-edge-policy/active.json --trust deploy/environments/production/agent-edge-trust/package.json --validator "$RUNNER_TEMP/fugue-agent-edge-keyring" --evidence "$RUNNER_TEMP/agent-edge-before.json"
      - name: Retain activation evidence before publication
        if: steps.activation.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-agent-edge-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-edge-before.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish explicitly observed active policy
        if: steps.activation.outputs.selected == 'true'
        env:
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: python3 scripts/activate_agent_edge_policy.py activate deploy/environments/production/agent-edge-policy/active.json --trust deploy/environments/production/agent-edge-trust/package.json --validator "$RUNNER_TEMP/fugue-agent-edge-keyring" --evidence "$RUNNER_TEMP/agent-edge-before.json"
      - name: Observe actual selected control traffic
        if: steps.activation.outputs.selected == 'true'
        env:
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: python3 scripts/activate_agent_edge_policy.py prepare deploy/environments/production/agent-edge-policy/active.json --trust deploy/environments/production/agent-edge-trust/package.json --validator "$RUNNER_TEMP/fugue-agent-edge-keyring" --evidence "$RUNNER_TEMP/agent-edge-after.json"
      - name: Retain selected-traffic verification witness
        if: steps.activation.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-agent-edge-after-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-edge-after.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify active policy LKG from retained observations
        if: steps.activation.outputs.selected == 'true'
        env:
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: python3 scripts/activate_agent_edge_policy.py verify deploy/environments/production/agent-edge-policy/active.json --trust deploy/environments/production/agent-edge-trust/package.json --validator "$RUNNER_TEMP/fugue-agent-edge-keyring" --evidence "$RUNNER_TEMP/agent-edge-after.json"

  runtime_agent_identity:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-runtime-agent-identity, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select declared Runtime Agent identity
        id: identity
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/runtime-agent-canary/identity.json
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config" scripts/provision_runtime_agent_identity.py scripts/test_provision_runtime_agent_identity.py; then
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/provision_runtime_agent_identity.py; then
              python3 -m unittest scripts.test_provision_runtime_agent_identity
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Persist private Runtime Agent credentials without rotating existing identities
        if: steps.identity.outputs.selected == 'true'
        env:
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: python3 scripts/provision_runtime_agent_identity.py deploy/environments/production/runtime-agent-canary/identity.json

  agent_edge_shadow_policy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-agent-edge-policy, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select current observational Agent policy
        id: policy
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/agent-edge-policy/shadow.json
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config" scripts/publish_agent_edge_shadow.py scripts/test_publish_agent_edge_shadow.py; then
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/publish_agent_edge_shadow.py; then
              python3 -m unittest scripts.test_publish_agent_edge_shadow
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Publish validated observational policy without traffic activation
        if: steps.policy.outputs.selected == 'true'
        env:
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: python3 scripts/publish_agent_edge_shadow.py deploy/environments/production/agent-edge-policy/shadow.json

  cell_trust_plan:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Admit only changed declarations to the production Cell trust queue
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- deploy/environments/production/cell-trust; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          fi

  cell_trust:
    needs: cell_trust_plan
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.cell_trust_plan.outputs.selected == 'true' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-cell-trust, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select one explicit cell trust declaration and exact predecessor
        id: trust
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t declarations < <(git diff --name-only "$base" HEAD -- deploy/environments/production/cell-trust)
          if (( ${#declarations[@]} > 1 )); then
            echo 'one cell trust declaration per configuration atom is required' >&2
            exit 1
          fi
          if (( ${#declarations[@]} == 1 )); then
            config="${declarations[0]}"
            [[ "$config" =~ ^deploy/environments/production/cell-trust/cell-[a-z0-9-]+\.json$ ]]
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/reconcile_cell_trust.py scripts/reconcile_agent_edge_trust.py; then
              python3 -m unittest scripts.test_reconcile_cell_trust
              python3 - "$config" "$base" "$RUNNER_TEMP/cell-trust-previous.json" >> "$GITHUB_OUTPUT" <<'PYTHON'
          import json, subprocess, sys
          from pathlib import Path
          from scripts.reconcile_cell_trust import validate, digest, strict_json
          config = validate(json.load(open(sys.argv[1])))
          if config['schema'] == 'fugue.cell-trust/v2':
              raw = subprocess.check_output(['git', 'show', sys.argv[2] + ':' + sys.argv[1]])
              if len(raw) > 65536:
                  raise ValueError('preceding trust declaration exceeds bound')
              previous = validate(strict_json(raw))
              if digest(previous) != config['previousDigest'] or previous['generation'] != config['previousGeneration']:
                  raise ValueError('trust successor must bind the exact preceding Git declaration')
              Path(sys.argv[3]).write_bytes(raw)
              print('requires_previous=true')
          print('material_secret=' + config.get('materialSecret', 'FUGUE_EDGE_CELL_TRUST'))
          PYTHON
              echo "config=$config" >> "$GITHUB_OUTPUT"
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Reconcile digest-bound cell keyrings without changing traffic
        if: steps.trust.outputs.selected == 'true'
        env:
          FUGUE_EDGE_CELL_TRUST: ${{ secrets[steps.trust.outputs.material_secret] }}
        run: |
          set -euo pipefail
          args=("${{ steps.trust.outputs.config }}")
          if [[ "${{ steps.trust.outputs.requires_previous }}" == true ]]; then
            args+=(--previous "$RUNNER_TEMP/cell-trust-previous.json")
          fi
          python3 scripts/reconcile_cell_trust.py "${args[@]}"
          python3 scripts/reconcile_cell_trust.py "${args[@]}" --check

  producer_publication_renewal:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-cell-producer-shadow, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select exact unchanged producer renewal declaration
        id: renewal
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config=deploy/environments/production/producer-renewal/renewal.json
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$base" HEAD -- "$config"; then
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/renew_producer_publication.py; then
              python3 -m unittest scripts.test_renew_producer_publication
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Renew unchanged policies against verified recovery baselines
        if: steps.renewal.outputs.selected == 'true'
        env:
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: python3 -m scripts.renew_producer_publication deploy/environments/production/producer-renewal/renewal.json --evidence "$RUNNER_TEMP/producer-renewal.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.renewal.outputs.selected == 'true'
        with:
          name: fugue-producer-renewal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/producer-renewal.json
          if-no-files-found: warn
          retention-days: 30

  cell_producer_plan:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    outputs:
      shadow: ${{ steps.plan.outputs.shadow }}
      reconfiguration: ${{ steps.plan.outputs.reconfiguration }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Admit one changed declaration before entering the shared producer queue
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t declarations < <(git diff --name-only "$base" HEAD -- deploy/environments/production/cell-producers deploy/environments/production/cell-producer-reconfiguration deploy/environments/production/cell-membership-expansion)
          if (( ${#declarations[@]} > 1 )); then
            echo 'one Cell producer declaration per configuration atom is required' >&2
            exit 1
          fi
          if (( ${#declarations[@]} == 1 )); then
            case "${declarations[0]}" in
              deploy/environments/production/cell-producers/*) echo 'shadow=true' >> "$GITHUB_OUTPUT" ;;
              *) echo 'reconfiguration=true' >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  cell_producer_shadow:
    needs: cell_producer_plan
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.cell_producer_plan.outputs.shadow == 'true' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-cell-producer-shadow, cancel-in-progress: false}
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select one explicit cell producer declaration
        id: producer
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t declarations < <(git diff --name-only "$base" HEAD -- deploy/environments/production/cell-producers)
          if (( ${#declarations[@]} > 1 )); then
            echo 'one cell producer declaration per configuration atom is required' >&2
            exit 1
          fi
          if (( ${#declarations[@]} == 1 )); then
            config="${declarations[0]}"
            [[ "$config" =~ ^deploy/environments/production/cell-producers/cell-[a-z0-9-]+\.json$ ]]
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/bootstrap_cell_producer.py scripts/test_bootstrap_cell_producer.py; then
              python3 -m unittest scripts.test_bootstrap_cell_producer
              python3 -m scripts.bootstrap_cell_producer --validate-only "$config"
              echo "config=$config" >> "$GITHUB_OUTPUT"
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Publish exact cell inputs and shadow policy
        if: steps.producer.outputs.selected == 'true'
        env:
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: |
          python3 -m scripts.bootstrap_cell_producer "${{ steps.producer.outputs.config }}" --evidence "$RUNNER_TEMP/cell-producer-shadow.json"
      - name: Retain cell shadow evidence
        if: steps.producer.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fugue-cell-producer-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cell-producer-shadow.json
          if-no-files-found: error
          retention-days: 30

  cell_producer_reconfiguration:
    needs: cell_producer_plan
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.cell_producer_plan.outputs.reconfiguration == 'true' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-cell-producer-shadow, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Select one existing Cell producer reconfiguration
        id: configuration
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t declarations < <(git diff --name-only "$base" HEAD -- deploy/environments/production/cell-producer-reconfiguration deploy/environments/production/cell-membership-expansion)
          if (( ${#declarations[@]} > 1 )); then
            echo 'one existing Cell producer per configuration atom is required' >&2
            exit 1
          fi
          if (( ${#declarations[@]} == 1 )); then
            config="${declarations[0]}"
            [[ "$config" =~ ^deploy/environments/production/(cell-producer-reconfiguration|cell-membership-expansion)/cell-[a-z0-9-]+\.json$ ]]
            runner=scripts.reconfigure_cell_producer
            if [[ "$config" == deploy/environments/production/cell-membership-expansion/* ]]; then
              runner=scripts.expand_cell_membership
            fi
            git fetch origin main
            if git diff --quiet HEAD origin/main -- "$config" scripts/reconfigure_cell_producer.py scripts/test_reconfigure_cell_producer.py scripts/expand_cell_membership.py scripts/test_expand_cell_membership.py scripts/bootstrap_cell_producer.py scripts/publish_agent_edge_shadow.py; then
