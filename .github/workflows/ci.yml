name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '23 18 * * *'

permissions:
  contents: read

jobs:
  prepush:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_count: ${{ steps.release.outputs.release_count }}
      release_matrix: ${{ steps.release.outputs.release_matrix }}
      release_components: ${{ steps.release.outputs.release_components }}
      edge_client_count: ${{ steps.release.outputs.edge_client_count }}
      edge_client_matrix: ${{ steps.release.outputs.edge_client_matrix }}
      edge_control_count: ${{ steps.release.outputs.edge_control_count }}
      edge_control_matrix: ${{ steps.release.outputs.edge_control_matrix }}
      edge_worker_count: ${{ steps.release.outputs.edge_worker_count }}
      edge_worker_matrix: ${{ steps.release.outputs.edge_worker_matrix }}
      traffic_safety_changed: ${{ steps.release.outputs.traffic_safety_changed }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Setup Helm for bounded prepush
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - name: Download Go modules before the bounded test budget
        run: go mod download
      - name: Run the repository prepush contract
        env:
          PREPUSH_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          PREPUSH_RECEIPT: ${{ runner.temp }}/fugue-prepush-receipt.json
          PREPUSH_TIMEOUT_SECONDS: "240"
          PREPUSH_MAX_ELAPSED_SECONDS: "240"
        run: make prepush
      - name: Materialize the exact declarative component plan
        id: release
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          PLAN: ${{ runner.temp }}/fugue-production-release-plan.json
          CHANGED: ${{ runner.temp }}/fugue-production-changed-paths.txt
          RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ || "${base}" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --no-renames --name-only "${base}...HEAD" -- >"${CHANGED}"
          scripts/emit_traffic_safety_changed.sh "${CHANGED}" "${GITHUB_OUTPUT}" "${base}" "${GITHUB_SHA}"
          go build -trimpath -o "${RELEASE_TOOL}" ./cmd/fugue-declarative-release
          "${RELEASE_TOOL}" plan deploy/releases/components.json "${base}" "${GITHUB_SHA}" "${CHANGED}" >"${PLAN}"
          "${RELEASE_TOOL}" emit-github-output "${PLAN}" "${GITHUB_OUTPUT}"
      - name: Upload the immutable release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-production-release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/fugue-production-release-plan.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  postgres_protection:
    # Database recovery must remain possible when an application build fails.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-postgres-protection, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect database protection configuration changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          base="${BASE_SHA}"
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ || "${base}" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed=false
          if ! git diff --quiet "${base}" HEAD -- deploy/environments/production/control-plane-postgres scripts/reconcile_postgres_protection.py; then
            changed=true
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
      - name: Validate and reconcile durable database protection
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s scripts -p test_reconcile_postgres_protection.py
          python3 scripts/reconcile_postgres_protection.py deploy/environments/production/control-plane-postgres/protection.json
          python3 scripts/reconcile_postgres_protection.py deploy/environments/production/control-plane-postgres/protection.json --apply

      - name: Reconcile read-only storage capacity and attachment observation access
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ || "${base}" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          config=deploy/environments/production/postgres-capacity-observation/rbac.json
          if ! git diff --quiet "${base}" HEAD -- "${config}"; then
            kubectl apply --server-side --dry-run=server --field-manager=fugue-postgres-capacity-observation -f "${config}"
            kubectl apply --server-side --field-manager=fugue-postgres-capacity-observation -f "${config}"
            for resource in csistoragecapacities csidrivers csinodes volumeattachments; do
              kubectl auth can-i list "${resource}.storage.k8s.io" --all-namespaces --as=system:serviceaccount:fugue-system:fugue-fugue-control-plane-sa
            done
          fi

  observability_configuration:
    # Configuration recovery is independent of component builds and releases.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-observability-configuration, cancel-in-progress: false}
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect observability configuration change
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          changed=false
          if ! git diff --quiet "$BASE_SHA" HEAD -- deploy/environments/production/observability scripts/reconcile_prometheus_scrape_policy.py; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Validate and reload the explicit scrape policy
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 -m unittest scripts.test_reconcile_prometheus_scrape_policy
          python3 scripts/reconcile_prometheus_scrape_policy.py deploy/environments/production/observability/scrape-policy.json --apply

  workload_memory_policy:
    # Admission configuration remains recoverable if a component build fails.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-workload-memory-policy, cancel-in-progress: false}
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect memory policy configuration changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          changed=true
          if [[ "$EVENT_NAME" == "push" ]] && git diff --quiet "$BASE_SHA" HEAD -- deploy/environments/production/workload-memory scripts/reconcile_workload_memory.py scripts/test_reconcile_workload_memory.py; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Validate memory admission policy
        if: steps.changed.outputs.changed == 'true'
        run: python3 -m unittest scripts.test_reconcile_workload_memory
      - name: Reconcile independent memory requests without container restarts
        if: steps.changed.outputs.changed == 'true'
        run: |
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- deploy/environments/production/workload-memory scripts/reconcile_workload_memory.py; then
            echo "A newer memory policy supersedes this configuration run."
            exit 0
          fi
          python3 scripts/reconcile_workload_memory.py deploy/environments/production/workload-memory/policy.json
          python3 scripts/reconcile_workload_memory.py deploy/environments/production/workload-memory/policy.json --apply

  component-build:
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && needs.prepush.outputs.release_count != '0' }}
    concurrency:
      # GitHub keeps only one pending run per concurrency group. Include the
      # component so shared GHCR repositories cannot cancel each other's
      # immutable receipt producers.
      group: fugue-build-${{ matrix.build_lane }}-${{ matrix.component }}-${{ github.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepush.outputs.release_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fugue-production-release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/fugue-release-plan
      - name: Build and verify exactly one immutable component image
        env:
          COMPONENT: ${{ matrix.component }}
          FUGUE_REGISTRY_USERNAME: ${{ github.actor }}
          FUGUE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ runner.temp }}/fugue-release-plan/fugue-production-release-plan.json
          RECEIPT: ${{ runner.temp }}/fugue-${{ matrix.component }}-artifact-receipt.json
          RELEASE_TOOL: ${{ runner.temp }}/fugue-declarative-release
        run: |
          set -euo pipefail
          go build -trimpath -o "${RELEASE_TOOL}" ./cmd/fugue-declarative-release
          "${RELEASE_TOOL}" build "${PLAN}" "${COMPONENT}" "${RECEIPT}"
      - name: Upload the canonical component artifact receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-${{ matrix.component }}-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/fugue-${{ matrix.component }}-artifact-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  diagnostic_packages:
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, packages: write}
    outputs:
      runner_image: ${{ steps.build.outputs.runner_image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect independent probe package changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed=false
          if ! git diff --quiet "$base" HEAD -- deploy/environments/production/diagnostics/package.json Dockerfile.diagnostics cmd/fugue-diagnostic-probe cmd/fugue-api/diagnostic_agent internal/diagnosticprobe internal/livediagnostics internal/observability internal/model go.mod go.sum .github/workflows/ci.yml; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        if: steps.changed.outputs.changed == 'true'
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        if: steps.changed.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the independent diagnostic runtime
        id: build
        if: steps.changed.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          repository="$(python3 -c 'import json; print(json.load(open("deploy/environments/production/diagnostics/catalog.json"))["repository"])')"
          docker buildx build --platform linux/amd64 --file Dockerfile.diagnostics \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "org.opencontainers.image.title=fugue-diagnostics" \
            --tag "$repository:diagnostic-git-$SOURCE_SHA" --metadata-file "$RUNNER_TEMP/diagnostic-build.json" --push .
          digest="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/diagnostic-build.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/smoke_diagnostic_package.py "$repository@$digest"
          echo "runner_image=$repository@$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.changed.outputs.changed == 'true'
        with:
          name: fugue-diagnostic-package-${{ github.sha }}
          path: ${{ runner.temp }}/diagnostic-build.json
          if-no-files-found: error
          retention-days: 30

  diagnostics_configuration:
    # Configuration recovery can reuse the last verified runner even when a
    # component or probe code build fails. No API/controller rollout is needed.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-diagnostics-configuration, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Detect diagnostic configuration or artifact updates
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed=false
          if ! git diff --quiet "$base" HEAD -- deploy/environments/production/diagnostics/catalog.json scripts/publish_diagnostic_catalog.py scripts/test_publish_diagnostic_catalog.py; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Verify and publish the signed diagnostic catalog
        if: steps.changed.outputs.changed == 'true'
        env:
          RUNNER_IMAGE: ""
        run: |
          python3 -m unittest scripts.test_publish_diagnostic_catalog
          python3 scripts/publish_diagnostic_catalog.py deploy/environments/production/diagnostics/catalog.json --runner-image "$RUNNER_IMAGE"
          python3 scripts/publish_diagnostic_catalog.py deploy/environments/production/diagnostics/catalog.json --runner-image "$RUNNER_IMAGE" --apply

  diagnostics_package_activation:
    needs: diagnostic_packages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.diagnostic_packages.outputs.runner_image != '' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-diagnostics-configuration, cancel-in-progress: false}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Activate the verified independent diagnostic package
        env:
          RUNNER_IMAGE: ${{ needs.diagnostic_packages.outputs.runner_image }}
        run: |
          python3 -m unittest scripts.test_publish_diagnostic_catalog
          python3 scripts/publish_diagnostic_catalog.py deploy/environments/production/diagnostics/catalog.json --runner-image "$RUNNER_IMAGE"
          python3 scripts/publish_diagnostic_catalog.py deploy/environments/production/diagnostics/catalog.json --runner-image "$RUNNER_IMAGE" --apply

  traffic_safety_stage0:
    needs: prepush
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && needs.prepush.outputs.traffic_safety_changed == 'true' }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    timeout-minutes: 30
    concurrency: {group: fugue-production-traffic-safety-stage0, cancel-in-progress: false}
    permissions: {actions: write, contents: read}
    steps:
      - name: Checkout exact safety configuration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Setup Go for the public DNS verifier
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Materialize the environment-owned traffic safety configuration
        env:
          FUGUE_TRAFFIC_SAFETY_STAGE0_CONFIG_JSON: ${{ secrets.FUGUE_TRAFFIC_SAFETY_STAGE0_CONFIG_JSON }}
        run: |
          test -n "${FUGUE_TRAFFIC_SAFETY_STAGE0_CONFIG_JSON}"
          printf '%s\n' "${FUGUE_TRAFFIC_SAFETY_STAGE0_CONFIG_JSON}" >"${RUNNER_TEMP}/fugue-traffic-safety-stage0.json"
          scripts/apply_fugue_traffic_safety.sh --check "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json"
      - name: Export current traffic and authority state before mutation
        env:
          EXPORT_DIR: ${{ runner.temp }}/fugue-traffic-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/export_fugue_traffic_state.sh "${EXPORT_DIR}"
      - name: Upload immutable pre-mutation state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugue-traffic-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fugue-traffic-state-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
      - name: Apply the atomic US traffic pin and DE DNS drain
        env:
          FUGUE_API_URL: https://${{ vars.FUGUE_API_PUBLIC_DOMAIN }}
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: scripts/apply_fugue_traffic_safety.sh --apply "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json"
      - name: Verify the real public DNS path once after apply
        env:
          FUGUE_API_URL: https://${{ vars.FUGUE_API_PUBLIC_DOMAIN }}
          FUGUE_API_KEY: ${{ secrets.FUGUE_API_KEY }}
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/fugue" ./cmd/fugue
          go build -trimpath -o "${RUNNER_TEMP}/fugue-public-dns-query" ./scripts/public_dns_query.go
          required_ips="$(jq -r '.publicDNSGate.requiredAnswerIPs|join(",")' "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json")"
          forbidden_ips="$(jq -r '.publicDNSGate.forbiddenAnswerIPs|join(",")' "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json")"
          while IFS= read -r hostname; do
            FUGUE_BIN="${RUNNER_TEMP}/fugue" FUGUE_PUBLIC_DNS_QUERY_BIN="${RUNNER_TEMP}/fugue-public-dns-query" \
              FUGUE_PUBLIC_DNS_REQUIRED_IPS="${required_ips}" FUGUE_PUBLIC_DNS_FORBIDDEN_IPS="${forbidden_ips}" \
              scripts/probe_fugue_public_dns.sh "${hostname}"
          done < <(jq -r '.pins[].hostname' "${RUNNER_TEMP}/fugue-traffic-safety-stage0.json")

  deploy_release_guardian:
    needs: [prepush, component-build]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && contains(fromJSON(needs.prepush.outputs.release_components || '[]'), 'release-guardian') }}
    timeout-minutes: 15
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-release-guardian, cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: release-guardian, registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  deploy_schema:
    needs: [prepush, component-build]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && contains(fromJSON(needs.prepush.outputs.release_components || '[]'), 'schema') }}
    timeout-minutes: 15
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-schema, cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: schema, registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  deploy_telemetry:
    needs: [prepush, component-build]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && contains(fromJSON(needs.prepush.outputs.release_components || '[]'), 'telemetry') }}
    timeout-minutes: 15
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-telemetry, cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: telemetry, registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  deploy_api:
    needs: [prepush, component-build, deploy_schema, deploy_release_guardian]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && (needs.deploy_schema.result == 'success' || needs.deploy_schema.result == 'skipped') && (needs.deploy_release_guardian.result == 'success' || needs.deploy_release_guardian.result == 'skipped') && contains(fromJSON(needs.prepush.outputs.release_components || '[]'), 'api') }}
    timeout-minutes: 15
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-api, cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: api, registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  deploy_controller:
    needs: [prepush, component-build, deploy_schema]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && (needs.deploy_schema.result == 'success' || needs.deploy_schema.result == 'skipped') && contains(fromJSON(needs.prepush.outputs.release_components || '[]'), 'controller') }}
    timeout-minutes: 15
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-controller, cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: controller, registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  deploy_edge_control:
    needs: [prepush, component-build, deploy_api]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && (needs.deploy_api.result == 'success' || needs.deploy_api.result == 'skipped') && needs.prepush.outputs.edge_control_count != '0' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepush.outputs.edge_control_matrix) }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: '${{ matrix.concurrency }}', cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: '${{ matrix.component }}', registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  deploy_edge_worker:
    needs: [prepush, component-build, deploy_api, deploy_edge_control, deploy_release_guardian]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && (needs.deploy_api.result == 'success' || needs.deploy_api.result == 'skipped') && (needs.deploy_edge_control.result == 'success' || needs.deploy_edge_control.result == 'skipped') && (needs.deploy_release_guardian.result == 'success' || needs.deploy_release_guardian.result == 'skipped') && needs.prepush.outputs.edge_worker_count != '0' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepush.outputs.edge_worker_matrix) }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: '${{ matrix.concurrency }}', cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: '${{ matrix.component }}', registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  deploy_edge_client:
    needs: [prepush, component-build]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && needs.prepush.outputs.edge_client_count != '0' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepush.outputs.edge_client_matrix) }}
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: '${{ matrix.concurrency }}', cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: '${{ matrix.component }}', registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  deploy_image_cache:
    needs: [prepush, component-build, deploy_controller]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepush.result == 'success' && (needs.deploy_controller.result == 'success' || needs.deploy_controller.result == 'skipped') && contains(fromJSON(needs.prepush.outputs.release_components || '[]'), 'image-cache') }}
    timeout-minutes: 15
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    concurrency: {group: fugue-production-image-cache, cancel-in-progress: false}
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: ./.github/actions/deploy-declarative-component
        with: {component: image-cache, registry-token: '${{ secrets.GITHUB_TOKEN }}'}

  audit:
    if: github.event_name == 'schedule' && github.event.schedule == '23 18 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run the full asynchronous audit
        run: make test
