      - name: Verify receipt outputs are exact
        env:
          EXPECTED_REPOSITORY: ${{ needs.controller-build.outputs.image_repository }}
          EXPECTED_DIGEST: ${{ needs.controller-build.outputs.image_digest }}
          EXPECTED_RECEIPT_DIGEST: ${{ needs.controller-build.outputs.receipt_digest }}
          OBSERVED_DIGEST: ${{ steps.receipt.outputs.controller_image_digest }}
          OBSERVED_RECEIPT_DIGEST: ${{ steps.receipt.outputs.verified_image_artifacts_digest }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_REPOSITORY}" =~ ^[a-z0-9.-]+/[a-z0-9._/-]+$ ]]
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ && "${OBSERVED_DIGEST}" == "${EXPECTED_DIGEST}" ]]
          [[ "${EXPECTED_RECEIPT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${OBSERVED_RECEIPT_DIGEST}" == "${EXPECTED_RECEIPT_DIGEST}" ]]
      - name: Render digest-pinned forward and exact live LKG manifests
        id: manifests
        env:
          IMAGE_REPOSITORY: ${{ needs.controller-build.outputs.image_repository }}
          FORWARD_DIGEST: ${{ needs.controller-build.outputs.image_digest }}
          DESIRED_SOURCE_SHA: ${{ steps.intent.outputs.desired_source_sha }}
          EXPECTED_PREVIOUS_IMAGE_DIGEST: ${{ steps.intent.outputs.expected_previous_image_digest }}
          EXPECTED_PREVIOUS_SOURCE_SHA: ${{ steps.intent.outputs.expected_previous_source_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "${IMAGE_REPOSITORY}" =~ ^[a-z0-9.-]+/[a-z0-9._/-]+$ ]]
          [[ "${FORWARD_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${DESIRED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_PREVIOUS_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${EXPECTED_PREVIOUS_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${DESIRED_SOURCE_SHA}" != "${EXPECTED_PREVIOUS_SOURCE_SHA}" ]]
          root="${RUNNER_TEMP}/fugue-controller-manifests"
          install -d -m 0700 "${root}"
          kubectl get deployment fugue-fugue-controller --namespace fugue-system --output json >"${root}/live.json"
          readarray -t live_identity < <(python3 - "${root}/live.json" "${EXPECTED_PREVIOUS_SOURCE_SHA}" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          value = json.loads(Path(sys.argv[1]).read_text())
          metadata = value.get("metadata") or {}
          annotations = metadata.get("annotations") or {}
          owner = annotations.get("fugue.pro/controller-ownership")
          if owner is None:
              owner = "legacy"
              manifest_revision = sys.argv[2]
          elif owner == "helm":
              manifest_revision = sys.argv[2]
          elif owner == "declarative":
              manifest_revision = annotations.get("fugue.pro/controller-manifest-revision", "")
          else:
              raise SystemExit("controller-live-owner-invalid")
          containers = value.get("spec", {}).get("template", {}).get("spec", {}).get("containers")
          if type(containers) is not list or len(containers) != 1 or containers[0].get("name") != "controller":
              raise SystemExit("controller-live-container-invalid")
          pod_annotations = value.get("spec", {}).get("template", {}).get("metadata", {}).get("annotations") or {}
          pod_source_commit = pod_annotations.get("fugue.pro/source-commit", "")
          image = containers[0].get("image", "")
          if re.fullmatch(r"[a-z0-9.-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}", image) is None:
              raise SystemExit("controller-live-image-not-immutable")
          repository, digest = image.rsplit("@", 1)
          if re.fullmatch(r"[0-9a-f]{40}", manifest_revision) is None:
              raise SystemExit("controller-lkg-manifest-revision-invalid")
          if pod_source_commit and re.fullmatch(r"[0-9a-f]{40}", pod_source_commit) is None:
              raise SystemExit("controller-lkg-pod-source-commit-invalid")
          print(owner)
          print(repository)
          print(digest)
          print(manifest_revision)
          print(pod_source_commit)
          PY
          )
          [[ "${#live_identity[@]}" -eq 5 ]]
          live_owner="${live_identity[0]}"
          [[ "${live_identity[1]}" == "${IMAGE_REPOSITORY}" ]]
          lkg_digest="${live_identity[2]}"
          lkg_source_sha="${live_identity[3]}"
          live_pod_source_commit="${live_identity[4]}"
          [[ "${lkg_digest}" == "${EXPECTED_PREVIOUS_IMAGE_DIGEST}" ]] || {
            printf 'controller-live-image-predecessor-digest-mismatch\n' >&2
            exit 1
          }
          git cat-file -e "${lkg_source_sha}^{commit}"
          python3 ./scripts/verify_registry_image.py \
            --image "${IMAGE_REPOSITORY}@${lkg_digest}" \
            --platform linux/amd64 \
            --metadata-only \
            --timeout-seconds 18 \
            --request-timeout-seconds 5 \
            --max-attempts 2 \
            --retry-delay-seconds 0.1 >"${root}/lkg-registry.json"
          lkg_oci_revision="$(python3 - "${root}/lkg-registry.json" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          value = json.loads(Path(sys.argv[1]).read_text())
          revision = value.get("oci_revision") if type(value) is dict else None
          if re.fullmatch(r"[0-9a-f]{40}", revision or "") is None:
              raise SystemExit("controller-lkg-oci-revision-invalid")
          print(revision)
          PY
          )"
          [[ "${lkg_oci_revision}" =~ ^[0-9a-f]{40}$ ]]
          case "${live_owner}" in
            legacy|helm)
              [[ -z "${live_pod_source_commit}" || "${live_pod_source_commit}" == "${EXPECTED_PREVIOUS_SOURCE_SHA}" ]] || {
                printf 'controller-live-pre-ssa-pod-source-predecessor-mismatch\n' >&2
                exit 1
              }
              ;;
            declarative)
              [[ "${live_pod_source_commit}" == "${EXPECTED_PREVIOUS_SOURCE_SHA}" ]] || {
                printf 'controller-live-pod-source-predecessor-mismatch\n' >&2
                exit 1
              }
              ;;
            *)
              printf 'controller-live-owner-predecessor-validation-invalid\n' >&2
              exit 1
              ;;
          esac
          [[ "${lkg_oci_revision}" == "${EXPECTED_PREVIOUS_SOURCE_SHA}" ]] || {
            printf 'controller-live-registry-source-predecessor-mismatch\n' >&2
            exit 1
          }
          git cat-file -e "${lkg_oci_revision}^{commit}"
          install -d -m 0700 "${root}/forward/base" "${root}/lkg/base"
          cp deploy/kustomize/controller/deployment.json deploy/kustomize/controller/kustomization.yaml "${root}/forward/base/"
          cp deploy/kustomize/controller/deployment.json deploy/kustomize/controller/kustomization.yaml "${root}/lkg/base/"
          ROOT="${root}" IMAGE_REPOSITORY="${IMAGE_REPOSITORY}" FORWARD_DIGEST="${FORWARD_DIGEST}" \
            LKG_DIGEST="${lkg_digest}" SOURCE_SHA="${GITHUB_SHA}" LKG_SOURCE_SHA="${lkg_source_sha}" \
            FORWARD_OCI_REVISION="${DESIRED_SOURCE_SHA}" LKG_OCI_REVISION="${lkg_oci_revision}" python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          root = Path(os.environ["ROOT"])
          repository = os.environ["IMAGE_REPOSITORY"]
          values = {
              "forward": (os.environ["FORWARD_DIGEST"], os.environ["SOURCE_SHA"], os.environ["FORWARD_OCI_REVISION"]),
              "lkg": (os.environ["LKG_DIGEST"], os.environ["LKG_SOURCE_SHA"], os.environ["LKG_OCI_REVISION"]),
          }
          if re.fullmatch(r"[a-z0-9.-]+/[a-z0-9._/-]+", repository) is None:
              raise SystemExit("controller-kustomize-repository-invalid")
          for name, (digest, revision, oci_revision) in values.items():
              if (re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None or
                      re.fullmatch(r"[0-9a-f]{40}", revision) is None or
                      re.fullmatch(r"[0-9a-f]{40}", oci_revision) is None):
                  raise SystemExit("controller-kustomize-pin-invalid")
              content = (
                  "apiVersion: kustomize.config.k8s.io/v1beta1\n"
                  "kind: Kustomization\n"
                  "resources:\n  - base\n"
                  "images:\n"
                  f"  - name: {repository}\n    newName: {repository}\n    digest: {digest}\n"
                  "patches:\n"
                  "  - target:\n"
                  "      group: apps\n"
                  "      version: v1\n"
                  "      kind: Deployment\n"
                  "      name: fugue-fugue-controller\n"
                  "    patch: |-\n"
                  "      - op: add\n"
                  "        path: /metadata/annotations/fugue.pro~1controller-manifest-revision\n"
                  f"        value: {revision}\n"
                  "      - op: replace\n"
                  "        path: /spec/template/metadata/annotations/fugue.pro~1source-commit\n"
                  f"        value: {oci_revision}\n"
              )
              path = root / name / "kustomization.yaml"
              path.write_text(content, encoding="ascii")
              path.chmod(0o600)
          PY
          kubectl kustomize "${root}/forward" --output "${root}/forward.json"
          kubectl kustomize "${root}/lkg" --output "${root}/lkg.json"
          chmod 0600 "${root}/forward.json" "${root}/lkg.json"
          {
            echo "forward_manifest=${root}/forward.json"
            echo "lkg_manifest=${root}/lkg.json"
            echo "lkg_digest=${lkg_digest}"
            echo "lkg_source_sha=${lkg_source_sha}"
            echo "lkg_oci_revision=${lkg_oci_revision}"
          } >>"${GITHUB_OUTPUT}"
      - name: Apply Controller with single-writer proof and exact live LKG rollback
        env:
          FUGUE_CONTROLLER_NAMESPACE: fugue-system
          FUGUE_CONTROLLER_HELM_RELEASE: fugue
          FUGUE_CONTROLLER_HELM_CHART: ${{ github.workspace }}/deploy/helm/fugue
          FUGUE_CONTROLLER_DEPLOYMENT: fugue-fugue-controller
          FUGUE_CONTROLLER_API_DEPLOYMENT: fugue-fugue-api
          FUGUE_CONTROLLER_LEADER_LEASE: fugue-fugue-controller
          FUGUE_CONTROLLER_IMAGE_REPOSITORY: ${{ needs.controller-build.outputs.image_repository }}
          FUGUE_CONTROLLER_IMAGE_DIGEST: ${{ needs.controller-build.outputs.image_digest }}
          FUGUE_CONTROLLER_LKG_IMAGE_DIGEST: ${{ steps.manifests.outputs.lkg_digest }}
          FUGUE_CONTROLLER_SOURCE_SHA: ${{ github.sha }}
          FUGUE_CONTROLLER_LKG_SOURCE_SHA: ${{ steps.manifests.outputs.lkg_source_sha }}
          FUGUE_CONTROLLER_OCI_REVISION: ${{ steps.intent.outputs.desired_source_sha }}
          FUGUE_CONTROLLER_LKG_OCI_REVISION: ${{ steps.manifests.outputs.lkg_oci_revision }}
        run: ./scripts/apply_controller_declarative.sh "${{ steps.manifests.outputs.forward_manifest }}" "${{ steps.manifests.outputs.lkg_manifest }}"

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run full audit suite
        run: make test
