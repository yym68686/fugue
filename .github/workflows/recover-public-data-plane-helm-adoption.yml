name: recover-public-data-plane-helm-adoption

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact Stage1 source commit recorded by the durable recovery WAL.
        required: true
        type: string
      expected_wal_digest:
        description: Exact durable recovery WAL digest read during incident qualification.
        required: true
        type: string
      origin_run_id:
        description: Exact failed Stage1 Actions run recorded by the WAL.
        required: true
        type: string
      confirm_recovery:
        description: Explicitly authorize recovery/finalization; false performs no recovery job work.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fugue-production-cluster-mutation-v1
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.confirm_recovery }}
    permissions:
      actions: read
      contents: read
    runs-on: [self-hosted, linux, x64, fugue, control-plane]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout exact recovery implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact recovery identity
        id: identity
        env:
          RECOVERY_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_REF: refs/heads/main
          ACTUAL_REF: ${{ github.ref }}
          EXPECTED_WAL_DIGEST: ${{ inputs.expected_wal_digest }}
          ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${RECOVERY_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${EXPECTED_WAL_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "${ORIGIN_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "${API_URL}" == 'https://api.github.com' ]] || exit 1
          [[ "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ -n "${GITHUB_TOKEN}" && "${GITHUB_TOKEN}" != *[[:space:]]* ]] || exit 1
          [[ "${ACTUAL_REF}" == "${EXPECTED_REF}" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "${RECOVERY_SHA}" ]] || exit 1
          [[ -z "$(git status --porcelain)" ]] || exit 1
          identity_dir="$(mktemp -d "${RUNNER_TEMP}/public-data-plane-recovery-identity.XXXXXX")"
          chmod 0700 "${identity_dir}"
          trap 'rm -rf -- "${identity_dir}"' EXIT
          curl_config="${identity_dir}/curl.config"
          CURL_CONFIG="${curl_config}" GITHUB_TOKEN="${GITHUB_TOKEN}" python3 - <<'PY'
          import os, pathlib, re
          token = os.environ["GITHUB_TOKEN"]
          assert re.fullmatch(r"[A-Za-z0-9_.-]+", token)
          path = pathlib.Path(os.environ["CURL_CONFIG"])
          path.write_text('header = "Authorization: Bearer '+token+'"\n', encoding="utf-8")
          path.chmod(0o600)
          PY
          [[ -f "${curl_config}" && ! -L "${curl_config}" ]] || exit 1
          github_api_get() {
            local path="$1" output="$2"
            curl --config "${curl_config}" \
              --fail --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 15 --retry 0 \
              --request GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "${output}" "${API_URL}/${path}"
            [[ -f "${output}" && ! -L "${output}" ]] || return 1
            chmod 0600 "${output}"
          }
          main_response="${identity_dir}/main-ref.json"
          github_api_get "repos/${REPOSITORY}/git/ref/heads/main" "${main_response}"
          MAIN_RESPONSE="${main_response}" RECOVERY_SHA="${RECOVERY_SHA}" python3 - <<'PY'
          import json, os, pathlib
          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate JSON key")
                  value[key] = item
              return value
          path = pathlib.Path(os.environ["MAIN_RESPONSE"])
          assert path.stat().st_size <= 1024 * 1024
          with open(os.environ["MAIN_RESPONSE"], encoding="utf-8") as source:
              value = json.load(source, object_pairs_hook=unique_object)
          assert isinstance(value, dict)
          target = value.get("object") or {}
          assert isinstance(target, dict)
          assert value.get("ref") == "refs/heads/main"
          assert target.get("type") == "commit"
          assert target.get("sha") == os.environ["RECOVERY_SHA"]
          PY
          git cat-file -e "${EXPECTED_SOURCE_SHA}^{commit}"
          git cat-file -e "${RECOVERY_SHA}^{commit}"
          git merge-base --is-ancestor "${EXPECTED_SOURCE_SHA}" "${RECOVERY_SHA}"
          commit_count="$(git rev-list --count "${EXPECTED_SOURCE_SHA}..${RECOVERY_SHA}")"
          [[ "${commit_count}" =~ ^[1-9][0-9]*$ && "${commit_count}" -le 3 ]] || exit 1
          [[ -z "$(git rev-list --min-parents=2 "${EXPECTED_SOURCE_SHA}..${RECOVERY_SHA}")" ]] || exit 1
          expected_delta=$'M\t.github/workflows/recover-public-data-plane-helm-adoption.yml\nM\tinternal/platformsafety/public_data_plane_adoption_workflow_test.go\nM\tinternal/releasedomain/public_data_plane_adoption.go\nM\tinternal/releasedomain/public_data_plane_adoption_test.go\nM\tscripts/adopt_public_data_plane_helm_baseline.sh\nM\tscripts/lib/public_data_plane_adoption_recovery.sh\nM\tscripts/recover_public_data_plane_helm_adoption.sh\nM\tscripts/test_public_data_plane_helm_adoption.sh\nM\tscripts/test_public_data_plane_helm_adoption_recovery.sh\nM\tscripts/test_release_domain_workflow.sh'
          [[ "$(git diff --name-status --no-renames "${EXPECTED_SOURCE_SHA}" "${RECOVERY_SHA}")" == "${expected_delta}" ]] || exit 1
          origin_response="${identity_dir}/origin-run.json"
          github_api_get "repos/${REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}" "${origin_response}"
          ORIGIN_RESPONSE="${origin_response}" ORIGIN_RUN_ID="${ORIGIN_RUN_ID}" \
            EXPECTED_SOURCE_SHA="${EXPECTED_SOURCE_SHA}" REPOSITORY="${REPOSITORY}" python3 - <<'PY'
          import json, os, pathlib
          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate JSON key")
                  value[key] = item
              return value
          path = pathlib.Path(os.environ["ORIGIN_RESPONSE"])
          assert path.stat().st_size <= 1024 * 1024
          with open(os.environ["ORIGIN_RESPONSE"], encoding="utf-8") as source:
              value = json.load(source, object_pairs_hook=unique_object)
          assert isinstance(value, dict)
          repository = value.get("repository") or {}
          assert isinstance(repository, dict)
          assert value.get("id") == int(os.environ["ORIGIN_RUN_ID"])
          assert value.get("run_attempt") == 1
          assert value.get("event") == "workflow_dispatch"
          assert value.get("head_branch") == "main"
          assert value.get("head_sha") == os.environ["EXPECTED_SOURCE_SHA"]
          assert value.get("status") == "completed"
          assert value.get("conclusion") in {"failure", "cancelled", "timed_out"}
          assert value.get("path") == ".github/workflows/adopt-public-data-plane-helm-baseline.yml"
          assert repository.get("full_name") == os.environ["REPOSITORY"]
          PY
          [[ -z "${FUGUE_PUBLIC_DATA_PLANE_ADOPTION_COORDINATION_LIBRARY:-}" ]] || exit 1
          [[ -z "${FUGUE_PUBLIC_DATA_PLANE_ADOPTION_RECOVERY_LIBRARY:-}" ]] || exit 1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build typed recovery tools
        run: |
          set -euo pipefail
          install -d -m 0700 ./bin
          go build -trimpath -o ./bin/fugue-public-data-plane-adoption ./cmd/fugue-public-data-plane-adoption
          go build -trimpath -o ./bin/fugue-release-domain-evidence ./cmd/fugue-release-domain-evidence
          bash -n ./scripts/recover_public_data_plane_helm_adoption.sh

      - name: Recover or finalize the durable Stage1 transaction
        id: recover
        env:
          FUGUE_RECOVERY_SHA: ${{ github.sha }}
          FUGUE_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          FUGUE_EXPECTED_WAL_DIGEST: ${{ inputs.expected_wal_digest }}
          FUGUE_EXPECTED_ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
          FUGUE_PUBLIC_DATA_PLANE_ADOPTION_EVIDENCE_DIR: ${{ runner.temp }}/public-data-plane-adoption-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          FUGUE_NAMESPACE: ${{ vars.FUGUE_NAMESPACE || 'fugue-system' }}
          FUGUE_RELEASE_NAME: ${{ vars.FUGUE_RELEASE_NAME || 'fugue' }}
          FUGUE_RELEASE_FULLNAME: ${{ vars.FUGUE_RELEASE_FULLNAME || 'fugue-fugue' }}
        run: ./scripts/recover_public_data_plane_helm_adoption.sh

      - name: Publish recovered Stage1 handoff
        if: ${{ always() && steps.identity.outcome == 'success' && steps.recover.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-data-plane-adoption-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-data-plane-adoption-recovery-${{ github.run_id }}-${{ github.run_attempt }}/terminal-wal.json
            ${{ runner.temp }}/public-data-plane-adoption-recovery-${{ github.run_id }}-${{ github.run_attempt }}/stage1-baseline.json
          if-no-files-found: error
          retention-days: 30
