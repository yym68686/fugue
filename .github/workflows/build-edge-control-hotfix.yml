name: build-edge-control-hotfix

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish edge-control
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.edge-control
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yym68686/fugue-edge-control:edge-state-capacity-fix-${{ inputs.expected_sha }}
