name: validate backup materializer Secret dry-run

on:
  push:
    branches:
      - main
    paths:
      - cmd/fugue-backup-materializer-validator/**
      - internal/backupcontrol/**
      - internal/backupmaterializer/contract/**
      - internal/backupmaterializer/dryrunreconciler/**
      - internal/backupmaterializer/materialization/**
      - internal/backupmaterializer/reconcile/**
      - internal/backupmaterializer/reconciler/**
      - internal/backupmaterializer/secretwriter/**
      - internal/backupmaterializer/validationagent/**
      - internal/backupmaterializer/validationcomposition/**
      - internal/backupmaterializer/validationcycle/**
      - .github/workflows/validate-backup-materializer-secret-dry-run.yml
      - go.mod
      - go.sum
  pull_request:
    paths:
      - cmd/fugue-backup-materializer-validator/**
      - internal/backupcontrol/**
      - internal/backupmaterializer/contract/**
      - internal/backupmaterializer/dryrunreconciler/**
      - internal/backupmaterializer/materialization/**
      - internal/backupmaterializer/reconcile/**
      - internal/backupmaterializer/reconciler/**
      - internal/backupmaterializer/secretwriter/**
      - internal/backupmaterializer/validationagent/**
      - internal/backupmaterializer/validationcomposition/**
      - internal/backupmaterializer/validationcycle/**
      - .github/workflows/validate-backup-materializer-secret-dry-run.yml
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: backup-materializer-secret-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-only:
    name: validate backup materializer Secret dry-run (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify fixed dry-run and dependency boundary
        run: |
          set -euo pipefail
          go test ./internal/backupmaterializer/secretwriter/... -count=10
          go test -race ./internal/backupmaterializer/secretwriter/... -count=3
          deps="$(go list -deps ./internal/backupmaterializer/secretwriter)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(composition|httpapi|localissuer|storesource)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${deps}"; then
            echo 'backup materializer Secret dry-run dependency boundary widened' >&2
            exit 1
          fi
          local_deps="$(grep '^fugue/' <<<"${deps}" | sort -u)"
          expected_local_deps=$'fugue/internal/backupcontrol\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/secretwriter'
          if [[ "${local_deps}" != "${expected_local_deps}" ]]; then
            printf 'backup materializer Secret dry-run local dependency closure drifted:\n%s\n' "${local_deps}" >&2
            exit 1
          fi
          projected_deps="$(go list -deps ./internal/backupmaterializer/secretwriter/projected)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(client|composition|httpapi|localissuer|secretreader|storesource)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${projected_deps}"; then
            echo 'backup materializer projected Secret dry-run dependency boundary widened' >&2
            exit 1
          fi
          projected_local_deps="$(grep '^fugue/' <<<"${projected_deps}" | sort -u)"
          expected_projected_local_deps=$'fugue/internal/backupcontrol\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/secretwriter\nfugue/internal/backupmaterializer/secretwriter/projected'
          if [[ "${projected_local_deps}" != "${expected_projected_local_deps}" ]]; then
            printf 'backup materializer projected Secret dry-run local dependency closure drifted:\n%s\n' "${projected_local_deps}" >&2
            exit 1
          fi
          go test ./internal/backupmaterializer/dryrunreconciler -count=10
          go test -race ./internal/backupmaterializer/dryrunreconciler -count=3
          cycle_deps="$(go list -deps ./internal/backupmaterializer/dryrunreconciler)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(agent|client|composition|httpapi|legacysource|localissuer|secretreader|secretwriter/projected|storesource)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${cycle_deps}"; then
            echo 'backup materializer Secret dry-run cycle dependency boundary widened' >&2
            exit 1
          fi
          cycle_local_deps="$(grep '^fugue/' <<<"${cycle_deps}" | sort -u)"
          expected_cycle_local_deps=$'fugue/internal/backupcontrol\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/dryrunreconciler\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/reconciler\nfugue/internal/backupmaterializer/secretwriter'
          if [[ "${cycle_local_deps}" != "${expected_cycle_local_deps}" ]]; then
            printf 'backup materializer Secret dry-run cycle local dependency closure drifted:\n%s\n' "${cycle_local_deps}" >&2
            exit 1
          fi
          go test ./internal/backupmaterializer/validationcycle -count=10
          go test -race ./internal/backupmaterializer/validationcycle -count=3
          composition_deps="$(go list -deps ./internal/backupmaterializer/validationcycle)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(agent|client|composition|httpapi|legacysource|localissuer|secretreader|secretwriter/projected|storesource)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${composition_deps}"; then
            echo 'backup materializer validation cycle dependency boundary widened' >&2
            exit 1
          fi
          composition_local_deps="$(grep '^fugue/' <<<"${composition_deps}" | sort -u)"
          expected_composition_local_deps=$'fugue/internal/backupcontrol\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/dryrunreconciler\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/reconciler\nfugue/internal/backupmaterializer/secretwriter\nfugue/internal/backupmaterializer/validationcycle'
          if [[ "${composition_local_deps}" != "${expected_composition_local_deps}" ]]; then
            printf 'backup materializer validation cycle local dependency closure drifted:\n%s\n' "${composition_local_deps}" >&2
            exit 1
          fi
          go test ./internal/backupmaterializer/validationagent -count=10
          go test -race ./internal/backupmaterializer/validationagent -count=3
          agent_deps="$(go list -deps ./internal/backupmaterializer/validationagent)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(agent|client|composition|httpapi|legacysource|localissuer|secretreader|secretwriter/projected|storesource)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${agent_deps}"; then
            echo 'backup materializer validation agent dependency boundary widened' >&2
            exit 1
          fi
          agent_local_deps="$(grep '^fugue/' <<<"${agent_deps}" | sort -u)"
          expected_agent_local_deps=$'fugue/internal/backupcontrol\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/dryrunreconciler\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/reconciler\nfugue/internal/backupmaterializer/secretwriter\nfugue/internal/backupmaterializer/validationagent\nfugue/internal/backupmaterializer/validationcycle'
          if [[ "${agent_local_deps}" != "${expected_agent_local_deps}" ]]; then
            printf 'backup materializer validation agent local dependency closure drifted:\n%s\n' "${agent_local_deps}" >&2
            exit 1
          fi
          go test ./internal/backupmaterializer/validationcomposition -count=10
          go test -race ./internal/backupmaterializer/validationcomposition -count=3
          root_deps="$(go list -deps ./internal/backupmaterializer/validationcomposition)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(agent|composition|httpapi|legacysource|localissuer|storesource)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${root_deps}"; then
            echo 'backup materializer validation composition dependency boundary widened' >&2
            exit 1
          fi
          root_local_deps="$(grep '^fugue/' <<<"${root_deps}" | sort -u)"
          expected_root_local_deps=$'fugue/internal/backupcontrol\nfugue/internal/backupmaterializer/client\nfugue/internal/backupmaterializer/client/projected\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/dryrunreconciler\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/reconciler\nfugue/internal/backupmaterializer/secretreader\nfugue/internal/backupmaterializer/secretreader/projected\nfugue/internal/backupmaterializer/secretwriter\nfugue/internal/backupmaterializer/secretwriter/projected\nfugue/internal/backupmaterializer/validationagent\nfugue/internal/backupmaterializer/validationcomposition\nfugue/internal/backupmaterializer/validationcycle'
          if [[ "${root_local_deps}" != "${expected_root_local_deps}" ]]; then
            printf 'backup materializer validation composition local dependency closure drifted:\n%s\n' "${root_local_deps}" >&2
            exit 1
          fi
          go test ./cmd/fugue-backup-materializer-validator -count=10
          go test -race ./cmd/fugue-backup-materializer-validator -count=3
          command_deps="$(go list -deps ./cmd/fugue-backup-materializer-validator)"
          if grep -Eq '^(database/sql|os/exec|fugue/internal/(api|auth|backupidentity|backupmaterializer/(agent|composition|httpapi|legacysource|localissuer|storesource)|backupmaterializeridentity|backupmaterializerreview|controller|model|store)|k8s.io/|github.com/(aws|google/go-containerregistry|jackc))' <<<"${command_deps}"; then
            echo 'backup materializer validator command dependency boundary widened' >&2
            exit 1
          fi
          command_local_deps="$(grep '^fugue/' <<<"${command_deps}" | sort -u)"
          expected_command_local_deps=$'fugue/cmd/fugue-backup-materializer-validator\nfugue/internal/backupcontrol\nfugue/internal/backupmaterializer/client\nfugue/internal/backupmaterializer/client/projected\nfugue/internal/backupmaterializer/contract\nfugue/internal/backupmaterializer/dryrunreconciler\nfugue/internal/backupmaterializer/materialization\nfugue/internal/backupmaterializer/reconcile\nfugue/internal/backupmaterializer/reconciler\nfugue/internal/backupmaterializer/secretreader\nfugue/internal/backupmaterializer/secretreader/projected\nfugue/internal/backupmaterializer/secretwriter\nfugue/internal/backupmaterializer/secretwriter/projected\nfugue/internal/backupmaterializer/validationagent\nfugue/internal/backupmaterializer/validationcomposition\nfugue/internal/backupmaterializer/validationcycle'
          if [[ "${command_local_deps}" != "${expected_command_local_deps}" ]]; then
            printf 'backup materializer validator command local dependency closure drifted:\n%s\n' "${command_local_deps}" >&2
            exit 1
          fi
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -buildvcs=false -o "/tmp/fugue-backup-materializer-validator-${arch}" \
              ./cmd/fugue-backup-materializer-validator
          done
