# Branch-only runner harness. Never merge this file or its branch exclusion.
name: verify-dns-candidate

on:
  push:
    branches: ['verify/fugue-dns-20261120-76bd1805']

permissions:
  contents: read

env:
  FUGUE_SOURCE: 76bd1805eb5a80ac6d21df3191de4e3f24bdacea
  FUGUE_BASE: 026e8392a4052906c9ed1c2703172665e4977b8d
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  transport-rehearsal:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/verify/fugue-dns-20261120-76bd1805'
      && !startsWith(github.event.head_commit.message, 'Rehearsal only: verify DNS checkpoints')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Rehearse DNS transport and explicit rollback on a disposable cluster
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FUGUE_SOURCE" HEAD
          unexpected="$(git diff --name-only "$FUGUE_SOURCE" HEAD -- . ':!.github/workflows/ci.yml' ':!.github/workflows/verify-dns-candidate.yml' ':!scripts/verify_dns_transport_isolation.py' ':!scripts/testdata/dns_checkpoint_compatibility_test.go' ':!scripts/testdata/dns_oci_smoke.go')"
          test -z "$unexpected"
          bindir="$(mktemp -d "$RUNNER_TEMP/fugue-kind.XXXXXX")"
          curl -fsSL --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64 -o "$bindir/kind"
          echo "517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  $bindir/kind" | sha256sum -c -
          chmod 755 "$bindir/kind"
          curl -fsSL --retry 3 https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl -o "$bindir/kubectl"
          echo "cfda68cba5848bc3b6c6135ae2f20ba2c78de20059f68789c090166d6abc3e2c  $bindir/kubectl" | sha256sum -c -
          chmod 755 "$bindir/kubectl"
          export PATH="$bindir:$PATH"
          export KUBECONFIG="$bindir/no-production-context"
          python3 -m scripts.verify_dns_transport_isolation
  checkpoint-compatibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/fugue-dns-20261120-76bd1805'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FUGUE_CURRENT_DNS: f9e131bbc61c2fbf19fc393bbc7cb7a268d8b493
      FUGUE_ROLLBACK_DNS: a7db1ac3ec17660a3b15329f3cb46e5f9b2e16ef
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Read synthetic global checkpoints in both directions
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FUGUE_SOURCE" HEAD
          git merge-base --is-ancestor "$FUGUE_ROLLBACK_DNS" "$FUGUE_BASE"
          git merge-base --is-ancestor "$FUGUE_CURRENT_DNS" "$FUGUE_BASE"
          workspace="$(mktemp -d "$RUNNER_TEMP/fugue-dns-checkpoints.XXXXXX")"
          echo "FUGUE_FIXTURE_WORK=$workspace" >> "$GITHUB_ENV"
          for revision in "$FUGUE_CURRENT_DNS" "$FUGUE_ROLLBACK_DNS" "$FUGUE_SOURCE"; do
            git worktree add --detach "$workspace/$revision" "$revision"
            cp scripts/testdata/dns_checkpoint_compatibility_test.go "$workspace/$revision/internal/dnsserver/hosted_global_checkpoint_test.go"
            (
              cd "$workspace/$revision"
              test "$(git rev-parse HEAD)" = "$revision"
              go test -p 2 -c -o "$workspace/test-$revision" ./internal/dnsserver
            )
            FUGUE_CHECKPOINT_FIXTURE="$workspace/$revision-cache" FUGUE_CHECKPOINT_MODE=write \
              "$workspace/test-$revision" -test.v -test.run '^TestHostedGlobalDNSCheckpointCrossVersion$' -test.timeout 45s
          done
          for deployment in "$FUGUE_CURRENT_DNS" "$FUGUE_ROLLBACK_DNS"; do
            for writer in "$deployment" "$FUGUE_SOURCE"; do
              reader="$FUGUE_SOURCE"
              if [[ "$writer" = "$FUGUE_SOURCE" ]]; then reader="$deployment"; fi
              echo "writer=$writer reader=$reader scope=global"
              FUGUE_CHECKPOINT_FIXTURE="$workspace/$writer-cache" FUGUE_CHECKPOINT_MODE=read \
                "$workspace/test-$reader" -test.v -test.run '^TestHostedGlobalDNSCheckpointCrossVersion$' -test.timeout 45s
            done
          done
      - name: Start the production-recipe OCI image with no network
        if: >-
          startsWith(github.event.head_commit.message, 'Rehearsal only: verify DNS checkpoints and OCI')
        timeout-minutes: 18
        run: |
          set -euo pipefail
          source_tree="$FUGUE_FIXTURE_WORK/$FUGUE_SOURCE"
          test "$(git -C "$source_tree" rev-parse HEAD)" = "$FUGUE_SOURCE"
          test -z "$(git -C "$source_tree" status --short --untracked-files=no)"
          # Keep branch-only injected tests outside the Docker build context.
          image_context="$FUGUE_FIXTURE_WORK/oci-source"
          mkdir "$image_context"
          git archive "$FUGUE_SOURCE" | tar -x -C "$image_context"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$FUGUE_FIXTURE_WORK/dns-probe" scripts/testdata/dns_oci_smoke.go
          image="fugue-dns-oci-smoke:$FUGUE_SOURCE"
          docker build --label "org.opencontainers.image.revision=$FUGUE_SOURCE" --platform linux/amd64 \
            -f "$image_context/Dockerfile.edge" -t "$image" "$image_context"
          docker image inspect "$image" --format 'image={{.Id}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
          for writer in "$FUGUE_CURRENT_DNS" "$FUGUE_ROLLBACK_DNS"; do
            state="$(mktemp -d "$FUGUE_FIXTURE_WORK/state.XXXXXX")"
            install -m 0600 "$FUGUE_FIXTURE_WORK/$writer-cache.platform-serving.json" "$state/cache.platform-serving.json"
            name="fugue-dns-oci-smoke-${writer:0:12}"
            trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
            docker run -d --name "$name" --network none --read-only --security-opt=no-new-privileges \
              --memory 256m --memory-swap 256m --pids-limit 64 --tmpfs /tmp:rw,size=8m \
              --mount "type=bind,src=$state,dst=/state" \
              --mount "type=bind,src=$FUGUE_FIXTURE_WORK/dns-probe,dst=/smoke,readonly" \
              -e FUGUE_API_URL=http://127.0.0.1:1 -e FUGUE_PLATFORM_ARTIFACT_SCOPE=global \
              -e FUGUE_DNS_ZONE=example.test -e FUGUE_DNS_NODE_ID=dns-a -e FUGUE_EDGE_GROUP_ID=edge-group-a \
              -e FUGUE_DNS_PUBLIC_IPV4=192.0.2.10 -e FUGUE_DNS_PLATFORM_TOKEN_FILE=/state/not-a-real-token \
              -e FUGUE_DNS_CACHE_PATH=/state/cache -e FUGUE_DNS_LISTEN_ADDR=127.0.0.1:7834 \
              -e FUGUE_DNS_UDP_ADDR=:53 -e FUGUE_DNS_TCP_ADDR=:53 -e GOMEMLIMIT=48MiB \
              -e FUGUE_BUNDLE_SIGNING_KEY=synthetic-dns-serving-secret -e FUGUE_BUNDLE_SIGNING_KEY_ID=key \
              --entrypoint /usr/local/bin/fugue-dns "$image"
            ready=false
            for attempt in $(seq 1 15); do
              if docker exec "$name" /smoke; then ready=true; break; fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then docker logs --tail 16 "$name"; exit 1; fi
            test "$(docker inspect "$name" --format '{{.State.Running}} {{.State.OOMKilled}} {{.HostConfig.NetworkMode}} {{.HostConfig.Memory}}')" = 'true false none 268435456'
            cmp "$FUGUE_FIXTURE_WORK/$writer-cache.platform-serving.json" "$state/cache.platform-serving.json"
            echo "runtime_candidate=$FUGUE_SOURCE checkpoint_writer=$writer"
            docker stop --time 8 "$name" >/dev/null
            docker rm "$name" >/dev/null
            trap - EXIT
          done
  full-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/fugue-dns-20261120-76bd1805' && !startsWith(github.event.head_commit.message, 'Rehearsal only:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.FUGUE_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - name: Verify candidate identity and run all tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FUGUE_SOURCE"
          git merge-base --is-ancestor "$FUGUE_BASE" HEAD
          test -z "$(git status --porcelain)"
          df -h .
          make test GOCACHE="$(go env GOCACHE)"
  bounded-prepush:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/fugue-dns-20261120-76bd1805' && !startsWith(github.event.head_commit.message, 'Rehearsal only:')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.FUGUE_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - name: Warm exactly the CI test binaries
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FUGUE_SOURCE"
          git merge-base --is-ancestor "$FUGUE_BASE" HEAD
          test -z "$(git status --porcelain)"
          go mod download
          go test ./... -run '^$'
      - name: Run the production CI test contract without the deploy plan
        env:
          PREPUSH_BASE_REF: ${{ env.FUGUE_BASE }}
          PREPUSH_TIMEOUT_SECONDS: '360'
          PREPUSH_MAX_ELAPSED_SECONDS: '360'
          PREPUSH_RECEIPT: ${{ runner.temp }}/fugue-prepush-receipt.json
        run: make prepush
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: candidate-test-receipt
          path: ${{ runner.temp }}/fugue-prepush-receipt.json
          if-no-files-found: ignore
          retention-days: 7
