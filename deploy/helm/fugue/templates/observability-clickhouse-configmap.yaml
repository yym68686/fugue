{{- if .Values.observability.analytics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-observability-clickhouse" (include "fugue.fullname" .) }}
  labels:
    {{- include "fugue.componentLabels" (dict "root" . "component" "observability-clickhouse") | nindent 4 }}
data:
  fugue-observability.xml: |
    <clickhouse>
      <logger>
        <level>information</level>
        <console>true</console>
      </logger>
      <max_server_memory_usage>3221225472</max_server_memory_usage>
      <query_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </query_log>
      <query_thread_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </query_thread_log>
      <query_views_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </query_views_log>
      <trace_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </trace_log>
      <metric_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </metric_log>
      <asynchronous_metric_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </asynchronous_metric_log>
      <query_metric_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </query_metric_log>
      <asynchronous_insert_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </asynchronous_insert_log>
      <part_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </part_log>
      <processors_profile_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </processors_profile_log>
      <text_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </text_log>
      <error_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </error_log>
      <background_schedule_pool_log>
        <partition_by>toDate(event_date)</partition_by>
        <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        <settings>ttl_only_drop_parts = 1</settings>
      </background_schedule_pool_log>
    </clickhouse>
  fugue-observability-users.xml: |
    <clickhouse>
      <profiles>
        <default>
          <max_memory_usage>805306368</max_memory_usage>
          <max_bytes_before_external_group_by>268435456</max_bytes_before_external_group_by>
          <max_bytes_before_external_sort>268435456</max_bytes_before_external_sort>
          <join_algorithm>auto</join_algorithm>
          <memory_overcommit_ratio_denominator>2147483648</memory_overcommit_ratio_denominator>
        </default>
      </profiles>
    </clickhouse>
  init-observability.sql: |
    CREATE DATABASE IF NOT EXISTS fugue_observability;

    CREATE TABLE IF NOT EXISTS fugue_observability.request_facts
    (
      ts DateTime64(3, 'UTC'),
      tenant_id String,
      project_id String,
      app_id String,
      runtime_id String,
      edge_id String,
      pod String,
      trace_id String,
      request_id String,
      route_id String,
      decision_id String,
      bundle_version String,
      route_generation String,
      correlation_key String,
      status_reason String,
      platform_error_class LowCardinality(String),
      origin_connected Bool,
      edge_group_id String,
      slot LowCardinality(String),
      release_epoch String,
      hostname String,
      path_template String,
      method LowCardinality(String),
      status_code UInt16,
      status_class LowCardinality(String),
      duration_ms UInt32,
      ttfb_ms UInt32,
      upstream_ms UInt32,
      bytes_in UInt64,
      bytes_out UInt64,
      streaming Bool,
      error_type LowCardinality(String),
      deployment_id String,
      operation_id String,
      summary_json String
    )
    ENGINE = MergeTree
    PARTITION BY toDate(ts)
    ORDER BY (tenant_id, project_id, app_id, ts, trace_id, request_id)
    TTL ts + INTERVAL 7 DAY DELETE;

    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS decision_id String AFTER route_id;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS bundle_version String AFTER decision_id;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS route_generation String AFTER bundle_version;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS correlation_key String AFTER route_generation;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS status_reason String AFTER correlation_key;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS platform_error_class LowCardinality(String) AFTER status_reason;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS origin_connected Bool AFTER platform_error_class;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS edge_group_id String AFTER origin_connected;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS slot LowCardinality(String) AFTER edge_group_id;
    ALTER TABLE fugue_observability.request_facts ADD COLUMN IF NOT EXISTS release_epoch String AFTER slot;
    ALTER TABLE fugue_observability.request_facts MODIFY TTL ts + INTERVAL 7 DAY DELETE;

    CREATE TABLE IF NOT EXISTS fugue_observability.edge_route_decisions
    (
      ts DateTime64(3, 'UTC'),
      ingested_at_unix_nano UInt64,
      tenant_id String,
      project_id String,
      app_id String,
      hostname String,
      path_prefix String,
      edge_group_id String,
      decision_id String,
      bundle_version String,
      route_generation String,
      correlation_key String,
      final_status LowCardinality(String),
      platform_error_class LowCardinality(String),
      final_reason String,
      invariant_violations_json String,
      material_json String
    )
    ENGINE = ReplacingMergeTree(ingested_at_unix_nano)
    ORDER BY (tenant_id, app_id, decision_id, bundle_version, route_generation)
    TTL ts + INTERVAL 30 DAY DELETE;

    CREATE TABLE IF NOT EXISTS fugue_observability.edge_route_decision_missing_links
    (
      ts DateTime64(3, 'UTC'),
      ingested_at_unix_nano UInt64,
      tenant_id String,
      app_id String,
      hostname String,
      request_id String,
      edge_id String,
      decision_id String,
      bundle_version String,
      route_generation String,
      correlation_key String,
      reason String,
      material_json String
    )
    ENGINE = ReplacingMergeTree(ingested_at_unix_nano)
    ORDER BY (tenant_id, app_id, correlation_key, request_id)
    TTL ts + INTERVAL 30 DAY DELETE;

    CREATE TABLE IF NOT EXISTS fugue_observability.request_spans
    (
      ts DateTime64(3, 'UTC'),
      tenant_id String,
      project_id String,
      app_id String,
      runtime_id String,
      service LowCardinality(String),
      trace_id String,
      span_id String,
      parent_span_id String,
      request_id String,
      stage LowCardinality(String),
      stage_ms UInt32,
      status_code UInt16,
      error_type LowCardinality(String),
      attributes_json String
    )
    ENGINE = MergeTree
    PARTITION BY toDate(ts)
    ORDER BY (tenant_id, project_id, app_id, trace_id, ts, stage)
    TTL ts + INTERVAL 1 DAY DELETE;

    CREATE TABLE IF NOT EXISTS fugue_observability.app_events
    (
      ts DateTime64(3, 'UTC'),
      tenant_id String,
      project_id String,
      app_id String,
      event_type LowCardinality(String),
      severity LowCardinality(String),
      operation_id String,
      deployment_id String,
      runtime_id String,
      pod String,
      message String,
      attributes_json String
    )
    ENGINE = MergeTree
    PARTITION BY toDate(ts)
    ORDER BY (tenant_id, project_id, app_id, ts, event_type)
    TTL ts + INTERVAL 1 DAY DELETE;

    CREATE TABLE IF NOT EXISTS fugue_observability.diagnosis_windows_1m
    (
      minute DateTime('UTC'),
      tenant_id String,
      project_id String,
      app_id String,
      rpm UInt32,
      p50_ttfb_ms Float64,
      p95_ttfb_ms Float64,
      p99_ttfb_ms Float64,
      p50_duration_ms Float64,
      p95_duration_ms Float64,
      p99_duration_ms Float64,
      error_rate Float64,
      top_bottleneck_stage String,
      top_bottleneck_confidence Float64
    )
    ENGINE = MergeTree
    PARTITION BY toDate(minute)
    ORDER BY (tenant_id, project_id, app_id, minute)
    TTL minute + INTERVAL 1 DAY DELETE;

    CREATE TABLE IF NOT EXISTS fugue_observability.release_gate_rollups_1m
    (
      minute DateTime('UTC'),
      tenant_id String,
      project_id String,
      app_id String,
      release_id String,
      release_role LowCardinality(String),
      request_count UInt64,
      error_5xx_count UInt64,
      edge_upstream_error_count UInt64,
      p95_ttfb_ms Float64,
      p99_duration_ms Float64
    )
    ENGINE = MergeTree
    PARTITION BY toDate(minute)
    ORDER BY (tenant_id, project_id, app_id, release_id, release_role, minute)
    TTL minute + INTERVAL 1 DAY DELETE;

    CREATE MATERIALIZED VIEW IF NOT EXISTS fugue_observability.release_gate_rollups_1m_mv
    TO fugue_observability.release_gate_rollups_1m
    AS SELECT
      toStartOfMinute(ts) AS minute,
      tenant_id,
      project_id,
      app_id,
      JSONExtractString(summary_json, 'release_id') AS release_id,
      JSONExtractString(summary_json, 'release_role') AS release_role,
      count() AS request_count,
      countIf(status_code >= 500) AS error_5xx_count,
      countIf(error_type = 'upstream_error') AS edge_upstream_error_count,
      quantileTDigest(0.95)(toFloat64(ttfb_ms)) AS p95_ttfb_ms,
      quantileTDigestIf(0.99)(toFloat64(duration_ms), NOT (streaming OR JSONExtractBool(summary_json, 'sse') OR JSONExtractBool(summary_json, 'stream') OR JSONExtractBool(summary_json, 'streaming'))) AS p99_duration_ms
    FROM fugue_observability.request_facts
    WHERE app_id != '' AND (JSONExtractString(summary_json, 'release_id') != '' OR JSONExtractString(summary_json, 'release_role') != '')
    GROUP BY minute, tenant_id, project_id, app_id, release_id, release_role;
{{- end }}
