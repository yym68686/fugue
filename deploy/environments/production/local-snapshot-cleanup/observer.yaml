apiVersion: v1
kind: ServiceAccount
metadata:
  name: fugue-longhorn-cleanup-observer
  namespace: fugue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fugue-longhorn-cleanup-observer
  namespace: fugue-system
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: [fugue-fugue-control-plane-postgres]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [fugue-fugue-control-plane-db-backup]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fugue-longhorn-cleanup-observer
  namespace: fugue-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fugue-longhorn-cleanup-observer
subjects:
  - kind: ServiceAccount
    name: fugue-longhorn-cleanup-observer
    namespace: fugue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fugue-longhorn-cleanup-observer
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get]
  - apiGroups: [longhorn.io]
    resources: [snapshots]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fugue-longhorn-cleanup-observer
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fugue-longhorn-cleanup-observer
subjects:
  - kind: ServiceAccount
    name: fugue-longhorn-cleanup-observer
    namespace: fugue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fugue-longhorn-cleanup-observer
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fugue-longhorn-cleanup-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fugue-longhorn-cleanup-observer
subjects:
  - kind: ServiceAccount
    name: fugue-longhorn-cleanup-observer
    namespace: fugue-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fugue-longhorn-cleanup-observer
  namespace: fugue-system
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 90
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: fugue-longhorn-cleanup-observer
    spec:
      activeDeadlineSeconds: 75
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fugue-longhorn-cleanup-observer
        spec:
          serviceAccountName: fugue-longhorn-cleanup-observer
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            seccompProfile: {type: RuntimeDefault}
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: inventory
              image: docker.io/library/python:3.13-slim-bookworm@sha256:a5a7017efc5969e00ae2b91c8eb0631049a569652aa4ffc4501769049ae45c72
              args: ["python3", "-IB", "/inputs/observe.py", "/inputs/policy.json"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 100m, memory: 96Mi}
              volumeMounts:
                - name: inputs
                  mountPath: /inputs
                  readOnly: true
          volumes:
            - name: inputs
              configMap:
                name: fugue-longhorn-cleanup-observer-input
