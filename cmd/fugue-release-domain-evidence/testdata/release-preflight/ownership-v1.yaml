apiVersion: release-domain.fugue.dev/v1
kind: ReleaseDomainOwnership
domains: [node-local, authoritative-dns, control-plane, image-cache, backup]
requiredBindings: [releaseNamespace]
fileRules: []
valueRules: []
objectRules:
  - id: api
    domain: control-plane
    apiGroup: apps
    version: v1
    kind: Deployment
    scope: Namespaced
    namespace: ${releaseNamespace}
    name: fugue-api
  - id: telemetry
    domain: control-plane
    apiGroup: apps
    version: v1
    kind: Deployment
    scope: Namespaced
    namespace: ${releaseNamespace}
    name: fugue-telemetry-agent
