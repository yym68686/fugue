apiVersion: apps/v1
kind: Deployment
metadata:
  name: fugue-api
  namespace: fugue-system
spec:
  selector:
    matchLabels:
      app: fugue-api
  template:
    metadata:
      labels:
        app: fugue-api
    spec:
      containers:
        - image: registry.test/api@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          name: api
      volumes:
        - downwardAPI:
            items:
              - fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/hostname']
                path: node_name
          name: node-identity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fugue-telemetry-agent
  namespace: fugue-system
spec:
  selector:
    matchLabels:
      app: fugue-telemetry-agent
  template:
    metadata:
      labels:
        app: fugue-telemetry-agent
    spec:
      containers:
        - image: registry.test/telemetry@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          name: telemetry-agent
      volumes:
        - downwardAPI:
            items:
              - fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/hostname']
                path: node_name
          name: node-identity
